<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>100억 — 교사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&family=Jua&family=Gaegu:wght@400;700&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4efe4;--dim:#a89e8f;--dim2:#6d6558;--line:#3a352d;--bg:#17150f;--card:#221f18;
 --gold:#e8ab45;--green:#55b981;--red:#e8593c;--blue:#5d9fd6;--fs:1;
 --font:'Dongle','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
 font-family:var(--font);word-break:keep-all}
button,select{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app{height:100%;display:flex;flex-direction:column;font-size:calc(16px * var(--fs))}

/* ══ 조종석 ══ */
.pilot{flex:none;background:#0c0a06;border-bottom:2px solid #2a251b}
.pilot.hide{display:none}
.row1{display:flex;align-items:stretch;gap:12px;padding:8px 12px}
.nowbox{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.nowbox .st{font-size:.85em;color:var(--dim2);letter-spacing:.08em}
.nowbox .nm{font-size:1.6em;font-weight:700;line-height:1.1}
.nowbox .hint{font-size:1em;color:var(--gold);line-height:1.25}
.nowbox .hint b{color:var(--ink)}
.nextbtn{flex:none;min-width:330px;border-radius:15px;background:var(--gold);color:#17150f;
 font-weight:700;padding:10px 22px;display:flex;flex-direction:column;justify-content:center;
 align-items:center;line-height:1.1;box-shadow:0 3px 0 #a97a2c}
.nextbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #a97a2c}
.nextbtn .k{font-size:.8em;opacity:.7}
.nextbtn .v{font-size:1.5em}
.nextbtn.ready{animation:rdy 1s ease-in-out infinite}
@keyframes rdy{0%,100%{box-shadow:0 3px 0 #a97a2c}50%{box-shadow:0 3px 0 #a97a2c,0 0 26px rgba(232,171,69,.75)}}
.nextbtn.end{background:#2d2820;color:#5f5849;box-shadow:none}
.row2{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 12px 8px;font-size:.92em}
.row2 button,.row2 select{padding:6px 11px;border-radius:9px;background:#241f16;border:1px solid #3d372c;font-weight:700}
.row2 button:hover{background:#332c1e}
.row2 button.hot{background:#3a2c10;border-color:var(--gold);color:var(--gold)}
.row2 button.dan{background:#3a1c14;color:#ffb4a0;border-color:#5c2f22}
.row2 .sep{width:1px;height:20px;background:#3d372c;margin:0 4px}
.row2 .lb{color:var(--dim2);font-size:.9em}

/* ══ 무대 ══ */
.stage{flex:1;display:flex;flex-direction:column;min-height:0;padding:14px 22px}
h1{font-size:2.5em;margin:0;font-weight:700;line-height:1.1}
.sub{color:var(--dim);font-size:1.1em}
.sub b{color:var(--gold)}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
 text-align:center;gap:8px;min-height:0}
.mid .big{font-size:4.4em;line-height:1}
.mid h2{font-size:2.6em;margin:0;font-weight:700;line-height:1.15}
.mid p{font-size:1.35em;color:var(--dim);margin:0;line-height:1.55;white-space:pre-line}
.mid p b{color:var(--ink)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes sl{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{animation:pl 1.6s ease-in-out infinite}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.grid8{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;width:100%}
.tc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 11px;animation:sl .3s}
.tc .h{display:flex;align-items:baseline;gap:7px}
.tc .h b{font-size:1.4em}
.tc .h .n{margin-left:auto;font-size:.85em;color:var(--dim2)}
.tc.done{border-color:#2f6b4a;background:#1a2a20}
.tc.wait{opacity:.42}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chips span{background:#2a251b;border:1px solid #3d372c;border-radius:9px;padding:2px 7px;font-size:.95em}

.evhead{display:flex;align-items:center;gap:16px;padding:2px 0 9px;border-bottom:1px solid var(--line)}
.evhead.hasbg{background-size:cover;background-position:center;border-radius:14px;padding:10px 18px;margin-bottom:2px}
.bgwrap{position:absolute;inset:0;z-index:-1;background-size:cover;background-position:center}
.stage{position:relative}
.evhead .em{font-size:2.8em;line-height:1}
.evhead .when{font-size:.92em;color:var(--gold);letter-spacing:.09em}
.evhead h2{font-size:2.2em;margin:0;font-weight:700;line-height:1.1}
.evhead .ds{font-size:1.02em;color:var(--dim);white-space:pre-line;line-height:1.35}
.evhead .cnt{margin-left:auto;text-align:right}
.evhead .cnt b{font-size:2.4em;color:var(--gold);font-variant-numeric:tabular-nums}

.rows{flex:1;overflow:auto;margin-top:8px}
.rw{display:flex;align-items:center;gap:12px;padding:5px 14px;border-radius:12px;margin-bottom:4px;
 background:var(--card);font-size:1.2em;animation:sl .28s both}
.rw .t{font-weight:700;width:56px;flex:none}
.rw .u{display:flex;gap:5px;flex:none;width:250px;flex-wrap:wrap}
.rw .u span{background:#2a251b;border:1px solid #3d372c;border-radius:9px;padding:1px 7px;font-size:.85em}
.rw .u.nw{flex-wrap:nowrap;overflow:hidden}
.rw .u.nw span{padding:1px 4px;flex:none}
.rw .p.fin{display:flex;align-items:baseline;gap:5px;justify-content:flex-end;font-size:1.05em;white-space:nowrap}
.rw .p.fin .a{color:#8fe6b6} .rw .p.fin .b{color:var(--gold)} .rw .p.fin .o{color:var(--dim2)}
.rw .p.fin b{font-size:1.5em;color:var(--ink);min-width:44px;text-align:right}
.rw .ln{flex:1;font-size:.95em;color:var(--dim)}
.rw .p{font-weight:700;font-variant-numeric:tabular-nums;width:74px;text-align:right;font-size:1.35em}
.rw.g{background:#1c3527;color:#c9f0da} .rw.g .p{color:#8fe6b6} .rw.g .ln{color:#8fbfa4}
.rw.b{background:#331d18;color:#ffcdbf} .rw.b .p{color:#ff9b82} .rw.b .ln{color:#c99384}

/* 경매 */
.aucw{flex:1;display:grid;grid-template-columns:1fr 1.25fr;gap:18px;min-height:0;align-items:center}
.lot{text-align:center;background:var(--card);border:3px solid var(--gold);border-radius:22px;padding:18px;
 animation:pop .45s cubic-bezier(.2,1.3,.4,1)}
.lot .e{font-size:5em;line-height:1}
.lot .n{font-size:2.6em;font-weight:700;line-height:1.1}
.lot .q{font-size:1.15em;color:var(--dim);margin-top:4px}
.lot .q b{color:var(--red)}
.bids{overflow:auto;min-height:0;max-height:100%}
.bd{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
 border-radius:12px;padding:6px 14px;margin-bottom:5px;font-size:1.35em;animation:sl .25s}
.bd .t{font-weight:700;width:56px}
.bd .m{color:var(--dim2);font-size:.75em}
.bd .v{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;color:var(--gold)}
.bd.no .v{color:#5f5849;font-size:.8em;font-weight:400}
.bd.win{background:#3a2c10;border-color:var(--gold)}
.winbig{text-align:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.winbig .t{font-size:3.4em;font-weight:700;color:var(--gold);line-height:1.1}
.winbig .p{font-size:2.2em;font-weight:700}
.winbig .l{font-size:1.2em;color:var(--dim);margin-top:6px}

/* 변수 카드 */
.varw{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
 background:radial-gradient(circle at 50% 35%,#3a1c14,#17150f 70%);animation:pop .5s cubic-bezier(.2,1.3,.4,1)}
.vem{font-size:5.4em;line-height:1;animation:shk .6s}
@keyframes shk{0%,100%{transform:none}15%{transform:rotate(-12deg) scale(1.1)}
 35%{transform:rotate(10deg) scale(1.12)}55%{transform:rotate(-7deg)}75%{transform:rotate(5deg)}}
.vt{font-size:3.2em;font-weight:700;color:var(--red);line-height:1.1}
.vl{font-size:1.5em;color:var(--dim);text-align:center;line-height:1.5;max-width:900px}
.vgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;width:100%;margin-top:12px;padding:0 20px}
.vc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 3px;text-align:center;
 font-size:1.1em;animation:sl .4s both}
.vc b{display:block;font-size:1.15em}
.vc em{display:block;font-style:normal;font-size:.78em;color:var(--dim2)}
.vc.g{background:#1c3527;border-color:var(--green);color:#c9f0da}
.vc.b{background:#331d18;border-color:#68372a;color:#ffcdbf}

/* 퀴즈 */
.qhead{display:flex;align-items:baseline;gap:14px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.qhead .tag{font-size:1.5em;font-weight:700}
.qhead .prize{margin-left:auto;font-size:1.4em;color:var(--dim)}
.qhead .prize b{color:var(--gold);font-size:1.3em}
.qbody{flex:1;display:flex;flex-direction:column;min-height:0;padding-top:8px;gap:8px;overflow:hidden}
.qq{font-size:1.95em;font-weight:700;line-height:1.28;text-align:center}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qo{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);
 border-radius:13px;padding:8px 14px;font-size:1.32em}
.qo .no{width:30px;height:30px;border-radius:50%;background:#2f2a20;color:var(--dim);
 display:flex;align-items:center;justify-content:center;font-size:.8em;font-weight:700;flex:none}
.qo .tx{flex:1;line-height:1.2}
.qo .cnt{color:var(--gold);font-size:.85em;letter-spacing:2px}
.qo.ok{background:#1c3527;border-color:var(--green);color:#c9f0da}
.qo.ok .no{background:var(--green);color:#0d1f16}
.qo.no{opacity:.35}
.qwhy{background:#2b2416;border:1px solid #5f4c22;border-radius:13px;padding:9px 16px;
 font-size:1.3em;line-height:1.4;animation:sl .35s}
.qteams{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:auto}
.qt{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:6px 3px;
 text-align:center;font-size:1.05em}
.qt b{display:block;font-size:1.15em}
.qt em{display:block;font-style:normal;font-size:.85em;color:var(--gold)}
.qt.done{border-color:#3d5c46}
.qt.ok{background:#1c3527;border-color:var(--green);color:#c9f0da}
.qt.no{background:#331d18;border-color:#68372a;color:#ffcdbf}
.qt.wait{opacity:.4}
.qsum{margin-top:3px;font-size:1.05em;color:var(--dim)}
.qsum b{color:var(--gold)}

/* 시장가 */
.pricelist{flex:1;overflow:auto}
.pr{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
 border-radius:14px;padding:9px 16px;margin-bottom:7px;font-size:1.4em;animation:sl .3s both}
.pr .e{font-size:1.4em}
.pr .k{color:var(--dim2);font-size:.75em}
.pr .h{margin-left:auto;text-align:right}
.pr .h .a{color:var(--red);font-weight:700;font-size:1.15em}
.pr .h .b{color:var(--dim2);font-size:.72em}

/* 순위 */
.two{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:18px;min-height:0}
.col{display:flex;flex-direction:column;min-height:0}
.col h3{margin:0 0 6px;font-size:1.55em;font-weight:700}
.col h3 small{font-size:.6em;color:var(--dim);font-weight:400}
.col .list{flex:1;overflow:auto}
.rk{display:flex;align-items:center;gap:10px;padding:6px 13px;border-radius:11px;margin-bottom:4px;
 background:var(--card);font-size:1.3em;animation:sl .3s both}
.rk .no{width:32px;color:var(--dim2);font-weight:700}
.rk .t{font-weight:700;width:58px}
.rk .x{font-size:.72em;color:var(--dim2)}
.rk .v{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.rk.top{background:#2b2416;border:1px solid #5f4c22} .rk.top .v{color:var(--gold)}

.board .li{background:var(--card);border-left:4px solid var(--gold);border-radius:0 14px 14px 0;
 padding:11px 20px;margin-bottom:11px;animation:sl .4s both}
.board .li b.k{color:var(--gold);font-size:1.55em;display:block}
.board .li .v{font-size:1.25em;line-height:1.45}
.board .li .v b{color:var(--gold)}

.store{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
 background:radial-gradient(circle at 50% 40%,#1e2a2e,#17150f 70%)}
.store .two2{display:flex;gap:70px;align-items:flex-end;margin:14px 0 18px}
.store .cell{text-align:center}
.store .cell .k{font-size:1.2em;color:var(--dim)}
.store .cell .v{font-size:3.6em;font-weight:700;line-height:1.05}
.store .cell.a .v{color:var(--red)} .store .cell.b .v{color:var(--green)}
.store .q{font-size:2.4em;font-weight:700}

/* 거래 로그 */
.lg{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
 border-radius:12px;padding:7px 13px;margin-bottom:5px;font-size:1.15em;animation:sl .3s}
.lg .b{color:var(--gold);font-weight:700} .lg .ar{color:var(--dim2)}
.lg .m{color:var(--dim);font-size:.85em}
</style>
</head>

<script>
/* ===================================================================
   100억  —  내용 파일
   로또 → 일등석 → 짐싸기 8칸 → 비상착륙 → 환전 → 5일 생존 → 귀국
   * 이 파일은 두 html 안에 이미 들어가 있습니다. (참고용)

window.FONT = 'Dongle';
window.FONT_SCALE = 1.42;

window.CFG = {
  teams: 8,

  raidSec: 20      // 강탈 퀴즈 제한시간(초)

/* ─────────────────────────────────────────────

   once  : true 면 한 번 쓰면 없어지는 소모품
   ───────────────────────────────────────────── */

 { id:'blank', em:'🧣', name:'담요',         sub:'두꺼운 것',        price:30000,       cash:0,   kind:'life' },
 { id:'tube',  em:'🛟', name:'튜브',         sub:'대형',            price:30000,       cash:0,   kind:'trip' },
 { id:'umb',   em:'☂️', name:'우산',         sub:'장우산',          price:20000,       cash:0,   kind:'life' },

 { id:'fire',  em:'🔥', name:'라이터',       sub:'편의점 것',        price:1000,        cash:0,   kind:'life' }
];


/* ─────────────────────────────────────────────
   배경 이미지 (Higgsfield 생성 · 얼굴 없음)
   * 인터넷이 막히거나 링크가 죽어도 앱은 그대로 돌아갑니다.
     이미지가 안 뜨면 원래의 어두운 배경만 보입니다.
   * 다른 그림으로 바꾸려면 주소만 갈아 끼우면 됩니다.

function judge(team,e){
  const picked=((team.sel||{})[e.id])||[], own=inv(team);
  const valid=picked.filter(id=>own.includes(id));
  let best=null;
  (e.solves||[]).forEach(s=>{ if(s.need.every(n=>valid.includes(n))){ if(!best||s.pts>best.pts) best=s; }});
  if(best) return {p:best.pts,line:best.line,down:0,used:valid};
  const f=e.fail||{pts:0,line:''};
  return {p:f.pts||0,line:f.line||'',down:f.down||0,used:valid};
}
async function judgeAll(e){
  for(const t of TN()){
    const d=TEAMS[t]; if(!d) continue;

    const hp0=hpOf(d), r=judge(d,e);

    const gone=(r.used||[]).filter(id=>G(id).once);
    r.gone=gone;
    const res={...(d.res||{})}; res[e.id]=r;
    const o={res};
    if(r.down) o.hp=Math.max(1,hp0-r.down);          // 쓰러져도 최소 한 명은 남는다
    if(gone.length) o.inv=inv(d).filter(x=>!gone.includes(x));
    await saveTeam(t,o);
  }

    if(r.kind==='moneyTop'){
      let top=null; TN().forEach(t=>{const m=moneyOf(TEAMS[t]); if(!top||m>top.m) top={t,m};});
      if(top&&top.m>0){ await saveTeam(top.t,{money:Math.max(0,top.m-(r.sub||10))});
        hits[top.t]={m:-Math.min(top.m,r.sub||10)}; }
    }
    await save({varCard:{id:card.id,at:Date.now(),hits},varUsed:[...used,card.id]});
    snd('var');
  }finally{ busy=false; }
}

/* ══ 강탈 처리 ══ */
let raiding=false;
async function processRaids(){
  if(raiding||!online) return; raiding=true;
  try{
    for(const t of TN()){
      const d=TEAMS[t]; if(!d) continue;
      const r=d.raid; if(!r||r.done||r.ok==null) continue;
      const B=TEAMS[r.target];
      if(!B){ await saveTeam(t,{raid:{...r,done:true}}); continue; }
      let line='';
      if(r.ok){
        const ib=inv(B);
        if(ib.includes(r.item)){
          await saveTeam(r.target,{inv:ib.filter(x=>x!==r.item)});
          await saveTeam(t,{inv:Array.from(new Set([...inv(d),r.item]))});
          line='성공';
        } else line='이미 없음';
      } else {
        const ia=inv(d);
        if(ia.length){
          const gone=ia[Math.floor(Math.random()*ia.length)];
          await saveTeam(t,{inv:ia.filter(x=>x!==gone)});
          await saveTeam(r.target,{inv:Array.from(new Set([...inv(B),gone]))});
          line='실패·'+G(gone).name+' 뺏김'; r.back=gone;
        } else line='실패';
      }
      const log=[...(ST.raidLog||[]),{f:t,t:r.target,item:r.item,ok:!!r.ok,back:r.back||null,at:Date.now()}].slice(-30);
      await save({raidLog:log}); ST.raidLog=log;
      await saveTeam(t,{raid:{...r,done:true,line}});
      snd(r.ok?'steal':'lose');
    }
  }catch(e){}
  raiding=false;
}

/* ══ 거래 처리 (교사만) ══ */
let processing=false;
async function processTrades(){
  if(processing||!online) return; processing=true;
  try{
    for(const id in TRDOCS){ const x=TRDOCS[id];
      if(x.st!=='ok'||x.done) continue;
      const A=TEAMS[x.from], B=TEAMS[x.to];
      if(!A||!B){ await api.setDoc(api.doc(DB,'live',id),{done:true},{merge:true}); continue; }
      const ia=inv(A), ib=inv(B), cs=x.cash||0;
      const ma=moneyOf(A), mb=moneyOf(B);
      if(!x.give.every(g=>ia.includes(g))||!x.take.every(g=>ib.includes(g))
         ||(cs>0&&ma<cs)||(cs<0&&mb< -cs)){
        await api.setDoc(api.doc(DB,'live',id),{done:true,fail:1},{merge:true}); continue; }
      const na=Array.from(new Set(ia.filter(g=>!x.give.includes(g)).concat(x.take)));
      const nb=Array.from(new Set(ib.filter(g=>!x.take.includes(g)).concat(x.give)));
      const clean=(sel,keep)=>{const o={};for(const k in (sel||{})) o[k]=(sel[k]||[]).filter(v=>keep.includes(v));return o;};
      await saveTeam(x.from,{inv:na,money:Math.max(0,ma-cs),sel:clean(A.sel,na)});
      await saveTeam(x.to,{inv:nb,money:Math.max(0,mb+cs),sel:clean(B.sel,nb)});
      const log=[...(ST.log||[]),{f:x.from,t:x.to,g:x.give,k:x.take,cash:cs,msg:x.msg||'',
        gp:x.give.reduce((a,i)=>a+G(i).price,0),kp:x.take.reduce((a,i)=>a+G(i).price,0),at:Date.now()}].slice(-40);
      await save({log}); ST.log=log;
      await api.setDoc(api.doc(DB,'live',id),{done:true},{merge:true});
      snd('coin');
    }
  }catch(e){}
  processing=false;
}

function stage(){

  if(ST.varCard) return sVar();
  if(ST.phase==='shop'){
    if(a&&a.evId===ST.evId) return sAuc();
    if(q&&q.evId===ST.evId) return sQuiz();
    return sShop();
  }
  if(a&&a.open&&ST.phase==='ev') return sAuc();
  switch(ST.phase){
    case 'lotto': return sLotto();
    case 'first': return sFirst();
    case 'pack':  return sPack();
    case 'land':  return sLand();

       const cnt=rows.filter(x=>pickOf(x)===i).length;
       const cls=q.revealed?(i===Q.a?'ok':'no'):'';
       return `<div class="qo ${cls}"><span class="no">${i+1}</span><span class="tx">${o}</span>
         <span class="cnt">${q.revealed?cnt+'조':''}</span></div>`;}).join('')}</div>
     ${q.revealed?`<div class="qwhy">💡 ${Q.why}
       <div class="qsum">${nOk}조가 맞혀서 ${eok(q.prize)}씩 받았습니다 · 이 돈으로 곧 <b>${G(curEv().lot).name}</b> 경매가 열립니다</div></div>`:''}
     <div class="qteams">${rows.map(x=>{const pk=pickOf(x);
       const st=q.revealed?(pk===Q.a?'ok':(pk==null?'wait':'no')):(pk!=null?'done':'wait');
       return `<div class="qt ${st}"><b>${x.t}</b>
         <span>${q.revealed?(pk===Q.a?'+'+eok(q.prize):(pk==null?'무응답':'❌')):(pk!=null?'✅':'…')}</span>
         <em>${q.revealed?eok(moneyOf(x.d)):'&nbsp;'}</em></div>`;}).join('')}</div>
   </div>`;
}
function sShop(){
  const e=curEv(), g=G(e.lot);
  return `<div class="evhead"><div class="em">${e.em}</div>
    <div><div class="when">${e.when}</div><h2>${e.title}</h2><div class="ds">${e.desc}</div></div></div>
   <div class="mid" style="${bgs('shop',.7,.94)}"><div style="font-size:1.3em;color:var(--gold)">🚢 오늘 배가 들어왔다</div>
     <div class="lot" style="border-width:3px"><div class="e">${g.em}</div><div class="n">${g.name}</div>
       <div class="q">딱 <b>1개</b>${g.once?' · 한 번 쓰면 없어진다':''}</div></div>
     <p class="pulse">오른쪽 위 버튼을 누르면 경매가 시작됩니다</p></div>`;
}
function sAuc(){
  const a=ST.auc, g=G(a.item);
  const bids=TN().map(t=>({t,d:TEAMS[t]||{},b:((TEAMS[t]||{}).bids||{})[a.id]}))
    .sort((x,y)=>(y.b==null?-1:y.b)-(x.b==null?-1:x.b));
  const e=curEv();
  return `<h1>🏪 보급소 경매 <span style="font-size:.6em;color:var(--dim)">— ${e.em} ${e.title}</span></h1>
   <div class="sub">${a.open?'제일 높은 값을 부른 조가 가져갑니다. 다 부르면 <b>🔔 낙찰</b> (스페이스)':'낙찰 끝 · 다음 버튼으로 넘어가세요'}</div>
   <div class="aucw">
     <div>${a.open?`<div class="lot"><div class="e">${g.em}</div><div class="n">${g.name}</div>
        <div class="q">딱 <b>1개</b></div></div>`
       :`<div class="winbig">${a.winner?`<div style="font-size:3em">${g.em}</div>
          <div class="t">${a.winner} 낙찰</div><div class="p">${eok(a.price)}</div>
          <div class="l">${g.name} 을(를) 가져갔습니다</div>`
          :`<div style="font-size:3em">🚢</div><div class="t">유찰</div>
            <div class="l">아무도 값을 못 불렀다.<br>물건은 다시 배에 실렸다.</div>`}</div>`}</div>
     <div class="bids">${bids.map(x=>`<div class="bd ${x.b==null?'no':''} ${(!a.open&&a.winner===x.t)?'win':''}">
       <span class="t">${x.t}</span>
       <span class="v">${a.open ? (x.b==null?'아직':'✅ 냈음')
          : (x.b==null?'안 냄':(x.b<=0?'포기':eok(x.b)))}</span></div>`).join('')}</div>
   </div>`;
}
function sEvRes(){
  const e=curEv();
  const rows=TN().map(t=>({t,d:TEAMS[t]||{}})).filter(x=>(x.d.res||{})[e.id])
    .sort((a,b)=>b.d.res[e.id].p-a.d.res[e.id].p);
  return `<div class="evhead hasbg" style="${bgs(e.id,.6,.92)}"><div class="em">${e.em}</div>
    <div><div class="when">${e.when}</div><h2>${e.title}</h2></div></div>
   <div class="rows">${rows.map((x,i)=>{const r=x.d.res[e.id];
     return `<div class="rw ${r.p>0?'g':(r.p<0?'b':'')}" style="animation-delay:${i*.08}s">
       <span class="t">${x.t}</span>
       <span class="u">${(r.used||[]).map(id=>`<span>${G(id).em} ${G(id).name}</span>`).join('')||'<span style="opacity:.5">아무것도 못 씀</span>'}</span>
       <span class="ln">${r.line}${r.down?' 🧍 한 명 쓰러짐':''}${(r.gone||[]).length?` · <b style="color:var(--red)">${r.gone.map(id=>G(id).name).join(', ')} 다 씀</b>`:''}</span>
       <span class="p">${r.p>=0?'+':''}${r.p}</span></div>`;}).join('')}</div>`;
}
function waterTop(){
  let top=0;
  (ST.aucLog||[]).forEach(x=>{ if(x.item==='water') top=Math.max(top,x.price); });
  (ST.log||[]).forEach(x=>{ const c=x.cash||0;
    if(c>0&&(x.k||[]).includes('water')) top=Math.max(top,c);
    if(c<0&&(x.g||[]).includes('water')) top=Math.max(top,-c); });
  return top;
}
function sPrice(){
  const best={};
  (ST.aucLog||[]).forEach(x=>{ if(!best[x.item]||x.price>best[x.item].price) best[x.item]=x; });
  (ST.log||[]).forEach(x=>{ const c=x.cash||0; if(!c) return;
    const got=c>0?(x.k||[]):(x.g||[]), pr=Math.abs(c), who=c>0?x.f:x.t;
    got.forEach(id=>{ if(!best[id]||pr>best[id].price) best[id]={item:id,team:who,price:pr}; }); });
  const rows=Object.values(best).sort((a,b)=>b.price-a.price);
  return `<h1>📈 오늘 이 교실에서 팔린 값</h1>
   <div class="sub">왼쪽은 <b>한국 편의점 값</b>, 오른쪽은 <b>너희가 실제로 부른 값</b>입니다.</div>
   <div class="pricelist" style="margin-top:10px">${rows.length?rows.map((x,i)=>{const g=G(x.item);
     return `<div class="pr" style="animation-delay:${i*.1}s"><span class="e">${g.em}</span>
       <span>${g.name}<div class="k">${x.team} 낙찰</div></span>
       <span class="h"><span style="color:var(--dim)">${won(g.price)}</span>
         <span class="ar" style="color:var(--dim2)"> → </span>
         <span class="a">${eok(x.price)}</span>
         <div class="b">${g.price?Math.round(x.price*100000000/g.price).toLocaleString('ko-KR')+'배':''}</div></span></div>`;}).join('')
     :`<div class="mid"><p>경매가 한 번도 안 열렸습니다.\n조종석에서 <b>🔨 경매 시작</b>을 눌러 물건을 팔 수 있습니다.</p></div>`}</div>`;
}
function sRank(){
  const A=TN().map(t=>({t,d:TEAMS[t]||{}})).sort((a,b)=>packPrice(b.d)-packPrice(a.d));
  const B=TN().map(t=>({t,d:TEAMS[t]||{}})).sort((a,b)=>scoreOf(b.d)-scoreOf(a.d));
  const row=(x,i,v,x2)=>`<div class="rk ${i===0?'top':''}" style="animation-delay:${i*.07}s">
    <span class="no">${i+1}</span><span class="t">${x.t}</span><span class="x">${x2||''}</span>
    <span class="v">${v}</span></div>`;
  return `<h1>🏆 두 개의 순위</h1>
   <div class="sub">같은 여덟 개를 두 번 계산했습니다. 순위가 뒤집혔는지 보세요.</div>
   <div class="two" style="margin-top:8px">
     <div class="col"><h3>🏙️ 짐 합계 <small>한국에서의 값</small></h3>
       <div class="list">${A.map((x,i)=>row(x,i,won(packPrice(x.d)))).join('')}</div></div>
     <div class="col"><h3>🏝️ 생존 점수 <small>5일 동안 살아낸 결과</small></h3>
       <div class="list">${B.map((x,i)=>row(x,i,scoreOf(x.d)+'점',`조원 ${hpOf(x.d)}/3`)).join('')}</div></div>
   </div>
   <div class="sub" style="margin-top:6px">최종 점수 = <b>생존 점수</b> + (남은 돈 ÷ ${C.eokPerPoint}억) ·
     동점이면 조원이 많이 남은 조가 위</div>`;
}
function sStore(){
  const E=window.ENDING, top=waterTop();
  return `<div class="store" style="${bgs('store',.5,.86)}"><div style="font-size:3.4em">${E.em}</div>
   <h2 style="font-size:2.4em;margin:0;font-weight:700">${E.head}</h2>
   <div style="font-size:3em;margin-top:6px">💧</div>
   <div class="two2">
     <div class="cell a"><div class="k">어제</div><div class="v">${top?eok(top):'전 재산'}</div></div>
     <div class="cell b"><div class="k">오늘</div><div class="v">1,000원</div></div>
   </div>
   <div class="q">${E.q}</div></div>`;
}
function sBoard(){
  return `<h1>✍️ 정리</h1>
   <div class="board" style="margin-top:12px">${window.BOARD.map((b,i)=>
     `<div class="li" style="animation-delay:${i*.18}s"><b class="k">${b.k}</b><div class="v">${b.v}</div></div>`).join('')}</div>
   <div class="sub" style="margin-top:4px">마지막 질문 — <b>“다시 싼다면, 8칸에 뭘 넣을래?”</b></div>`;
}
function sResult(){
  const rows=TN().map(t=>({t,d:TEAMS[t]||{}}))
    .sort((a,b)=>(totalOf(b.d)-totalOf(a.d))||(hpOf(b.d)-hpOf(a.d)));
  return `<h1>🎬 최종 결과</h1>
   <div class="sub">최종 점수 = <b>생존 점수</b> + (남은 돈 ÷ ${C.eokPerPoint}억)</div>
   <div class="rows" style="margin-top:8px">${rows.map((x,i)=>`
     <div class="rw ${i===0?'g':''}" style="animation-delay:${i*.09}s">
       <span class="t" style="width:112px;white-space:nowrap">${i+1}위 ${x.t}</span>
       <span class="u nw" style="width:210px">${inv(x.d).map(id=>`<span>${G(id).em}</span>`).join('')}</span>
       <span class="ln">조원 ${hpOf(x.d)}/3 · 짐 ${won(packPrice(x.d))} · 남은 돈 ${eok(moneyOf(x.d))}</span>
       <span class="p fin" style="width:250px">
         <span class="a">생존 ${scoreOf(x.d)}</span><span class="o">+</span>
         <span class="b">돈 ${moneyPts(x.d)}</span><span class="o">=</span>
         <b>${totalOf(x.d)}</b></span></div>`).join('')}</div>`;
}

/* 부팅 */
(async function boot(){try{
  const {initializeApp}=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
  const m=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
  DB=m.getFirestore(initializeApp(FIREBASE_CONFIG)); api=m; online=true;
  m.onSnapshot(m.collection(DB,'live'),snap=>{
    TEAMS={}; TRDOCS={};
    snap.forEach(d=>{const id=d.id,v=d.data();
      if(id===STATE) ST=v;
      else if(id.startsWith(TEAM)) TEAMS[id.slice(TEAM.length)]=v;
      else if(id.startsWith(TR)&&v.kind==='tr') TRDOCS[id]=v;});
    draw(); processTrades(); processRaids();
  },e=>{ app.innerHTML='<div style="padding:40px">읽기 오류 '+e.code+'</div>'; });
}catch(e){ draw(); }})();
setInterval(()=>{ if(ST.phase==='pack'&&ST.packEnd) draw(); },1000);
draw();
</script>
</body>
