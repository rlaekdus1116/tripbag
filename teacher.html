<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>무인도 경매 · 진행판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&family=Jua&family=Gaegu:wght@400;700&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4efe4;--dim:#a89e8f;--line:#3b362e;--bg:#131108;--card:#201d15;
 --gold:#efb04c;--green:#55b981;--red:#e8593c;--fs:1;
 --font:'Dongle','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
 font-family:var(--font);word-break:keep-all}
button,select{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app{height:100%;display:flex;flex-direction:column;font-size:calc(16px * var(--fs))}

.ctl{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:6px 10px;background:#0c0a05;
 border-bottom:1px solid var(--line);flex:none;font-size:.85em}
.ctl.hide{display:none}
.b{padding:6px 11px;border-radius:9px;background:#2b2619;font-weight:700;white-space:nowrap}
.b:hover{background:#3b3524}
.b.pri{background:var(--gold);color:#131108}
.b.hot{background:#4a2f14;color:#ffcf8a}
.b:disabled{opacity:.3;cursor:default}
.b.blink{animation:bk .9s infinite}
@keyframes bk{0%,100%{background:#2b2619}50%{background:var(--red);color:#fff}}
.sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.conn{font-size:.75em;padding:2px 8px;border-radius:99px;background:#2b2619;color:var(--dim)}
.conn.ok{background:#1d3a2a;color:#a5e2c0} .conn.no{background:#4a221a;color:#ffb4a0}

.stage{flex:1;display:grid;grid-template-columns:1fr 310px;min-height:0}
.big{padding:20px 32px;display:flex;flex-direction:column;justify-content:center;min-height:0;position:relative}
.side{border-left:1px solid var(--line);background:#191710;padding:10px;overflow:auto}
.side h4{margin:0 0 6px;font-size:.8em;color:var(--dim);font-weight:400}
.tm{display:grid;grid-template-columns:auto 1fr auto;gap:1px 7px;align-items:center;
 padding:6px 8px;border-radius:9px;background:#221f17;margin-bottom:4px;font-size:.95em}
.tm .n{font-weight:700}
.tm .m{text-align:right;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.tm .b2{grid-column:1/4;height:4px;background:#302b21;border-radius:99px;overflow:hidden}
.tm .b2 i{display:block;height:100%;background:var(--gold)}
.tm .s{grid-column:1/4;font-size:.8em;color:var(--dim)}
.tm.broke{outline:1px solid #6d3427} .tm.bid{outline:1px solid var(--gold)}
.tm.ok{outline:1px solid var(--green)}

.itm{text-align:center}
.itm .em{font-size:6.4em;line-height:1}
.itm .nm{font-size:4em;font-weight:700;line-height:1.1}
.itm .qt{font-size:1.7em;color:var(--dim);margin-top:4px}
.itm .qt b{color:var(--red)}
.tmr{margin:14px auto 0;max-width:780px;width:100%}
.tmr .bar{height:18px;background:#2c271d;border-radius:99px;overflow:hidden}
.tmr .fl{height:100%;background:var(--gold);border-radius:99px;transition:width .2s linear}
.tmr .fl.hot{background:var(--red)}
.tmr .n{text-align:center;font-size:4.6em;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}
.tmr .n.hot{color:var(--red);animation:tk .5s infinite}
@keyframes tk{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.cnt{text-align:center;font-size:1.3em;color:var(--dim)}

/* 낙찰 1등 크게 */
.champ{text-align:center;animation:zin .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes zin{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.champ .t{font-size:9em;font-weight:700;color:var(--gold);line-height:1}
.champ .a{font-size:3em;color:var(--ink)}
.champ .i{font-size:1.6em;color:var(--dim);margin-top:6px}

.res{max-width:860px;margin:0 auto;width:100%}
.res h3{text-align:center;font-size:2em;margin:0 0 10px}
.rw{display:flex;align-items:center;gap:12px;padding:7px 18px;border-radius:12px;margin-bottom:5px;
 background:#221f17;font-size:1.9em;opacity:0;animation:pop .4s forwards}
@keyframes pop{from{transform:translateX(-18px)}to{transform:none;opacity:1}}
.rw .t{font-weight:700;width:76px}
.rw .a{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.rw.win{background:#1d3a2a;color:#a5e2c0}
.cut{border-top:3px dashed #4d463c;margin:8px 0;position:relative}
.cut span{position:absolute;right:0;top:-14px;background:var(--bg);padding:0 10px;font-size:.95em;color:var(--dim)}
.lines{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.lines div{border-radius:12px;padding:10px 14px;font-size:1.4em;text-align:center}
.lines .g{background:#1c3527;border:1px solid #2f6b4a;color:#a5e2c0}
.lines .b2b{background:#331d18;border:1px solid #68372a;color:#ffbcaa}

.hero{text-align:center}
.hero .e{font-size:7em;line-height:1}
.hero h2{font-size:3.6em;margin:2px 0;font-weight:700}
.hero p{font-size:1.7em;color:var(--dim);margin:0;line-height:1.45}
.slot{font-size:6em;font-weight:700;color:var(--gold);line-height:1.1;min-height:1.1em}

.rank{max-width:940px;margin:0 auto;width:100%}
.rk{display:grid;grid-template-columns:50px 1fr auto auto;gap:12px;align-items:center;
 padding:7px 16px;border-radius:12px;background:#221f17;margin-bottom:5px;font-size:1.7em}
.rk .p{font-weight:700;color:var(--dim)}
.rk .i{font-size:.7em;color:var(--dim)}
.rk .s{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.rk.top{background:#33301f;outline:1px solid var(--gold)}

.mtx{max-width:1040px;margin:0 auto;width:100%;overflow:auto;max-height:100%}
.mtx table{border-collapse:collapse;width:100%;font-size:1.15em}
.mtx th,.mtx td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:center}
.mtx th{color:var(--dim);font-weight:400}
.mtx td.l{text-align:left;font-weight:700}
.mtx .p3{background:#3c2118;color:#ffb08e;font-weight:700}
.mtx .p2{background:#2b2519}

.qz{max-width:960px;margin:0 auto;width:100%;text-align:center}
.qz .q{font-size:2.3em;line-height:1.45;margin-bottom:16px}
.qz .o{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qz .o div{padding:14px;border-radius:14px;background:#221f17;font-size:1.8em}
.qz .o div.ok{background:#1d3a2a;color:#a5e2c0;outline:2px solid var(--green)}
.qz .who{margin-top:14px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center;font-size:1.2em}
.qz .who span{background:#221f17;border-radius:9px;padding:5px 11px}
.qz .who span.ok{background:#1d3a2a;color:#a5e2c0}
.qz .who span.no{opacity:.45}
.qz .why{margin-top:12px;font-size:1.4em;color:var(--dim)}

.gate{display:grid;place-items:center;height:100%}
.gate input{padding:12px;border:2px solid var(--line);border-radius:12px;background:#201d15;
 color:var(--ink);text-align:center;font-size:1.5em;font-family:inherit}
.hint{position:absolute;bottom:8px;right:14px;font-size:.8em;color:#5f5849}
</style>
</head>
<body>
<div id="app"><div class="gate"><div style="text-align:center">
  <div style="font-size:3em">🏝️</div><p style="color:#a89e8f">진행판 · 암호</p>
  <input id="pw" type="password" placeholder="암호">
  <p id="pwe" style="color:#e8593c;min-height:20px"></p></div></div></div>

<!-- ▼ 수업 내용 (값·문구는 여기서 고칩니다). 두 파일이 같은 내용이어야 합니다 ▼ -->
<script>
/* ===================================================================
   무인도 경매 — 내용 파일  (24명 · 8조 기준)
   값·문구를 고치려면 여기만 보시면 됩니다.
   =================================================================== */

/* 폰트 — 'Dongle' 동글 / 'Jua' 주아 / 'Gaegu' 개구 / 'Do Hyeon' 도현 */
window.FONT = 'Dongle';
window.FONT_SCALE = 1.42;   // 동글은 글자가 작게 나와서 키웁니다. 주아로 바꾸면 1 로.

window.CFG = {
  teams: 8,
  budget: 100000,
  perPoint: 10000,       // 안 쓴 돈 이만큼당 1점
  missPenalty: -5,       // 필수품 못 구했을 때
  bidSeconds: 25,
  firstHalf: 5,          // 전반 라운드 수 (이만큼 끝나면 섬 공개)
  lotto: 30000,
  chest: 20000,
  relief: 15000,
  quizPrize: 15000
};

/* 섬 4종 — 8조면 섬마다 2조씩 */
window.ISLANDS = [
  { id:'sand',  em:'🏜️', name:'모래섬',
    desc:'그늘도 물도 없다. 낮에는 타들어간다.', must:'생수 20L' },
  { id:'rock',  em:'🗻', name:'바위섬',
    desc:'밤이 되면 얼어붙게 춥다. 바람을 막을 게 없다.', must:'담요' },
  { id:'mud',   em:'🌊', name:'갯벌섬',
    desc:'조개도 물고기도 많은데, 날로는 못 먹는다.', must:'라이터·부싯돌' },
  { id:'wreck', em:'🩹', name:'난파선 해변',
    desc:'배에서 뛰어내리다 다친 사람이 있다.', must:'구급함' }
];

/* 보급품
   pts  = [모래, 바위, 갯벌, 난파선]  ← 섬 공개 뒤에 쓰는 점수
   avg  = 전반에 보이는 「생존 점수」 (네 섬 평균)
   got  = 얻었을 때 한 줄 / miss = 못 얻었을 때 한 줄            */
window.ITEMS = [
 { id:1,  em:'💧', name:'생수 20L',        qty:4, pts:[3,2,2,3], must:'sand',
   got:'물통을 열자마자 셋이 돌려 마셨다.',        miss:'오늘도 빗물을 받았다. 입술이 갈라졌다.' },
 { id:2,  em:'⛺', name:'방수 천막',        qty:3, pts:[3,2,1,2],
   got:'비가 와도 젖지 않는 자리가 생겼다.',       miss:'밤새 비를 그대로 맞았다.' },
 { id:3,  em:'🔥', name:'라이터·부싯돌',    qty:4, pts:[1,3,3,2], must:'mud',
   got:'불을 피웠다. 연기가 하늘로 올라갔다.',     miss:'날것만 먹었다. 배가 아프다.' },
 { id:4,  em:'🔦', name:'손전등·건전지',    qty:4, pts:[2,2,2,2], hot:true,
   got:'밤에도 움직일 수 있게 됐다.',             miss:'해가 지면 아무것도 못 했다.' },
 { id:5,  em:'🧣', name:'담요',            qty:4, pts:[1,3,2,2], must:'rock',
   got:'밤이 견딜 만해졌다.',                    miss:'셋이 붙어 앉아 새벽을 버텼다.' },
 { id:6,  em:'🪞', name:'신호 거울·조명탄', qty:2, pts:[3,3,1,2], rare:true,
   got:'지나가는 배에 빛을 쏘아 보냈다.',          miss:'배가 지나갔지만 알릴 방법이 없었다.' },
 { id:7,  em:'🧰', name:'구급함',          qty:4, pts:[1,1,1,3], must:'wreck',
   got:'상처를 소독하고 감았다. 열이 내렸다.',      miss:'상처가 부었다. 계속 아파한다.' },
 { id:8,  em:'🥫', name:'통조림 한 상자',   qty:4, pts:[2,2,1,2],
   got:'오늘은 굶지 않았다.',                    miss:'허리띠를 한 칸 더 조였다.' },
 { id:9,  em:'🪢', name:'밧줄 20m',        qty:3, pts:[1,3,2,1],
   got:'절벽을 오르내릴 수 있게 됐다.',           miss:'물가까지 돌아서 두 시간을 걸었다.' },
 { id:10, em:'🍲', name:'냄비·코펠',       qty:3, pts:[2,1,3,2],
   got:'끓여 먹었다. 처음으로 따뜻한 걸 먹었다.',  miss:'차가운 것만 먹었다.' },
 { id:11, em:'🧭', name:'지도·나침반',      qty:4, pts:[2,2,1,1],
   got:'섬 반대편에 뭐가 있는지 알게 됐다.',       miss:'같은 자리를 두 번 지나쳤다.' }
];

/* 경매 순서 — 앞 5개가 전반(섬 모름), 나머지가 후반(섬 알고).
   필수품이 전반 2개(생수·담요) 후반 2개(라이터·구급함)로 갈라져 있습니다. */
window.ORDER = [1, 5, 8, 11, 4,   3, 7, 2, 6, 10, 9];

/* 시작할 때 나눠주는 표류물 후보 — 필수품은 절대 안 들어갑니다 */
window.DRIFT_POOL = [2, 4, 6, 8, 9, 10, 11];

window.PRACTICE = { em:'🍬', name:'사탕 한 봉지', qty:3, pts:[1,1,1,1],
  got:'달다.', miss:'옆 조가 먹는 걸 봤다.' };

/* ── 이벤트 14장 ─────────────────────────────────────────────
   kind: money(돈) / item(물건) / rule(규칙) / bonus(보유 물건 보상) */
window.EVENTS = [
 { id:'lotto',  em:'🎰', name:'로또 당첨',   kind:'money', hot:true,
   desc:'랜덤 한 조 +30,000원', line:'파도에 밀려온 상자에 지폐가 가득했다.' },
 { id:'chest',  em:'💰', name:'난파선 금고', kind:'money',
   desc:'랜덤 한 조 +20,000원', line:'가라앉은 배에서 금고를 건져 올렸다.' },
 { id:'relief', em:'⛑️', name:'구조대 보급', kind:'money',
   desc:'돈 떨어진 조 +15,000원', line:'헬기가 지나가며 보급품을 떨어뜨렸다.' },
 { id:'quiz',   em:'🧠', name:'보급 퀴즈',   kind:'money', hot:true,
   desc:'맞힌 조 +15,000원', line:'무전기에서 문제가 흘러나왔다.' },

 { id:'wave',   em:'🌊', name:'파도',        kind:'item',
   desc:'랜덤 한 조의 물건 하나 유실', line:'큰 파도가 해변을 훑고 갔다.' },
 { id:'drift',  em:'🛶', name:'표류 상자',   kind:'item',
   desc:'안 팔린 물건이 랜덤 조에게 공짜', line:'아무도 안 가져간 상자가 떠내려왔다.' },
 { id:'trade',  em:'🤝', name:'물물교환',    kind:'rule',
   desc:'30초간 조끼리 1:1 교환 (말로 합의 → 진행판에서 처리)', line:'다른 섬과 신호가 닿았다.' },

 { id:'storm',  em:'🌀', name:'태풍 경보',   kind:'rule',
   desc:'다음 라운드 입찰 상한 절반', line:'하늘이 검다. 오래 못 버틴다.' },
 { id:'surge',  em:'🔥', name:'물가 폭등',   kind:'rule',
   desc:'다음 3라운드 최저 15,000원', line:'남은 보급품이 얼마 없다는 소문이 돌았다.' },
 { id:'cut',    em:'📉', name:'보급 축소',   kind:'rule',
   desc:'다음 물건 수량 −1', line:'비행기가 한 상자를 놓쳤다.' },
 { id:'rain',   em:'💧', name:'소나기',      kind:'rule',
   desc:'물이 없는 조도 이번엔 버팀 (모래섬 페널티 1회 면제)', line:'하루 종일 비가 내렸다.' },

 { id:'fire',   em:'🔥', name:'모닥불 밤',   kind:'bonus', need:3,
   desc:'라이터 가진 조 +1점', line:'불을 피운 조는 밤새 따뜻했다.' },
 { id:'signal', em:'📻', name:'구조 신호',   kind:'bonus', need:6,
   desc:'신호 거울 가진 조 +2점', line:'수평선에 배가 지나갔다.' },
 { id:'fish',   em:'🐟', name:'어군 발견',   kind:'bonus', need:10,
   desc:'냄비 가진 조 +1점', line:'물고기 떼가 갯벌로 몰려왔다.' }
];

/* ── 퀴즈 12문항 — 일상 사례. 기회비용이 답인 문제가 대부분입니다 ── */
window.QUIZ = [
 { q:'만 원으로 <b>떡볶이</b>를 사 먹었다. 그 돈이면 <b>영화</b>를 볼 수도 있었다.<br>떡볶이의 기회비용은?',
   opts:['못 본 영화','떡볶이 만 원','떡볶이 맛','아무것도 아님'], answer:0,
   why:'포기한 것 중 가장 값어치 있는 것 = 기회비용. 못 본 영화입니다.' },
 { q:'주말에 <b>알바(6만원)</b>를 빼고 <b>여행</b>을 갔다.<br>이 여행의 기회비용은?',
   opts:['못 번 6만원','여행 경비','즐거움','시간'], answer:0,
   why:'여행 때문에 포기한 것 = 알바로 벌 수 있었던 6만원입니다.' },
 { q:'고등학교 졸업 후 바로 취업하면 3년간 <b>월급</b>을 벌 수 있다.<br>그런데 대학에 갔다. 이 월급은?',
   opts:['대학 진학의 기회비용','등록금','편익','매몰비용'], answer:0,
   why:'대학에 가느라 포기한 소득 — 등록금 말고도 이게 진짜 비용입니다.' },
 { q:'줄을 <b>두 시간</b> 서서 한정판을 샀다.<br>그 두 시간은?',
   opts:['비용이다','비용이 아니다','편익이다','공짜다'], answer:0,
   why:'시간도 비용입니다. 그 두 시간에 할 수 있었던 게 있으니까요.' },
 { q:'영화표를 <b>이미</b> 샀는데 재미없다는 소문을 들었다.<br>안 보면 표값이 아깝다며 억지로 봤다. 표값은?',
   opts:['매몰비용 — 판단에 넣으면 안 됨','기회비용','편익','희소성'], answer:0,
   why:'이미 낸 돈은 돌아오지 않습니다. 앞으로의 판단에 넣으면 손해가 커집니다.' },
 { q:'무인도에 <b>물이 2통</b>인데 원하는 사람은 <b>8명</b>이다.<br>이 상태를 뭐라고 하나요?',

   why:'싸게 산 것 같아도, 안 쓸 물건에 낸 돈은 그냥 나간 돈입니다.' },
 { q:'한 푼도 안 쓰고 돈을 다 남기면 점수를 받는다.<br>그런데 그것만으로는 1등을 못 한다. 왜?',
   opts:['얻는 것(편익)도 있어야 하니까','규칙이 잘못돼서','운이 나빠서','아끼는 건 나쁘니까'], answer:0,
   why:'아끼기만 하는 것도 합리적이지 않습니다. 비용과 편익을 <b>같이</b> 봐야 해요.' }

<script type="module">
const TEACHER_CODE="1234";
const FIREBASE_CONFIG={apiKey:"AIzaSyApUKeVhJ0EnOm_wu1vcT-14yeax7iQR7I",
 authDomain:"court-ae96f.firebaseapp.com",projectId:"court-ae96f",
 storageBucket:"court-ae96f.firebasestorage.app",messagingSenderId:"397308728790",
 appId:"1:397308728790:web:d6d10fac3865e547d24077"};
const P='auc_', STATE=P+'state', TEAM=P+'team_';
const $=s=>document.querySelector(s), app=$('#app');
const won=n=>Number(n||0).toLocaleString('ko-KR');
if(!window.ITEMS){app.innerHTML='<p style="text-align:center;margin-top:40vh">⚠️ auc_data.js 를 못 찾았습니다</p>';throw 0;}
const C=window.CFG, ISL=window.ISLANDS, ITEMS=window.ITEMS, ORDER=window.ORDER, EV=window.EVENTS;
const R=document.documentElement.style;
R.setProperty('--font',`'${window.FONT||'Dongle'}','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif`);
R.setProperty('--fs',String(window.FONT_SCALE||1));
ITEMS.forEach(i=>i.avg=Math.round(i.pts.reduce((a,b)=>a+b,0)/i.pts.length*10)/10);

let DB=null,api=null,ST={phase:'lobby'},TEAMS={},ctlHide=false,busy=false,champTimer=null,showList=false;
const tn=i=>`${i+1}조`;
const islIdx=t=>Math.max(0,ISL.findIndex(i=>i.id===(t&&t.island)));
const islOf=t=>ISL[islIdx(t)];
const itemOf=id=>ITEMS.find(i=>i.id===id);
const revealed=()=>!!ST.revealed;
const curItem=()=> ST.practice?{...window.PRACTICE,id:0,avg:1}
  : (ST.supply?{em:'🚢',name:'마지막 보급선',qty:9,pts:[0,0,0,0],avg:0,got:'필요한 걸 겨우 구했다.',miss:'끝내 구하지 못했다.'}
  : itemOf(ST.itemId));
function scoreOf(t){
  let s=0;
  (t.items||[]).forEach(x=>{const it=itemOf(x.id); if(it) s+= revealed()?(it.pts[islIdx(t)]||1):it.avg;});
  s+=Math.floor((t.money||0)/C.perPoint); s+=(t.bonus||0);
  if(revealed()){const m=ITEMS.find(i=>i.must===islOf(t).id);
    if(m&&!(t.items||[]).some(x=>x.id===m.id)&&!ST.rainPass) s+=C.missPenalty;}
  return Math.round(s*10)/10;
}
const hasMust=t=>{const m=ITEMS.find(i=>i.must===islOf(t).id);return !m||(t.items||[]).some(x=>x.id===m.id);};

let AC=null;
function snd(k){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
 const b=(f,d,ty,v,at)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';
  o.frequency.setValueAtTime(f,t+(at||0));g.gain.setValueAtTime(v||.12,t+(at||0));
  g.gain.exponentialRampToValueAtTime(.001,t+(at||0)+d);o.connect(g).connect(AC.destination);
  o.start(t+(at||0));o.stop(t+(at||0)+d+.02);};
 if(k==='tick')b(760,.07,'square',.06);
 if(k==='buzz')b(150,.5,'sawtooth',.16);
 if(k==='open'){[523,784].forEach((f,i)=>b(f,.2,'sine',.14,i*.1));}
 if(k==='win'){[523,659,784,1047,1319].forEach((f,i)=>b(f,.22,'sine',.15,i*.09));}
 if(k==='coin'){[988,1319].forEach((f,i)=>b(f,.12,'square',.1,i*.07));}
 if(k==='slot')b(1200,.05,'square',.08);
 if(k==='reveal'){[392,523,659,880].forEach((f,i)=>b(f,.3,'sine',.16,i*.14));}
}catch(e){}}

const enter=()=>boot();
if(sessionStorage.getItem('auc_t')==='1') enter();
$('#pw').onkeydown=e=>{if(e.key!=='Enter')return;
 if($('#pw').value.trim()===TEACHER_CODE){sessionStorage.setItem('auc_t','1');enter();}
 else $('#pwe').textContent='암호가 다릅니다';};

async function boot(){try{
  const {initializeApp}=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
  const m=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
  DB=m.getFirestore(initializeApp(FIREBASE_CONFIG)); api=m;
  m.onSnapshot(m.collection(DB,'live'),s=>{TEAMS={};
    s.forEach(d=>{if(d.id===STATE)ST=d.data()||{phase:'lobby'};
      else if(d.id.startsWith(TEAM))TEAMS[d.id.slice(TEAM.length)]=d.data();});
    draw();},e=>draw());
}catch(e){draw();}}
const save=o=>api&&api.setDoc(api.doc(DB,'live',STATE),o,{merge:true}).catch(()=>{});
const saveTeam=(t,o)=>api&&api.setDoc(api.doc(DB,'live',TEAM+t),o,{merge:true}).catch(()=>{});

/* ── 시작 ─────────────────────────── */
async function startGame(){
  if(!confirm('새 수업을 시작합니다. 섬을 나눠주고 돈과 표류물을 채웁니다.')) return;
  const names=Array.from({length:C.teams},(_,i)=>tn(i));
  const isls=[]; names.forEach((_,i)=>isls.push(ISL[i%ISL.length].id));
  for(let i=isls.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[isls[i],isls[j]]=[isls[j],isls[i]];}
  // 표류물 2개씩 — 생존점수 합이 비슷하도록 높은 것 + 낮은 것 짝지음
  const pool=window.DRIFT_POOL.map(id=>itemOf(id)).sort((a,b)=>b.avg-a.avg);
  const pairs=[];
  for(let i=0;i<names.length;i++){
    const hi=pool[i%pool.length], lo=pool[pool.length-1-(i%pool.length)];
    pairs.push(hi.id===lo.id?[hi.id,pool[(i+2)%pool.length].id]:[hi.id,lo.id]);
  }
  for(let i=0;i<names.length;i++)
    await saveTeam(names[i],{team:names[i],island:isls[i],money:C.budget,bonus:0,
      items:pairs[i].map(id=>({id,price:0})),bid:null,quiz:null});
  await save({phase:'lobby',round:-1,itemId:null,practice:false,supply:false,revealed:false,
    rev:null,settled:-99,surge:0,surgeUntil:0,stormRound:-1,cutNext:false,rainPass:false,
    bidSeconds:C.bidSeconds,quizIdx:0,quizOpen:false,evAt:Date.now()});
  snd('open');
}

/* ── 라운드 ───────────────────────── */
function openRound(idx,practice){
  const it=practice?null:itemOf(ORDER[idx]);
  save({phase:'bid', round: practice?-2:idx, itemId: it?it.id:null,
    practice:!!practice, supply:false, rev:null,
    surge:(ST.surgeUntil||0)>idx, bidEnds:Date.now()+(ST.bidSeconds||C.bidSeconds)*1000});
  Object.keys(TEAMS).forEach(t=>saveTeam(t,{bid:null}));
  snd('open'); busy=false; showList=false;
}
function openSupply(){
  save({phase:'bid',round:99,itemId:null,practice:false,supply:true,rev:null,surge:false,
    bidEnds:Date.now()+(ST.bidSeconds||C.bidSeconds)*1000});
  Object.keys(TEAMS).forEach(t=>saveTeam(t,{bid:null}));
  snd('open'); busy=false; showList=false;
}
async function closeBids(){
  if(busy) return;
  if(ST.settled===ST.round) return;          // 같은 라운드는 두 번 계산 안 함
  busy=true; await save({settled:ST.round}); snd('buzz');
  const it=curItem(); if(!it){busy=false;return;}
  const names=Object.keys(TEAMS).sort((a,b)=>parseInt(a)-parseInt(b));
  let ent=names.map(n=>({team:n,
    amount:Math.max(0,Math.min((TEAMS[n].bid&&TEAMS[n].bid.round===ST.round?TEAMS[n].bid.amount:0)||0,
                               Math.max(0,TEAMS[n].money||0))),
    at:(TEAMS[n].bid&&TEAMS[n].bid.at)||9e15}));
  if(ST.supply) ent=ent.filter(e=>!hasMust(TEAMS[e.team]));
  const sorted=[...ent].sort((a,b)=>b.amount-a.amount||a.at-b.at);
  let qty = ST.supply?Math.max(1,Math.ceil(sorted.length/2)):it.qty;
  if(ST.cutNext&&!ST.supply) qty=Math.max(1,qty-1);
  const winners=sorted.filter(e=>e.amount>0).slice(0,qty).map(e=>e.team);
  const list=sorted.map(e=>({...e,won:winners.includes(e.team)}));

  const opp={};
  for(const w of winners){
    const t=TEAMS[w], paid=list.find(x=>x.team===w).amount;
    const owned=new Set((t.items||[]).map(x=>x.id));
    const fut=ITEMS.filter(i=>!owned.has(i.id)&&i.id!==it.id)
      .sort((a,b)=>(revealed()?b.pts[islIdx(t)]-a.pts[islIdx(t)]:b.avg-a.avg));
    let left=paid,pick=[],sum=0;
    for(const f of fut){const p=revealed()?f.pts[islIdx(t)]:f.avg; const price=Math.round(p*C.perPoint);
      if(price<=left){left-=price;pick.push({f,p});sum+=p;if(pick.length>=2)break;}}
    opp[w]=pick.length?pick.map(x=>`${x.f.em} ${x.f.name} <b>${x.p}점</b>`).join(' + ')+` = <b>${Math.round(sum*10)/10}점</b>`
      :'이 돈으론 다른 걸 살 수 없었어요';
  }
  if(!ST.practice){
    for(const w of winners){
      const t=TEAMS[w], paid=list.find(x=>x.team===w).amount;
      const target=ST.supply?ITEMS.find(i=>i.must===islOf(t).id):it;
      if(!target) continue;
      await saveTeam(w,{money:Math.max(0,(t.money||0)-paid),
        items:[...(t.items||[]),{id:target.id,price:paid}]});
    }
  }
  await save({phase:'reveal',cutNext:false,
    rev:{at:Date.now(),em:it.em,name:ST.supply?'마지막 보급선':it.name,qty,list,
         cut:Math.min(winners.length,list.length),opp,got:it.got,miss:it.miss,practice:!!ST.practice}});
  showList=false; setTimeout(()=>{snd('reveal');},200);
  clearTimeout(champTimer); champTimer=setTimeout(()=>{showList=true;draw();},1500);
  busy=false;
}

/* ── 섬 공개 ──────────────────────── */
async function revealIslands(){
  await save({phase:'island',revealed:true,evAt:Date.now()});
  snd('reveal');
}

/* ── 이벤트 ───────────────────────── */
async function fire(id){
  const names=Object.keys(TEAMS); if(!names.length) return;
  const pick=()=>names[(Math.random()*names.length)|0];
  const stamp={evAt:Date.now()};
  if(id==='lotto'){const t=pick();
    await saveTeam(t,{money:(TEAMS[t].money||0)+C.lotto});
    await save({phase:'lotto',lotto:{team:t},...stamp});
    let i=0;const iv=setInterval(()=>{snd('slot');if(++i>16)clearInterval(iv);},90);}
  if(id==='chest'){const t=pick();
    await saveTeam(t,{money:(TEAMS[t].money||0)+C.chest});
    await save({phase:'chest',chest:{team:t},...stamp}); snd('coin');}
  if(id==='relief'){const poor=names.filter(n=>(TEAMS[n].money||0)<10000);
    for(const n of poor) await saveTeam(n,{money:(TEAMS[n].money||0)+C.relief});
    await save({phase:'relief',relief:{teams:poor},...stamp}); snd('coin');}
  if(id==='quiz'){ Object.keys(TEAMS).forEach(t=>saveTeam(t,{quiz:null}));
    await save({phase:'quiz',quizOpen:false,...stamp}); snd('open');}
  if(id==='wave'){const cand=names.filter(n=>(TEAMS[n].items||[]).length);
    if(!cand.length) return alert('아직 물건 가진 조가 없습니다');
    const t=cand[(Math.random()*cand.length)|0];
    const its=[...TEAMS[t].items]; const gone=its.splice((Math.random()*its.length)|0,1)[0];
    await saveTeam(t,{items:its});
    await save({phase:'wave',wave:{team:t,item:itemOf(gone.id).name},...stamp}); snd('buzz');}
  if(id==='drift'){
    const soldIds=new Set(); Object.values(TEAMS).forEach(t=>(t.items||[]).forEach(x=>soldIds.add(x.id)));
    const rest=ITEMS.filter(i=>!soldIds.has(i.id));
    if(!rest.length) return alert('안 팔린 물건이 없습니다');
    const item=rest[(Math.random()*rest.length)|0], t=pick();
    await saveTeam(t,{items:[...(TEAMS[t].items||[]),{id:item.id,price:0}]});
    await save({phase:'drift',drift:{team:t,item:item.name},...stamp}); snd('coin');}
  if(id==='trade'){ await save({phase:'trade',...stamp}); snd('open');}
  if(id==='storm'){ await save({phase:'storm',stormRound:(ST.round||0)+1,...stamp}); snd('buzz');}
  if(id==='surge'){ await save({phase:'surge',surgeUntil:(ST.round||0)+4,...stamp}); snd('buzz');}
  if(id==='cut'){ await save({phase:'cut',cutNext:true,...stamp}); snd('buzz');}
  if(id==='rain'){ await save({phase:'rain',rainPass:true,...stamp}); snd('coin');}
  if(['fire','signal','fish'].includes(id)){
    const e=EV.find(x=>x.id===id), pt=id==='signal'?2:1;
    const got=names.filter(n=>(TEAMS[n].items||[]).some(x=>x.id===e.need));
    for(const n of got) await saveTeam(n,{bonus:(TEAMS[n].bonus||0)+pt});
    await save({phase:id,bonusInfo:{teams:got,pt},...stamp}); snd('coin');}
}
async function revealQuiz(){
  const q=window.QUIZ[ST.quizIdx||0];
  for(const n of Object.keys(TEAMS)){const a=TEAMS[n].quiz;
    if(a&&a.idx===(ST.quizIdx||0)&&a.ans===q.answer)
      await saveTeam(n,{money:(TEAMS[n].money||0)+C.quizPrize});}
  await save({quizOpen:true}); snd('coin');
}

/* ── 화면 ─────────────────────────── */
let tId=null,lastTick=-1;
function draw(){
  const ph=ST.phase||'lobby', idx=typeof ST.round==='number'?ST.round:-1, total=ORDER.length;
  const names=Object.keys(TEAMS).sort((a,b)=>parseInt(a)-parseInt(b));
  const half=C.firstHalf;
  const needIsland = !revealed() && idx>=half-1 && ph==='reveal';
  const quizDone = names.length && names.every(n=>TEAMS[n].quiz);
  app.innerHTML=`
  <div class="ctl ${ctlHide?'hide':''}">
    <span class="conn ${api?'ok':'no'}">${api?'연결됨':'연결 안 됨'}</span>
    <button class="b" id="new">새 수업</button>
    <button class="b" id="prac">연습</button>
    <button class="b pri" id="next">${idx<0?'1번 열기':(idx+1>=total?'🚢 마지막 보급선':`${idx+2}번 열기`)}</button>
    <button class="b" id="close" ${ph==='bid'?'':'disabled'}>바로 마감</button>
    <button class="b hot ${needIsland?'blink':''}" id="isl" ${revealed()?'disabled':''}>🏝️ 섬 공개</button>
    <span class="sep"></span>
    ${EV.map(e=>`<button class="b ${e.hot?'hot':''}" data-e="${e.id}">${e.em}</button>`).join('')}
    <button class="b ${quizDone&&ph==='quiz'&&!ST.quizOpen?'blink':''}" id="qrev"
      ${ph==='quiz'&&!ST.quizOpen?'':'disabled'}>정답 공개</button>
    <select class="b" id="qsel">${window.QUIZ.map((q,i)=>
      `<option value="${i}" ${(ST.quizIdx||0)===i?'selected':''}>퀴즈 ${i+1}</option>`).join('')}</select>
    <span class="sep"></span>
    <button class="b" id="mid">순위</button>
    <button class="b" id="fin">최종</button>
    <button class="b" id="mtx">점수표</button>
    <select class="b" id="secs">${[20,25,30].map(v=>
      `<option value="${v}" ${(ST.bidSeconds||C.bidSeconds)===v?'selected':''}>${v}초</option>`).join('')}</select>
    <span style="color:#5f5849;font-size:.8em">H 숨기기</span>
  </div>
  <div class="stage">
    <div class="big">${stageHTML(ph)}<div class="hint">${idx>=0&&idx<total?`${idx+1} / ${total} · ${idx<half?'전반(섬 모름)':'후반'}`:''}</div></div>
    <div class="side"><h4>조별 현황 · ${names.length}조${revealed()?'':' · 섬 비공개'}</h4>
      ${names.map(n=>{const t=TEAMS[n],m=Math.max(0,t.money||0),bid=t.bid&&t.bid.round===ST.round?t.bid.amount:null;
        return `<div class="tm ${m<10000?'broke':''} ${ph==='bid'&&bid!==null?'bid':''} ${revealed()&&hasMust(t)?'ok':''}">
          <span>${revealed()?islOf(t).em:'🌫️'}</span><span class="n">${n}</span>
          <span class="m">${won(m)}</span>
          <span class="b2"><i style="width:${Math.round(m/C.budget*100)}%"></i></span>
          <span class="s">${(t.items||[]).length}개 · ${scoreOf(t)}점${
            revealed()&&!hasMust(t)?' · <span style="color:#e8593c">필수 없음</span>':''}${
            bid!==null?` · <b style="color:var(--gold)">${won(bid)}</b>`:''}</span></div>`;
      }).join('')||'<p style="color:#5f5849">아직 아무도 안 들어왔습니다</p>'}
    </div></div>`;
  $('#new').onclick=startGame; $('#prac').onclick=()=>openRound(0,true);
  $('#next').onclick=()=>{const n=idx<0?0:idx+1; if(n>=total) openSupply(); else openRound(n,false);};
  $('#close').onclick=closeBids; $('#isl').onclick=revealIslands;
  $('#mid').onclick=()=>save({phase:'rank',evAt:Date.now()});
  $('#fin').onclick=()=>save({phase:'result',evAt:Date.now()});
  $('#mtx').onclick=()=>save({phase:'matrix',evAt:Date.now()});
  $('#qrev').onclick=revealQuiz;
  $('#qsel').onchange=e=>save({quizIdx:+e.target.value,quizOpen:false});
  $('#secs').onchange=e=>save({bidSeconds:+e.target.value});
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>fire(b.dataset.e));

  clearInterval(tId);
  if(ph==='bid'){tId=setInterval(()=>{
    const f=$('#tf'),n=$('#tn'); if(!f){clearInterval(tId);return;}
    const tot=(ST.bidSeconds||C.bidSeconds)*1000,left=Math.max(0,(ST.bidEnds||0)-Date.now());
    f.style.width=Math.round(left/tot*100)+'%';
    const s=Math.ceil(left/1000); n.textContent=s;
    const hot=s<=5; f.className='fl'+(hot?' hot':''); n.className='n'+(hot?' hot':'');
    if(hot&&s!==lastTick){lastTick=s;snd('tick');}
    if(left<=0){clearInterval(tId);closeBids();}},100);}
}

function stageHTML(ph){
  const names=Object.keys(TEAMS).sort((a,b)=>parseInt(a)-parseInt(b));
  if(ph==='bid'){
    const it=curItem(); if(!it) return '';
    const want=ST.supply?names.filter(n=>!hasMust(TEAMS[n])).length
      :names.filter(n=>revealed()?(it.pts[islIdx(TEAMS[n])]||1)>=2:it.avg>=2).length;
    const sent=names.filter(n=>TEAMS[n].bid&&TEAMS[n].bid.round===ST.round).length;
    return `<div class="itm"><div class="em">${it.em}</div>
      <div class="nm">${ST.supply?'마지막 보급선':it.name}</div>
      <div class="qt">${ST.supply?'필수품 못 구한 조만 입찰':`${it.qty}개 · <b>${want}조</b>가 원함`}${
        ST.practice?' · 연습':''}${revealed()?'':` · 생존 점수 ${it.avg}`}</div>
      <div class="tmr"><div class="bar"><div class="fl" id="tf"></div></div><div class="n" id="tn">–</div></div>
      <div class="cnt">${sent} / ${names.length}조 제출${ST.surge?' · 🔥 최저 15,000':''}${
        ST.stormRound===ST.round?' · 🌀 상한 절반':''}</div></div>`;
  }
  if(ph==='reveal'){
    const r=ST.rev; if(!r) return '';
    const top=(r.list||[]).find(x=>x.won);
    if(!showList&&top) return `<div class="champ"><div class="i">${r.em} ${r.name} 낙찰</div>
      <div class="t">${top.team}</div><div class="a">${won(top.amount)}원</div></div>`;
    return `<div class="res"><h3>${r.em} ${r.name} · ${r.qty}개</h3>
      ${(r.list||[]).map((x,i)=>`${i===r.cut?'<div class="cut"><span>낙찰선</span></div>':''}
        <div class="rw ${x.won?'win':''}" style="animation-delay:${i*.1}s">
          <span class="t">${x.team}</span><span class="a">${x.amount?won(x.amount)+'원':'패스'}</span>
          ${x.won?'<span>✓</span>':''}</div>`).join('')}
      <div class="lines"><div class="g">✓ ${r.got}</div><div class="b2b">✕ ${r.miss}</div></div></div>`;
  }
  if(ph==='island'){
    return `<div class="rank"><h3 style="text-align:center;font-size:2.4em;margin:0 0 14px">🏝️ 섬이 드러났다</h3>
      ${names.map(n=>{const t=TEAMS[n],i=islOf(t),m=ITEMS.find(x=>x.must===i.id);
        return `<div class="rk"><span class="p">${i.em}</span>
          <span><b>${n}</b> <span class="i">${i.name} — ${i.desc}</span></span>
          <span class="i">필수 ${m?m.name:''}</span>
          <span class="s" style="color:${hasMust(t)?'var(--green)':'var(--red)'}">${hasMust(t)?'확보':'없음'}</span>
        </div>`;}).join('')}</div>`;
  }
  if(ph==='lotto') return `<div class="hero"><div class="e">🎰</div><h2>로또 당첨</h2>
    <div class="slot">${(ST.lotto||{}).team||''}</div><p>+${won(C.lotto)}원 · 순전히 운입니다</p></div>`;
  if(ph==='chest') return `<div class="hero"><div class="e">💰</div><h2>난파선 금고</h2>
    <div class="slot">${(ST.chest||{}).team||''}</div><p>+${won(C.chest)}원</p></div>`;
  if(ph==='relief'){const ts=((ST.relief||{}).teams||[]);
    return `<div class="hero"><div class="e">⛑️</div><h2>구조대 보급</h2>
      <p>${ts.length?ts.join(' · ')+`<br>+${won(C.relief)}원`:'돈이 떨어진 조가 없습니다'}</p></div>`;}
  if(ph==='wave'){const w=ST.wave||{};return `<div class="hero"><div class="e">🌊</div><h2>파도</h2>
    <p><b style="color:var(--red)">${w.team}</b>의 <b>${w.item}</b>이(가) 떠내려갔습니다<br>돈은 돌아오지 않습니다</p></div>`;}
  if(ph==='drift'){const d=ST.drift||{};return `<div class="hero"><div class="e">🛶</div><h2>표류 상자</h2>
    <p><b style="color:var(--gold)">${d.team}</b>가 <b>${d.item}</b>을(를) 공짜로 얻었습니다</p></div>`;}
  if(['storm','surge','cut','rain','trade'].includes(ph)){const e=EV.find(x=>x.id===ph)||{};
    return `<div class="hero"><div class="e">${e.em}</div><h2>${e.name}</h2><p>${e.line}<br>${e.desc}</p></div>`;}
  if(['fire','signal','fish'].includes(ph)){const e=EV.find(x=>x.id===ph)||{},b=ST.bonusInfo||{};
    return `<div class="hero"><div class="e">${e.em}</div><h2>${e.name}</h2>
      <p>${e.line}<br><b style="color:var(--green)">${(b.teams||[]).join(' · ')||'해당 조 없음'}</b>
      ${b.teams&&b.teams.length?` +${b.pt}점`:''}</p></div>`;}
  if(ph==='quiz'){const q=window.QUIZ[ST.quizIdx||0];
    const ans=names.map(n=>({n,a:TEAMS[n].quiz&&TEAMS[n].quiz.idx===(ST.quizIdx||0)?TEAMS[n].quiz.ans:null}));
    const done=ans.filter(x=>x.a!==null).length;
    return `<div class="qz"><div class="q">🧠 ${q.q}</div>
      <div class="o">${q.opts.map((o,i)=>`<div class="${ST.quizOpen&&i===q.answer?'ok':''}">${o}</div>`).join('')}</div>
      <div class="who">${ans.map(x=>`<span class="${ST.quizOpen?(x.a===q.answer?'ok':'no'):''}">${x.n}${
        x.a===null?' –':(ST.quizOpen?(x.a===q.answer?` ✓ +${won(C.quizPrize)}`:' ✕'):' ✔')}</span>`).join('')}</div>
      <div class="why">${ST.quizOpen?q.why:`${done} / ${names.length}조 제출`}</div></div>`;}
  if(ph==='rank'||ph==='result'){
    const rk=names.map(n=>({n,t:TEAMS[n],s:scoreOf(TEAMS[n])})).sort((a,b)=>b.s-a.s);
    return `<div class="rank"><h3 style="text-align:center;font-size:2.4em;margin:0 0 12px">
      ${ph==='result'?'🏆 최종 결과':'중간 순위'}</h3>
      ${rk.map((x,i)=>`<div class="rk ${i===0?'top':''}"><span class="p">${i+1}</span>
        <span><b>${x.n}</b> <span class="i">${revealed()?islOf(x.t).em+' '+islOf(x.t).name+' · ':''}${
          (x.t.items||[]).length}개 · 남은 돈 ${won(x.t.money)}</span></span>
        <span class="i">${revealed()&&!hasMust(x.t)?'필수 없음':''}</span>
        <span class="s">${x.s}점</span></div>`).join('')}</div>`;}
  if(ph==='matrix') return `<div class="mtx">
    <h3 style="text-align:center;font-size:2.2em;margin:0 0 10px">섬마다 값이 달랐습니다</h3>
    <table><tr><th class="l">보급품</th><th>평균</th>${ISL.map(i=>`<th>${i.em} ${i.name}</th>`).join('')}</tr>
    ${ITEMS.map(it=>`<tr><td class="l">${it.em} ${it.name}</td><td style="color:#a89e8f">${it.avg}</td>
      ${it.pts.map(p=>`<td class="${p===3?'p3':(p===2?'p2':'')}">${p}</td>`).join('')}</tr>`).join('')}
    </table></div>`;
  return `<div class="hero"><div class="e">🏝️</div><h2>무인도 경매</h2>
    <p>「새 수업」을 누르면 섬을 나눠주고 돈 ${won(C.budget)}원과<br>표류물 2개를 채웁니다</p></div>`;
}
document.addEventListener('keydown',e=>{
  if(e.key==='h'||e.key==='H'){ctlHide=!ctlHide;draw();}
  if(e.key===' '&&ST.phase==='bid'){e.preventDefault();closeBids();}
  if(e.key==='Enter'&&ST.phase==='reveal'){showList=true;draw();}
});
</script>
</body>
</html>
