<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리 조 장바구니 · 진행판</title>
<style>
:root{--ink:#1c1b19;--sub:#77716a;--line:#e2ddd4;--bg:#f6f4ef;--card:#fff;
 --accent:#c2410c;--green:#2f7048;--green-soft:#eaf4ee;--blue:#20618f;--blue-soft:#eaf3fa;
 --red:#a4342a;--gold:#8a6a1c;--gold-soft:#fbf4e2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.6;letter-spacing:-0.02em;
 font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 60px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);
 border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.bar h1{font-size:17px;margin:0;letter-spacing:-0.03em}
.conn{font-size:12px;padding:3px 9px;border-radius:999px;background:#eee;color:#666;font-weight:700}
.conn.ok{background:var(--green-soft);color:var(--green)} .conn.no{background:#fbe9e4;color:#b8442a}
.right{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.b{padding:9px 15px;border-radius:11px;background:#fff;border:1.5px solid var(--line);font-weight:700}
.b:hover{border-color:#c9c2b6}
.b.sm{padding:6px 11px;font-size:12.5px}
.b.pri{background:var(--accent);color:#fff;border-color:var(--accent);font-size:16px;padding:12px 22px}
.b.dark{background:#26241f;color:#fff;border-color:#26241f}
.b.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.b:disabled{opacity:.35;cursor:default}
.b.blink{animation:bk 1s infinite}
@keyframes bk{0%,100%{background:#fff;color:var(--ink)}50%{background:var(--accent);color:#fff;border-color:var(--accent)}}
.clock{font-size:26px;font-weight:800;letter-spacing:-0.04em;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{font-size:15px;margin:0 0 12px;letter-spacing:-0.03em}
.card h2 span{color:var(--sub);font-weight:500;font-size:12.5px;margin-left:6px}
.row{margin-bottom:11px}
.row .lb{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;margin-bottom:3px}
.row .lb .n{color:var(--sub);font-weight:600}
.row .lb .n.over{color:var(--red)}
.tk{height:20px;background:#eae5db;border-radius:7px;overflow:hidden}
.fl{height:100%;background:#c9a86a;transition:width .5s}
.fl.over{background:#c25a45}
.row .it{font-size:11.5px;color:var(--sub);margin-top:3px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#f4f0e8;font-size:11.5px;color:#5c564d;position:sticky;top:0}
.scroll{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.evgrid{display:grid;gap:8px}
.evb{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;
 padding:11px 13px;background:#fff;text-align:left;width:100%}
.evb .em{font-size:21px}
.evb .t{font-weight:800;font-size:14px;letter-spacing:-0.02em}
.evb .d{font-size:12px;color:var(--sub)}
.evb .at{margin-left:auto;font-size:11.5px;font-weight:700;color:#fff;background:#b4ab9c;
 padding:2px 8px;border-radius:999px;white-space:nowrap}
.evb.done{opacity:.4}
.evb.due{border-color:var(--accent);animation:bk2 1.1s infinite}
@keyframes bk2{0%,100%{background:#fff}50%{background:#fdefe8}}
.gate{max-width:340px;margin:120px auto;text-align:center}
.gate input{width:100%;padding:13px;border:2px solid var(--line);border-radius:12px;text-align:center;font-size:17px}
.hide{display:none}
/* ── 발표 화면 (재생기) ───────────────────────────── */
#show{position:fixed;inset:0;background:#141311;color:#f5f1e8;z-index:100;padding:40px 52px;
 overflow:auto;cursor:pointer}
#show.shaking{animation:shk .45s}
@keyframes shk{0%,100%{transform:none}15%{transform:translate(-9px,4px)}
 35%{transform:translate(8px,-5px)}55%{transform:translate(-6px,-3px)}75%{transform:translate(5px,3px)}}
#show .nav{position:absolute;top:14px;right:20px;color:#6d675e;font-size:13px;z-index:5}
#show .nav button{margin-left:10px;font-size:17px;background:none;border:none;cursor:pointer}
#show .stage{position:relative;z-index:3;max-width:1000px;margin:0 auto}
#show .head{font-size:40px;font-weight:800;letter-spacing:-0.045em;margin-bottom:4px}
#show .money2{color:#a49c91;font-size:19px;margin-bottom:34px}
#show .money2 .bad{color:#ff8c6b}
#show .dayline{font-size:13px;letter-spacing:.14em;color:#6d675e;margin:26px 0 10px;font-weight:800}
#show .ln{font-size:30px;line-height:1.6;margin:0 0 14px;letter-spacing:-0.03em;
 min-height:1.6em;transition:opacity .5s,color .5s}
#show .ln.old{opacity:.3;font-size:24px}
#show .ln.good{color:#a9dcc0}
#show .ln.bad{color:#ffbfae}
#show .tail{margin-top:30px}
#show .bg{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
#show .bg span{border:1px solid #3d3931;border-radius:11px;padding:8px 14px;font-size:19px;
 animation:pop2 .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop2{from{transform:scale(1.6);opacity:0}to{transform:none;opacity:1}}
#show .items{color:#8b8377;font-size:16px;line-height:1.9}
#show .more{color:#6d675e;font-size:14px;margin-top:22px}

/* 연출 레이어 */
#show .fx{position:fixed;inset:0;pointer-events:none;z-index:2}
#show .fx.dark{background:#000;animation:blk .55s ease-out}
@keyframes blk{0%{opacity:1}70%{opacity:.9}100%{opacity:0}}
#show .fx.flash{background:#fff;animation:fls .35s ease-out}
@keyframes fls{0%{opacity:.9}100%{opacity:0}}
#show .fx.rain{background-image:repeating-linear-gradient(104deg,
 rgba(180,205,230,0) 0 22px, rgba(180,205,230,.30) 22px 24px);
 background-size:200px 200px;animation:rn .55s linear infinite;opacity:.55}
@keyframes rn{from{background-position:0 0}to{background-position:-48px 200px}}
#show .fx.clock{background:radial-gradient(circle at 50% 40%,rgba(0,0,0,0) 30%,rgba(0,0,0,.75) 100%)}
#show .fx .cl{position:absolute;top:34px;left:52px;font-size:44px;font-weight:800;
 color:#7d7466;font-variant-numeric:tabular-nums;letter-spacing:-0.04em}
#show .fx.photos{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
#show .fx .ph{width:130px;height:100px;background:#efe9dc;border:7px solid #fff;border-radius:3px;
 box-shadow:0 8px 24px rgba(0,0,0,.5);animation:phg 2.2s forwards}
@keyframes phg{0%{opacity:.95;transform:none}70%{opacity:.95}100%{opacity:0;transform:translateY(-30px) rotate(6deg)}}
#show .fx.film{display:flex;align-items:center;overflow:hidden}
#show .fx .strip{display:flex;gap:10px;padding:14px;background:#000;border-top:3px solid #2a2721;
 border-bottom:3px solid #2a2721;animation:flm 2.4s linear;width:200%}
@keyframes flm{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#show .fx .strip i{width:120px;height:88px;background:#3b362d;border-radius:2px;flex:none}
</style>
</head>
<body>
<div class="gate" id="gate">
  <h1 style="font-size:20px">진행판</h1>
  <p style="color:#77716a;font-size:13px">선생님만 들어오는 화면입니다</p>
  <input id="pw" type="password" placeholder="암호" autocomplete="off">
  <p id="pwe" style="color:#c2410c;font-size:13px;min-height:18px"></p>
</div>

<div class="wrap hide" id="main">
  <div class="bar">
    <h1>🧳 우리 조 장바구니 · 진행판</h1>
    <span class="conn" id="conn">연결 중</span>
    <span class="clock" id="clock">00:00</span>
    <button class="b sm" id="tstart">수업 시작</button>
    <div class="right">
      <button class="b sm" id="csv">엑셀로 받기</button>
      <button class="b sm" id="clr">기록 전체 지우기</button>
    </div>
  </div>

  <div class="bar">
    <span style="font-weight:800">예산 <b id="bud">80,000</b>원</span>
    <span style="color:#77716a;font-size:12.5px" id="phase">편성 중</span>
    <div class="right">
      <button class="b pri" id="lock">마감하고 결과 보기</button>
      <button class="b" id="votebtn">투표 열기</button>
      <button class="b" id="back">편성으로 돌아가기</button>
      <button class="b dark" id="showb">발표 화면</button>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>조별 남은 돈 <span id="cnt"></span></h2>
      <div id="teams"></div>
    </div>
    <div>
      <div class="card" style="margin-bottom:12px">
        <h2>이벤트 <span>권장 시각이 되면 깜빡입니다</span></h2>
        <div class="evgrid" id="evs"></div>
      </div>
      <div class="card">
        <h2>누가 담았나 <span>무임승차 확인</span></h2>
        <div class="scroll"><table id="who"></table></div>
      </div>
    </div>
  </div>
</div>

<div id="show" class="hide"></div>

<!-- ▼ 수업 내용 ▼ -->
<script>
/* ===================================================================
   우리 조 장바구니 — 내용 파일
   값·문구를 고치려면 여기만 보시면 됩니다.
   flags = 여행 결과 이야기를 만들 때 쓰는 표시 (학생에겐 안 보임)
   =================================================================== */
window.BUDGET = 80000;

window.SLOTS = [
{ key:'캐리어', emoji:'🧳', note:'조에 하나. 짐을 나눠 담습니다', opts:[
  { name:'형·누나 것 빌리기', price:0,     days:0, arrive:'오늘',        desc:'낡았다. 지퍼가 잘 안 잠긴다', flags:['지퍼'] },
  { name:'대여',              price:8000,  days:0, arrive:'오늘',        desc:'바퀴 하나가 뻑뻑하다',        flags:['바퀴'] },
  { name:'저가 신품',         price:29000, days:5, arrive:'5일 뒤',      desc:'무난하다',                    flags:[] },
  { name:'중형 신품',         price:45000, days:2, arrive:'2일 뒤',      desc:'크고 튼튼하다',               flags:[] }
]},
{ key:'카메라', emoji:'📷', note:'여행 사진을 남길 방법', opts:[
  { name:'폰으로만',          price:0,     days:0, arrive:'—',           desc:'배터리가 나가면 끝이다',      flags:['폰만'] },
  { name:'일회용 필름 2개',   price:18000, extra:8000, extraName:'현상비',
    days:0, arrive:'오늘 · 편의점', desc:'54장. 찍고 나서야 뭐가 나왔는지 안다', flags:['필름'] },
  { name:'즉석카메라 중고',   price:35000, days:0, arrive:'오늘 · 직거래', desc:'필름 10장 포함 · 보증 없음', flags:['즉석'] },
  { name:'즉석카메라 신품',   price:89000, days:3, arrive:'3일 뒤',      desc:'필름 40장 포함',              flags:['즉석','사치'] }
]},
{ key:'보조배터리', emoji:'🔋', note:'조원끼리 돌려 씁니다', opts:[
  { name:'안 삼',             price:0,     days:0, arrive:'—',           desc:'',                            flags:['방전'] },
  { name:'5,000mAh 한 개',    price:12000, days:2, arrive:'2일 뒤',      desc:'한 명분. 나눠 쓰기엔 모자라다', flags:['방전'] },
  { name:'10,000mAh 한 개',   price:25000, days:2, arrive:'2일 뒤',      desc:'조가 쓰기 충분하다',          flags:[] },
  { name:'10,000mAh 두 개',   price:46000, days:3, arrive:'3일 뒤',      desc:'넉넉하지만 무겁다',           flags:['짐','사치'] }
]},
{ key:'간식', emoji:'🍫', note:'밤에 먹을 것', opts:[
  { name:'최소',              price:5000,  days:0, arrive:'오늘',        desc:'세면도구 위주',               flags:['배고픔'] },
  { name:'보통',              price:12000, days:0, arrive:'오늘',        desc:'우리 조가 먹을 만큼',         flags:[] },
  { name:'넉넉히',            price:22000, days:0, arrive:'오늘',        desc:'조금 나눠줄 수 있다',         flags:['나눔'] },
  { name:'다른 조까지 돌릴 만큼', price:38000, days:0, arrive:'오늘',    desc:'',                            flags:['파티','사치'] }
]},
{ key:'밤에 할 것', emoji:'🎲', note:'소등 후 두 시간', opts:[
  { name:'없음',              price:0,     days:0, arrive:'—',           desc:'',                            flags:['심심'] },
  { name:'카드 한 벌',        price:3000,  days:0, arrive:'오늘',        desc:'가볍다',                      flags:['놀이'] },
  { name:'보드게임 중고',     price:15000, days:0, arrive:'오늘 · 직거래', desc:'부피가 크다',               flags:['놀이','짐'] },
  { name:'보드게임 신품 2종', price:42000, days:3, arrive:'3일 뒤',      desc:'부피가 크다',                 flags:['놀이','짐','사치'] }
]},
{ key:'비상 세트', emoji:'🧴', note:'다치거나 아플 때', opts:[
  { name:'없음',              price:0,     days:0, arrive:'—',           desc:'',                            flags:['무방비'] },
  { name:'밴드만',            price:3000,  days:0, arrive:'오늘',        desc:'약은 없다',                   flags:['무방비'] },
  { name:'밴드 + 멀미약 + 두통약', price:9000, days:0, arrive:'오늘',    desc:'',                            flags:['준비됨'] },
  { name:'종합 구급함',       price:25000, days:2, arrive:'2일 뒤',      desc:'크고 무겁다',                 flags:['준비됨','짐'] }
]}
];

/* 이벤트로 열리는 칸 */
window.RAIN_SLOT = { key:'우비', emoji:'☂️', note:'비 예보가 떴습니다', opts:[
  { name:'안 삼',            price:0,    days:0, arrive:'—',    desc:'', flags:['비맞음'] },
  { name:'조 우비 세트',     price:9000, days:0, arrive:'오늘 · 편의점', desc:'조원 수만큼', flags:['우비'] }
]};

/* 이벤트 */
window.EVENTS = [
 { id:'rain',  em:'🌧️', name:'일기예보 — 둘째 날 비', at:12, must:true,
   desc:'우비 칸이 열립니다', toast:'둘째 날 비 예보! ☂️ 우비 칸이 열렸습니다' },
 { id:'delay', em:'📦', name:'배송 지연 — 3일 이상 전부 아웃', at:22, must:true,
   desc:'3일 이상 걸리는 상품이 담겨 있으면 빠지고 환불됩니다', toast:'배송 지연! 3일 이상 걸리는 물건은 여행 후에 옵니다' },
 { id:'cut',   em:'✂️', name:'예산 삭감 −10,000원', at:28, must:true,
   desc:'예산이 70,000원이 됩니다', toast:'예산 삭감! 10,000원이 회수됐습니다' },
 { id:'sale',  em:'⏱️', name:'깜짝 세일 — 즉석카메라 신품 55,000원 (2분)', at:0, must:false,
   desc:'89,000 → 55,000원, 2분간', toast:'깜짝 세일! 즉석카메라 신품 55,000원 · 2분' },
 { id:'gift',  em:'💰', name:'용돈 추가 +10,000원', at:0, must:false,
   desc:'전 조 예산 +10,000원', toast:'담임 선생님이 10,000원을 보태주셨습니다' }
];

/* ─────────────────────────────────────────────────────────
   결과 이야기 — 위에서부터 순서대로 조립됩니다

   need : 이 표시가 다 있어야 나옵니다
   not  : 이 표시가 있으면 안 나옵니다
   good : 좋은 일 (초록으로 뜨고, 조원 이름이 들어갑니다)
   fx   : 화면 연출
        shake 흔들림 / rain 비 / dark 암전 / clock 시계 / photos 사진이 사라짐
        film 필름 / flash 플래시 / none 없음
   글 안에 쓸 수 있는 것
        {p:칸이름}  그 칸에 쓴 금액        예) {p:보조배터리}
        {rest}      남은 돈
        {n}         조원 이름 (좋은 일에만 넣으세요)
   ───────────────────────────────────────────────────────── */
window.STORY = [
 { day:1, need:['지퍼'],   fx:'shake',
   text:'버스에서 가방 지퍼가 터졌다. 옷을 손에 들고 다녔다.' },
 { day:1, need:['바퀴'],   fx:'shake',
   text:'바퀴 하나가 끝까지 안 굴렀다. 끌 때마다 소리가 났다.' },
 { day:1, need:['지각'],   fx:'none',
   text:'택배는 여행에서 돌아온 다음 날 도착했다. 상자를 여는데 기분이 이상했다.' },

 { day:2, need:['우비'],   fx:'rain', good:true,
   text:'오후부터 비가 왔다. {p:우비}원짜리 우비 덕에 너희 조만 멀쩡했다.' },
 { day:2, need:['비맞음'], fx:'rain',
   text:'오후부터 비가 왔다. 9,000원이 없어서 우비를 못 샀다. 세 시간을 젖은 채로 걸었다.' },
 { day:2, need:['방전','폰만'], fx:'dark',
   text:'너희 조는 배터리에 {p:보조배터리}원을 썼다. 네 시에 폰이 꺼졌다.' },
 { day:2, need:['방전','폰만'], fx:'photos',
   text:'단체사진에 너희 조만 없다. 사진이 한 장도 안 남았다.' },
 { day:2, need:['방전'], not:['폰만'], fx:'dark',
   text:'폰은 꺼졌다. 그래도 카메라가 있었다.' },
 { day:2, need:['필름'],   fx:'film', good:true,
   text:'{n}이 쉰네 장을 다 썼다. 현상하고 나서야 뭐가 찍혔는지 알았다. 그게 제일 재밌었다.' },
 { day:2, need:['즉석'],   fx:'flash', good:true,
   text:'찍는 자리에서 사진이 나왔다. 다른 조가 몰려와서 찍어달라고 했다.' },

 { day:3, need:['무방비'], fx:'none',
   text:'한 명이 넘어져서 무릎이 까졌다. 가방에 아무것도 없었다.' },
 { day:3, need:['준비됨'], fx:'none', good:true,

 { day:4, need:['짐2'],    fx:'shake',

/* 이름을 나쁜 일에는 절대 안 넣습니다. false로 두면 이름을 아예 안 씁니다. */
window.USE_NAMES = true;

/* 배지 */
window.BADGES = [
 { id:'thrift', em:'💸', name:'짠돌이상', desc:'남은 돈 1위' },
 { id:'rain',   em:'☂️', name:'예언자상', desc:'우비를 산 조' },
 { id:'photo',  em:'📸', name:'사진상',   desc:'사진을 남긴 조' },
 { id:'party',  em:'🍫', name:'인싸상',   desc:'다른 조까지 먹인 조' },
 { id:'aid',    em:'🩹', name:'구급대상', desc:'약을 챙긴 조' },
 { id:'night',  em:'🎲', name:'밤샘상',   desc:'놀 것을 챙긴 조' },
 { id:'sleep',  em:'😴', name:'취침상',   desc:'밤에 할 게 없던 조' },
 { id:'broke',  em:'💀', name:'파산상',   desc:'예산 초과' }
];

/* ===================================================================
   공용 계산기 — 학생 화면과 진행판이 같은 규칙을 쓰도록 여기 모았습니다.
   (여기는 고치지 않으셔도 됩니다)
   =================================================================== */
window.TRIPLIB = {
  slotList(ST){ return ST.events && ST.events.rain ? [...window.SLOTS, window.RAIN_SLOT] : [...window.SLOTS]; },
  spentOf(c){ return Object.values((c&&c.items)||{}).reduce((a,b)=>a+(b.price||0),0); },
  flagsOf(c,ST){
    const f=[];
    this.slotList(ST).forEach(s=>{
      const it=(c.items||{})[s.key], o = it ? s.opts[it.opt] : s.opts[0];
      if(!o) return;
      (o.flags||[]).forEach(x=>f.push(x));
      if(it && s.opts[it.opt].days>=3 && !(ST.events||{}).delay) f.push('지각');
    });
    if(f.filter(x=>x==='짐').length>=2) f.push('짐2');
    const sp=this.spentOf(c);
    if(ST.budget-sp>=20000) f.push('여유');
    if(sp>ST.budget) f.push('초과');
    if((ST.events||{}).rain && !f.includes('우비')) f.push('비맞음');
    return [...new Set(f)];
  },
  storyOf(c,ST){
    const f=this.flagsOf(c,ST);
    if(f.includes('초과')) return {fail:true, lines:[]};
    const lines=window.STORY.filter(r=>
      r.need.every(n=>f.includes(n)) && !(r.not||[]).some(n=>f.includes(n)));
    return {fail:false, lines};
  },
  pickName(c){
    if(!window.USE_NAMES) return '누군가';
    const ns=[...new Set(Object.values((c&&c.items)||{})
      .map(i=>(i.by||'').split(' ')[1]).filter(Boolean))];
    if(!ns.length) return '누군가';
    let h=0; const s=(c.team||'')+ns.join('');
    for(const ch of s) h=(h*31+ch.charCodeAt(0))>>>0;
    return ns[h%ns.length];
  },
  fill(text,c,ST){
    const w=n=>Number(n).toLocaleString('ko-KR');
    return String(text)
      .replace(/\{p:([^}]+)\}/g,(_,k)=>{ const it=(c.items||{})[k.trim()]; return w(it?it.price:0); })
      .replace(/\{rest\}/g,()=>w(Math.max(0,ST.budget-this.spentOf(c))))
      .replace(/\{n\}/g,()=>this.pickName(c));
  },
  badgesOf(c,ST,all){
    const f=this.flagsOf(c,ST), out=[], B=window.BADGES, get=i=>B.find(b=>b.id===i);
    const rest=ST.budget-this.spentOf(c);
    const list=Object.values(all||{});
    const maxRest=list.length?Math.max(...list.map(x=>ST.budget-this.spentOf(x))):rest;
    if(f.includes('초과')) out.push(get('broke'));
    else if(rest===maxRest && rest>0) out.push(get('thrift'));
    if(f.includes('우비'))out.push(get('rain'));
    if(f.includes('필름')||f.includes('즉석'))out.push(get('photo'));
    if(f.includes('파티'))out.push(get('party'));
    if(f.includes('준비됨'))out.push(get('aid'));
    if(f.includes('놀이'))out.push(get('night'));
    if(f.includes('심심'))out.push(get('sleep'));
    return out.filter(Boolean);
  }
};

/* 화면 */
function draw(){

  $('#phase').textContent = ST.phase==='shop'?'편성 중':(ST.phase==='result'?'결과 공개 중':'투표 중');
  const ts=Object.keys(CARTS).sort((a,b)=>parseInt(a)-parseInt(b));
  const done=ts.filter(t=>CARTS[t].submitted).length;
  $('#cnt').textContent=`${ts.length}개 조 · 제출 ${done}/${ts.length}`;
  $('#teams').innerHTML = ts.length? ts.map(t=>{
    const c=CARTS[t], sp=spentOf(c), rest=ST.budget-sp, over=rest<0;
    const empty=slotList().filter(s=>!(c.items||{})[s.key]).length;
    return `<div class="row"><div class="lb"><span>${c.submitted?'<span style="color:#2f7048">✅</span> ':''}${t}${empty?` · <span style="color:#c2410c">${empty}칸 빔</span>`:''}</span>
      <span class="n ${over?'over':''}">${over?`${won(-rest)}원 초과`:`${won(rest)}원 남음`}</span></div>
      <div class="tk"><div class="fl ${over?'over':''}" style="width:${Math.min(100,Math.round(sp/ST.budget*100))}%"></div></div>
      <div class="it">${slotList().map(s=>{const it=(c.items||{})[s.key];
        return `${s.emoji}${it?it.name:'—'}`;}).join(' · ')}</div></div>`;
  }).join('') : '<p style="color:#77716a">아직 아무 조도 안 들어왔습니다</p>';

  const el=Math.floor((Date.now()-(t0||Date.now()))/60000);
  $('#evs').innerHTML=window.EVENTS.map(e=>{
    const done=!!ST.events[e.id], due=t0&&e.at&&el>=e.at&&!done;
    return `<button class="evb ${done?'done':''} ${due?'due':''}" data-e="${e.id}">
      <span class="em">${e.em}</span>
      <span><span class="t">${e.name}</span><br><span class="d">${e.desc}</span></span>
      <span class="at">${e.at?e.at+'분':'선택'}</span></button>`;}).join('');
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>fire(b.dataset.e));

  const cnt={};
  Object.entries(CARTS).forEach(([t,c])=>Object.values(c.items||{}).forEach(it=>{
    if(!it.by) return; cnt[it.by]=cnt[it.by]||{t,n:0}; cnt[it.by].n++; }));
  const names=Object.keys(cnt).sort((a,b)=>cnt[a].t.localeCompare(cnt[b].t));
  $('#who').innerHTML=`<tr><th>조</th><th>학생</th><th>담은 칸</th></tr>`+
    (names.length? names.map(n=>`<tr><td>${cnt[n].t}</td><td>${n}</td>
      <td style="${cnt[n].n<=0?'color:#c2410c':''}">${cnt[n].n}</td></tr>`).join('')
      : '<tr><td colspan="3" style="color:#77716a">아직 없습니다</td></tr>');

  if(!$('#show').classList.contains('hide')) drawShow();
}
let play={team:null,i:0,typing:null,waiting:null,done:false,lines:[],mute:false};
function showTeams(){ return Object.keys(CARTS).sort((x,y)=>parseInt(x)-parseInt(y)); }
function stopShow(){ clearInterval(play.typing); clearTimeout(play.waiting); play.typing=play.waiting=null; }

function startShow(idx){
  stopShow();
  const ts=showTeams();
  if(!ts.length){ $('#show').innerHTML='<div class="nav">Esc 닫기</div><h2>아직 조가 없습니다</h2>'; return; }
  showIdx=Math.max(0,Math.min(idx,ts.length-1));
  const t=ts[showIdx], c=CARTS[t], st=storyOf(c);
  play.team=t; play.i=0; play.done=false;
  play.lines = st.fail
    ? [{day:1,fx:'dark',bad:true,text:'출발 전날 엄마가 결제를 취소했다. 이 조는 아무것도 못 받았다.'}]
    : (st.lines.length?st.lines:[{day:1,fx:'none',text:'아무 일도 없었다. 무난한 여행이었다.'}]);
  const sp=spentOf(c), rest=ST.budget-sp;
  $('#show').innerHTML=`
    <div class="fx" id="fx"></div>
    <div class="nav">← → 조 넘기기 · 스페이스 다시 · Esc 닫기 &nbsp;(${showIdx+1}/${ts.length})
      <button id="mute">${play.mute?'🔇':'🔊'}</button></div>
    <div class="stage">
      <div class="head">${t}의 수학여행</div>
      <div class="money2">${won(sp)}원 씀 · ${rest<0?`<b class="bad">${won(-rest)}원 초과</b>`:won(rest)+'원 남음'}</div>
      <div class="lines" id="lines"></div>
      <div class="tail" id="tail"></div>
    </div>`;
  $('#mute').onclick=e=>{ e.stopPropagation(); play.mute=!play.mute; $('#mute').textContent=play.mute?'🔇':'🔊'; };
  $('#show').onclick=()=>{
    if(play.typing) finishLine();
    else if(play.done) startShow(showIdx+1);
    else nextLine();
  };
  nextLine();
}

function nextLine(){
  stopShow();
  const r=play.lines[play.i];
  if(!r){ endShow(); return; }
  const c=CARTS[play.team];
  const el=document.createElement('p');
  el.className='ln '+(r.good?'good':(r.bad!==false?'bad':''));
  const days={1:'첫째 날',2:'둘째 날',3:'셋째 날 · 밤',4:''};
  const prev=play.lines[play.i-1];
  if(days[r.day] && (!prev || prev.day!==r.day)){
    const d=document.createElement('div'); d.className='dayline'; d.textContent=days[r.day];
    $('#lines').appendChild(d);
  }
  $('#lines').appendChild(el);
  document.querySelectorAll('#lines .ln').forEach(p=>p.classList.add('old'));
  el.classList.remove('old');
  fx(r.fx);
  const full=fill(r.text,c); let k=0;
  play.typing=setInterval(()=>{
    el.textContent=full.slice(0,++k);
    $('#show').scrollTop=$('#show').scrollHeight;
    if(k>=full.length) finishLine();
  }, 38);
}
function finishLine(){
  clearInterval(play.typing); play.typing=null;
  const r=play.lines[play.i], c=CARTS[play.team];
  const el=$('#lines').lastElementChild; if(el) el.textContent=fill(r.text,c);
  play.i++;
  play.waiting=setTimeout(nextLine, r.good?1300:1900);
}
function endShow(){
  play.done=true;
  const c=CARTS[play.team], bg=badgesOf(c);
  $('#tail').innerHTML=`
    ${bg.length?`<div class="bg">${bg.map(b=>`<span>${b.em} ${b.name}</span>`).join('')}</div>`:''}
    <div class="items">${slotList().map(s=>{const it=(c.items||{})[s.key];
      return `${s.emoji} ${it?it.name:'안 챙김'}`;}).join('　·　')}</div>
    <div class="more">화면을 누르면 다음 조 →</div>`;
}

/* 화면 연출 */
function fx(kind){
  const box=$('#fx'); if(!box) return;
  box.className='fx'; box.innerHTML='';
  const sh=$('#show');
  sh.classList.remove('shaking');
  if(kind==='shake'){ sh.classList.add('shaking'); beep('thud');
    setTimeout(()=>sh.classList.remove('shaking'),500); }
  if(kind==='rain'){ box.className='fx rain'; beep('rain'); }
  if(kind==='dark'){ box.className='fx dark'; beep('off'); }
  if(kind==='flash'){ box.className='fx flash'; beep('click'); }
  if(kind==='clock'){ box.className='fx clock';
    box.innerHTML='<div class="cl" id="cl">11:00</div>';
    let h=11; const t=setInterval(()=>{ h=h===12?1:h+1;
      const e=$('#cl'); if(!e){clearInterval(t);return;}
      e.textContent=(h<10?'0':'')+h+':00'; }, 500);
    setTimeout(()=>clearInterval(t),2600); }
  if(kind==='photos'){ box.className='fx photos';
    box.innerHTML=Array.from({length:6},(_,i)=>`<div class="ph" style="animation-delay:${i*.22}s"></div>`).join(''); }
  if(kind==='film'){ box.className='fx film';
    box.innerHTML='<div class="strip">'+Array.from({length:14},()=>'<i></i>').join('')+'</div>';
    beep('click'); }
}

/* 소리 — 파일 없이 만듭니다 */
let AC=null;
function beep(kind){
  if(play.mute) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime;
    if(kind==='off'){ const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine'; o.frequency.setValueAtTime(440,t); o.frequency.exponentialRampToValueAtTime(70,t+.45);
      g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+.5);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t+.5); }
    if(kind==='click'){ const o=AC.createOscillator(),g=AC.createGain();
      o.type='square'; o.frequency.setValueAtTime(1400,t);
      g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.08);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t+.09); }
    if(kind==='thud'){ const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine'; o.frequency.setValueAtTime(90,t); o.frequency.exponentialRampToValueAtTime(40,t+.2);
      g.gain.setValueAtTime(.25,t); g.gain.exponentialRampToValueAtTime(.001,t+.25);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t+.26); }
    if(kind==='rain'){ const n=AC.createBufferSource();
      const buf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*.25;
      n.buffer=buf; const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=1200;
      const g=AC.createGain(); g.gain.setValueAtTime(.001,t);
      g.gain.linearRampToValueAtTime(.13,t+.3); g.gain.linearRampToValueAtTime(.001,t+2);
      n.connect(f).connect(g).connect(AC.destination); n.start(t); n.stop(t+2); }
  }catch(e){}
}
function drawShow(){ if(play.team && !CARTS[play.team]) startShow(0); }

setInterval(()=>{
  if(t0){ const s=Math.floor((Date.now()-t0)/1000);
    $('#clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
  draw();
},1000);
</script>
