<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>무인도 100억 — 교사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&family=Jua&family=Gaegu:wght@400;700&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4efe4;--dim:#a89e8f;--dim2:#6d6558;--line:#3a352d;--bg:#17150f;--card:#221f18;
 --gold:#e8ab45;--green:#55b981;--red:#e8593c;--blue:#5d9fd6;--fs:1;
 --font:'Dongle','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
 font-family:var(--font);word-break:keep-all}
button,select{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app{height:100%;display:flex;flex-direction:column;font-size:calc(16px * var(--fs))}

/* 조작 스트립 */
.ctrl{flex:none;background:#0c0a06;border-bottom:1px solid var(--line);padding:6px 10px;
 display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:.9em}
.ctrl.hide{display:none}
.ctrl button{padding:6px 11px;border-radius:9px;background:#241f16;border:1px solid #3d372c;font-weight:700}
.ctrl button:hover{background:#332c1e}
.ctrl button.pri{background:var(--gold);color:#17150f;border-color:var(--gold)}
.ctrl button.dan{background:#3a1c14;color:#ffb4a0;border-color:#5c2f22}
.ctrl button.ok{background:#1c3a29;color:#a5e2c0;border-color:#2f6b4a}
.ctrl .sep{width:1px;height:20px;background:#3d372c;margin:0 3px}
.ctrl .lb{color:var(--dim2);font-size:.85em;padding:0 3px}
.ctrl select{padding:5px 8px;border-radius:8px;background:#241f16;border:1px solid #3d372c}

.stage{flex:1;display:flex;flex-direction:column;min-height:0;padding:14px 22px}
h1{font-family:var(--font);font-size:2.6em;margin:0;font-weight:700;line-height:1.1}
.sub{color:var(--dim);font-size:1.1em}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
 text-align:center;gap:8px;min-height:0}
.mid .big{font-size:4.6em;line-height:1}
.mid h2{font-size:2.8em;margin:0;font-weight:700;line-height:1.15}
.mid p{font-size:1.35em;color:var(--dim);margin:0;line-height:1.5;white-space:pre-line}
.pulse{animation:pl 1.6s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes sl{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}

.grid8{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.tc{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:10px 12px;animation:sl .3s}
.tc .h{display:flex;align-items:baseline;gap:7px}
.tc .h b{font-size:1.5em}
.tc .h .n{margin-left:auto;font-size:.85em;color:var(--dim2)}
.tc .st{font-size:1.15em;color:var(--dim)}
.tc.done{border-color:#2f6b4a;background:#1a2a20}
.tc.wait{opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chips span{background:#2a251b;border:1px solid #3d372c;border-radius:9px;padding:2px 7px;font-size:.95em}

.evhead{display:flex;align-items:center;gap:16px;padding:4px 0 10px;border-bottom:1px solid var(--line)}
.evhead .em{font-size:3em;line-height:1}
.evhead .when{font-size:.95em;color:var(--gold);letter-spacing:.1em}
.evhead h2{font-size:2.3em;margin:0;font-weight:700;line-height:1.1}
.evhead .ds{font-size:1.05em;color:var(--dim);white-space:pre-line;line-height:1.35}
.evhead .cnt{margin-left:auto;text-align:right}
.evhead .cnt b{font-size:2.6em;color:var(--gold);font-variant-numeric:tabular-nums}

.rows{flex:1;overflow:auto;margin-top:8px}
.rw{display:flex;align-items:center;gap:12px;padding:7px 14px;border-radius:12px;margin-bottom:5px;
 background:var(--card);font-size:1.25em;animation:sl .28s both}
.rw .t{font-weight:700;width:56px;flex:none}
.rw .u{display:flex;gap:5px;flex:none;width:230px;flex-wrap:wrap}
.rw .u span{background:#2a251b;border:1px solid #3d372c;border-radius:9px;padding:1px 7px;font-size:.85em}
.rw .ln{flex:1;font-size:.95em;color:var(--dim)}
.rw .p{font-weight:700;font-variant-numeric:tabular-nums;width:70px;text-align:right;font-size:1.35em}
.rw.g{background:#1c3527;color:#c9f0da} .rw.g .p{color:#8fe6b6} .rw.g .ln{color:#8fbfa4}
.rw.b{background:#331d18;color:#ffcdbf} .rw.b .p{color:#ff9b82} .rw.b .ln{color:#c99384}

/* 거래 */
.trw{flex:1;display:grid;grid-template-columns:1.4fr 1fr;gap:16px;min-height:0}
.log{overflow:auto;min-height:0}
.lg{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
 border-radius:13px;padding:8px 13px;margin-bottom:6px;font-size:1.2em;animation:sl .3s}
.lg .a{color:var(--dim)} .lg .b{color:var(--gold);font-weight:700}
.lg .ar{color:var(--dim2)}
.lg .pr{margin-left:auto;font-size:.9em;color:var(--dim2);text-align:right}
.tmrbig{font-size:6em;font-weight:700;color:var(--gold);text-align:center;
 font-variant-numeric:tabular-nums;line-height:1}
.tmrbig.hot{color:var(--red);animation:tk .5s infinite}
@keyframes tk{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* 그래프 */
.chart{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:80px;padding:46px 40px 46px;min-height:0}
.bar{width:160px;background:linear-gradient(180deg,#e8593c,#8c3324);border-radius:12px 12px 0 0;
 position:relative;animation:gr .7s cubic-bezier(.2,1,.3,1) both}
@keyframes gr{from{height:0!important}}
.bar.ok{background:linear-gradient(180deg,#55b981,#2b6647)}
.bar span{position:absolute;top:-1.75em;left:-24px;right:-24px;text-align:center;
 font-size:1.75em;font-weight:700;color:var(--ink);white-space:nowrap}
.bar.ok span{color:#8fe6b6}
.bar em{position:absolute;bottom:-32px;left:-30px;right:-30px;text-align:center;font-style:normal;
 font-size:1.05em;color:var(--dim);white-space:nowrap}

/* 순위 */
.two{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:18px;min-height:0}
.col{display:flex;flex-direction:column;min-height:0}
.col h3{margin:0 0 6px;font-size:1.6em;font-weight:700}
.col h3 small{font-size:.6em;color:var(--dim);font-weight:400}
.col .list{flex:1;overflow:auto}
.rk{display:flex;align-items:center;gap:10px;padding:6px 13px;border-radius:11px;margin-bottom:4px;
 background:var(--card);font-size:1.3em;animation:sl .3s both}
.rk .no{width:34px;color:var(--dim2);font-weight:700}
.rk .t{font-weight:700;width:60px}
.rk .v{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.rk.top{background:#2b2416;border:1px solid #5f4c22}
.rk.top .v{color:var(--gold)}
.rk .x{font-size:.75em;color:var(--dim2)}

.board .li{background:var(--card);border-left:4px solid var(--gold);border-radius:0 14px 14px 0;
 padding:12px 20px;margin-bottom:12px;animation:sl .4s both}
.board .li b.k{color:var(--gold);font-size:1.6em;display:block}
.board .li .v{font-size:1.3em;color:var(--ink);line-height:1.45}
.board .li .v b{color:var(--gold)}

.foot{flex:none;padding:4px 0 0;font-size:.8em;color:#494336;text-align:center}
.store{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
 background:radial-gradient(circle at 50% 40%,#1e2a2e,#17150f 70%)}
.store .p{font-size:5.6em;font-weight:700;color:var(--gold);line-height:1}
.store .l{font-size:1.6em;color:var(--dim);line-height:1.55;text-align:center}
.store .l b{color:var(--ink)}
</style>
</head>
<body>
<div id="app"></div>

<!-- ▼ 수업 내용 ▼ -->
<script>
/* ===================================================================
   무인도 100억 — 내용 파일
   로또 당첨 → 짐싸기 8칸 → 추락 → 4일 생존 → 구조
   값·문구를 고치려면 여기만 보시면 됩니다.
   =================================================================== */

/* 폰트 — 'Dongle' 동글 / 'Jua' 주아 / 'Gaegu' 개구 / 'Do Hyeon' 도현 */
window.FONT = 'Dongle';
window.FONT_SCALE = 1.42;   // 동글은 글자가 작아서 키웁니다. 주아로 바꾸면 1 로.

window.CFG = {
  teams: 8,
  slots: 8,           // 캐리어 칸수
  prize: 10000000000, // 로또 1등 100억
  tradeSeconds: 180,  // 물물교환 3분
  hp: 3               // 조원 체력 (0 되면 탈진)
};

/* ─────────────────────────────────────────────
   짐 후보 20개  (도시 가격 비싼 순으로 자동 정렬됩니다)
   price : 도시 가격(원)
   kind  : lux 사치 / trip 여행 / life 생필
   ───────────────────────────────────────────── */
window.GOODS = [
 { id:'cash',  em:'💵', name:'현금 다발',    sub:'100억 원',      price:10000000000, kind:'lux'  },
 { id:'ring',  em:'💍', name:'다이아몬드 반지', sub:'3캐럿',       price:300000000,   kind:'lux'  },
 { id:'neck',  em:'📿', name:'금목걸이',      sub:'24K 100g',      price:50000000,    kind:'lux'  },
 { id:'watch', em:'⌚', name:'명품 시계',     sub:'스위스제',       price:30000000,    kind:'lux'  },
 { id:'coat',  em:'🧥', name:'명품 코트',     sub:'캐시미어 100%',  price:8000000,     kind:'lux'  },
 { id:'cam',   em:'📷', name:'미러리스 카메라', sub:'여행 브이로그용', price:1500000,    kind:'trip' },
 { id:'perf',  em:'🌸', name:'향수',         sub:'100ml',          price:300000,      kind:'lux'  },
 { id:'spk',   em:'🔊', name:'블루투스 스피커', sub:'방수·최대출력 큼', price:200000,   kind:'trip' },
 { id:'shoe',  em:'👟', name:'에어포스 운동화', sub:'한정판',        price:150000,      kind:'lux'  },
 { id:'rod',   em:'🎣', name:'낚싯대',       sub:'미끼 포함',       price:80000,       kind:'life' },
 { id:'swim',  em:'🩳', name:'수영복',       sub:'하와이 필수템',    price:50000,       kind:'trip' },
 { id:'knife', em:'🔪', name:'맥가이버칼',    sub:'12가지 기능',     price:50000,       kind:'life' },
 { id:'aid',   em:'🧰', name:'구급함',       sub:'소독약·붕대',     price:40000,       kind:'life' },
 { id:'blank', em:'🧣', name:'담요',         sub:'두꺼운 것',       price:30000,       kind:'life' },
 { id:'tube',  em:'🛟', name:'튜브',         sub:'대형',           price:30000,       kind:'trip' },
 { id:'umb',   em:'☂️', name:'우산',         sub:'장우산',          price:20000,       kind:'life' },
 { id:'noodle',em:'🍜', name:'라면 20개',    sub:'한 박스',         price:20000,       kind:'life' },
 { id:'mirror',em:'🪞', name:'손거울',       sub:'접이식',          price:10000,       kind:'life' },
 { id:'water', em:'💧', name:'생수 6병',     sub:'2L × 6',         price:6000,        kind:'life' },
 { id:'fire',  em:'🔥', name:'라이터',       sub:'편의점 것',       price:1000,        kind:'life' }
];

/* ─────────────────────────────────────────────
   사건 8개 (4일)
   solves : 위에서부터 best 매칭. need 가 고른 물건에 포함되면 성립
   pick   : 학생이 고를 수 있는 개수 (기본 2)
   ───────────────────────────────────────────── */
window.EVENTS = [
 { id:'e1', day:1, when:'첫째 날 · 밤', em:'🌑',
   title:'이가 딱딱 부딪힌다',
   desc:'낮에 그렇게 뜨겁던 모래가 해가 지자 얼음장이 됐다.\n바람을 막을 게 아무것도 없다.',
   ask:'이 밤을 뭘로 버틸까?',
   solves:[
     {need:['fire','coat'], pts:3, line:'800만원짜리 코트를 찢어 불을 붙였다. 인생에서 제일 따뜻한 800만원이었다.'},
     {need:['fire','cash'], pts:3, line:'100억을 한 장씩 태웠다. 잘 탄다. 아주 잘 탄다.'},
     {need:['blank'],       pts:3, line:'담요 하나를 셋이 억지로 나눠 덮었다. 그래도 잤다.'},
     {need:['fire'],        pts:2, line:'떠내려온 나뭇가지를 모아 불을 피웠다. 셋이 불 앞에 붙어 앉았다.'},
     {need:['perf'],        pts:2, line:'향수를 뿌리고 불씨를 붙였다. 알코올이라 확 붙었다. 30만원이 5분 탔다.'},
     {need:['coat'],        pts:1, line:'코트를 셋이 덮었다. 발이 나온다. 없는 것보단 낫다.'}
   ],
   fail:{pts:-3, down:1, line:'아무것도 없었다. 셋이 끌어안고 덜덜 떨다 새벽을 맞았다.'} },

 { id:'e2', day:2, when:'둘째 날 · 낮', em:'💧',
   title:'목이 탄다',
   desc:'어제부터 한 모금도 못 마셨다. 눈앞이 노랗다.\n바닷물은 마실수록 더 목이 마르다.',
   ask:'물을 어떻게 구할까?',
   solves:[
     {need:['water'],  pts:4, line:'뚜껑을 열자마자 셋이 돌려 마셨다. 6,000원짜리가 이렇게 맛있을 줄 몰랐다.'},
     {need:['umb'],    pts:3, line:'우산을 뒤집어 밤새 빗물을 받았다. 반 컵쯤 고였다. 나눠 마셨다.'},
     {need:['tube'],   pts:2, line:'튜브를 펴서 빗물을 받았다. 고무 맛이 나지만 마셨다.'},
     {need:['knife'],  pts:2, line:'칼로 야자열매를 쪼갰다. 안에 물이 있었다. 셋이 소리를 질렀다.'}
   ],
   fail:{pts:-5, down:1, line:'결국 바닷물을 마셨다. 30분 뒤 다 토했다. 한 명이 모래밭에 쓰러졌다.'} },

 { id:'e3', day:3, when:'셋째 날 · 아침', em:'🩸',
   title:'발을 산호에 베였다',
   desc:'물을 뜨러 가다 미끄러졌다. 발바닥이 길게 갈라졌다.\n모래가 들어갔고, 벌써 붓기 시작한다.',
   ask:'상처를 어떻게 할까?',
   solves:[
     {need:['aid'],    pts:4, line:'소독약을 붓고 붕대를 감았다. 저녁이 되자 부기가 빠졌다.'},
     {need:['shoe'],   pts:3, line:'운동화를 신고 있었다. 애초에 아무도 안 다쳤다. 15만원이 오늘의 MVP.'},
     {need:['perf'],   pts:2, line:'향수를 상처에 부었다. 눈물이 찔끔 났지만 소독은 됐다.'},
     {need:['knife'],  pts:1, line:'칼끝으로 박힌 산호 조각을 빼냈다. 피가 났지만 덜 아프다.'},
     {need:['water'],  pts:1, line:'아까운 생수로 상처를 씻었다. 마실 물이 줄었다.'}
   ],
   fail:{pts:-4, down:1, line:'모래를 털고 그냥 뒀다. 저녁이 되자 발이 두 배로 부었다. 걷지를 못한다.'} },

 { id:'e4', day:3, when:'셋째 날 · 낮', em:'🍽️',
   title:'사흘째 아무것도 못 먹었다',
   desc:'배에서 소리가 난다. 손이 떨려서 물건을 못 잡겠다.\n눈앞에 바다는 있는데, 잡을 방법이 없다.',
   ask:'뭘 먹을까?',
   solves:[
     {need:['rod'],             pts:4, line:'두 시간 만에 손바닥만 한 물고기를 낚았다. 셋이 환호성을 질렀다.'},
     {need:['noodle','fire'],   pts:3, line:'불을 피워 라면을 끓였다. 국물이 목을 타고 내려가는 순간 아무도 말을 안 했다.'},
     {need:['knife'],           pts:2, line:'칼로 바위에 붙은 조개를 땄다. 날것이지만 먹었다.'},
     {need:['noodle'],          pts:1, line:'생라면을 부숴 먹었다. 짜다. 더 목이 마르다.'}
   ],
   fail:{pts:-4, down:1, line:'풀을 뜯어 씹었다. 30분 뒤 셋 다 배를 잡고 굴렀다.'} },

 { id:'e5', day:3, when:'셋째 날 · 밤', em:'⛈️',
   title:'폭풍우가 몰아친다',
   desc:'파도가 잠자리까지 넘어온다. 캐리어가 떠내려가려 한다.\n지금 뭔가 하지 않으면 짐을 잃는다.',
   ask:'짐을 어떻게 지킬까?',
   solves:[
     {need:['tube'],   pts:3, line:'튜브에 짐을 묶어 띄웠다. 아침에 보니 다 무사하다.'},
     {need:['blank'],  pts:2, line:'담요로 짐을 통째로 싸서 끌어안고 버텼다.'},
     {need:['knife'],  pts:2, line:'칼로 덩굴을 잘라 짐을 나무에 묶었다.'},
     {need:['umb'],    pts:1, line:'우산으로 짐을 가렸다. 우산은 뒤집어졌지만 짐은 남았다.'}
   ],
   fail:{pts:-2, down:0, lose:1, line:'아침에 일어나 보니 짐이 하나 사라져 있었다.'} },

 { id:'e6', day:4, when:'넷째 날 · 새벽', em:'🚢',
   title:'수평선에 배가 지나간다',
   desc:'저 멀리 불빛이 보인다. 소리를 질러도 안 들린다.\n지금 못 알리면, 다음 배가 언제 올지 아무도 모른다.',
   ask:'어떻게 알릴까?',
   solves:[
     {need:['mirror'], pts:5, line:'거울로 햇빛을 반사시켰다. 배가 방향을 틀었다. 1만원짜리가 셋을 살렸다.'},

function judge(team,e){
  const picked=((team.ans||{})[e.id])||[], own=inv(team);
  const valid=picked.filter(id=>own.includes(id));
  let best=null;
  (e.solves||[]).forEach(s=>{ if(s.need.every(n=>valid.includes(n))){ if(!best||s.pts>best.pts) best=s; }});
  if(best) return {p:best.pts,line:best.line,down:0};
  const f=e.fail||{pts:0,line:''};
  const r={p:f.pts||0,line:f.line||'',down:f.down||0};
  if(f.lose&&own.length) r.lost=own[Math.floor(Math.random()*own.length)];
  return r;
}

    const hp0=hpOf(d), r=judge(d,e);

    const res={...(d.res||{})}; res[e.id]=r;

    await saveTeam(t,o);
  }
  busy=false; snd('buzz');

       ||`<div class="mid" style="color:var(--dim)"><p>아직 성사된 거래가 없습니다.
조끼리 <b>말로</b> 합의한 뒤 화면에서 제안을 보내게 하세요.</p></div>`}</div>
     <div style="display:flex;flex-direction:column;justify-content:center;gap:14px">
       <div class="tmrbig ${left<=30?'hot':''}">${left}</div>
       <div class="grid8" style="grid-template-columns:repeat(2,1fr)">${TN().map(t=>{const d=TEAMS[t]||{};
         const w=inv(d).includes('water');
         return `<div class="tc" style="padding:7px 9px">
           <div class="h"><b style="font-size:1.2em">${t}</b>
             <span class="n">${w?'💧 물 있음':''}</span></div>
           <div class="chips">${inv(d).map(id=>`<span>${G(id).em}</span>`).join('')}</div></div>`;}).join('')}</div>
     </div></div>`;
}
function waterPaid(){
  const out=[];
  (ST.log||[]).forEach(x=>{ if(x.k.includes('water')) out.push(x.gp);
                            if(x.g.includes('water')) out.push(x.kp); });
  return out;
}
function sPrice(){
  const paid=waterPaid(), top=paid.length?Math.max(...paid):0;
  const base=6000/6; // 생수 1병
  const isl=top? top/1 : 0;
  const h=v=>Math.max(13,Math.round(Math.min(100,(Math.log10(Math.max(v,1000))-3)/(10-3)*100)));
  return `<h1>📈 생수 한 병의 값</h1>
   <div class="sub">아래 가운데 막대는 오늘 <b style="color:var(--gold)">너희가 실제로 주고받은 값</b>입니다.</div>
   <div class="chart">
     <div class="bar ok" style="height:${h(base)}%"><span>1,000원</span><em>출발 전 · 편의점</em></div>
     <div class="bar" style="height:${isl?h(isl):8}%"><span>${isl?won(isl):'거래 없음'}</span><em>넷째 날 · 섬</em></div>
     <div class="bar ok" style="height:${h(base)}%"><span>1,000원</span><em>구조된 뒤 · 편의점</em></div>
   </div>
   <div class="mid" style="flex:none"><p>${isl
     ? '같은 생수 한 병입니다. 물건은 하나도 안 변했습니다.\n바뀐 건 <b style="color:var(--gold)">얼마나 부족했느냐</b>뿐입니다.'
     : '생수를 내놓은 조가 하나도 없었습니다.\n<b style="color:var(--gold)">아무도 안 팔았다는 것</b>도 답입니다. 값을 매길 수조차 없었던 거죠.'}</p></div>`;
}
function sRank(){
  const A=TN().map(t=>({t,d:TEAMS[t]||{}})).sort((a,b)=>packPrice(b.d)-packPrice(a.d));
  const B=TN().map(t=>({t,d:TEAMS[t]||{}})).sort((a,b)=>scoreOf(b.d)-scoreOf(a.d));
  const row=(x,i,v,x2)=>`<div class="rk ${i===0?'top':''}" style="animation-delay:${i*.07}s">
    <span class="no">${i+1}</span><span class="t">${x.t}</span>
    <span class="x">${x2||''}</span><span class="v">${v}</span></div>`;
  return `<h1>🏆 두 개의 가격표</h1>
   <div class="sub">같은 여덟 개를 두 번 계산했습니다. 순위가 뒤집혔는지 보세요.</div>
   <div class="two" style="margin-top:8px">
     <div class="col"><h3>🏙️ 도시 가격 <small>섬에 가져간 짐의 값</small></h3>
       <div class="list">${A.map((x,i)=>row(x,i,won(packPrice(x.d)))).join('')}</div></div>
     <div class="col"><h3>🏝️ 생존 점수 <small>4일 동안 살아낸 결과</small></h3>
       <div class="list">${B.map((x,i)=>row(x,i,scoreOf(x.d)+'점',
         `조원 ${hpOf(x.d)}/3`)).join('')}</div></div>
   </div>`;
}
function sBoard(){
  return `<h1>✍️ 오늘 배운 것</h1>
   <div class="board" style="margin-top:14px">${window.BOARD.map((b,i)=>
     `<div class="li" style="animation-delay:${i*.18}s"><b class="k">${b.k}</b><div class="v">${b.v}</div></div>`).join('')}
   </div>
   <div class="sub" style="margin-top:6px">마지막 질문 — <b style="color:var(--gold)">“다시 싼다면, 8칸에 뭘 넣을래?”</b></div>`;
}
function sStore(){
  const T=window.STORE;
  return `<div class="store"><div style="font-size:4em">${T.em}</div>
   <h2 style="font-size:2.4em;margin:0">${T.head}</h2>
   <div style="font-size:4em">💧</div>
   <div class="p">${T.price}</div>
   <div class="l" style="margin-top:12px">${T.lines.join('<br>')}</div></div>`;
}
function sResult(){
  const rows=TN().map(t=>({t,d:TEAMS[t]||{}})).sort((a,b)=>
    (scoreOf(b.d)-scoreOf(a.d))||(retMoney(b.d)-retMoney(a.d)));
  return `<h1>🎬 최종 결과</h1>
   <div class="sub">생존 점수 순 · 같으면 들고 온 재산 순</div>
   <div class="rows" style="margin-top:8px">${rows.map((x,i)=>`
     <div class="rw ${i===0?'g':''}" style="animation-delay:${i*.09}s">
       <span class="t">${i+1}위 ${x.t}</span>
       <span class="u" style="width:300px">${inv(x.d).map(id=>`<span>${G(id).em}</span>`).join('')}</span>
       <span class="ln">조원 ${hpOf(x.d)}/3 무사 · 들고 온 재산 ${won(retMoney(x.d))}</span>
       <span class="p">${scoreOf(x.d)}점</span></div>`).join('')}</div>`;
}

/* ── 부팅 ── */
(async function boot(){try{
  const {initializeApp}=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
  const m=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
  DB=m.getFirestore(initializeApp(FIREBASE_CONFIG)); api=m; online=true;
  m.onSnapshot(m.collection(DB,'live'),snap=>{
    TEAMS={}; TRDOCS={};
    snap.forEach(d=>{const id=d.id,v=d.data();
      if(id===STATE) ST=v;
      else if(id.startsWith(TEAM)) TEAMS[id.slice(TEAM.length)]=v;
      else if(id.startsWith(TR)&&v.kind==='tr') TRDOCS[id]=v;});
    draw(); processTrades();
  },e=>{ app.innerHTML='<div style="padding:40px">읽기 오류 '+e.code+'</div>'; });
}catch(e){ draw(); }})();
setInterval(()=>{ if(ST.phase==='trade') draw(); },1000);
draw();
</script>
</body>
</html>
