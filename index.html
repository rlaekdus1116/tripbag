<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>무인도 100억</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&family=Jua&family=Gaegu:wght@400;700&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4efe4;--dim:#a89e8f;--dim2:#6d6558;--line:#3a352d;--bg:#17150f;--card:#221f18;
 --gold:#e8ab45;--green:#55b981;--red:#e8593c;--blue:#5d9fd6;--fs:1;
 --font:'Dongle','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
 font-family:var(--font);word-break:keep-all}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
#app{height:100%;display:flex;flex-direction:column;font-size:calc(16px * var(--fs))}

/* ── 상단바 ── */
.top{display:flex;align-items:center;gap:14px;padding:7px 18px;background:#0e0c07;
 border-bottom:1px solid var(--line);flex:none}
.top .tm{font-weight:700;font-size:1.05em}
.top .ph{color:var(--gold);font-size:.95em}
.top .me{font-size:.75em;color:var(--dim2)}
.top .sp{margin-left:auto;display:flex;gap:20px;align-items:baseline}
.top .lb{font-size:.7em;color:var(--dim)}
.top .vl{font-size:1.3em;font-weight:700;font-variant-numeric:tabular-nums}
.top .vl.g{color:var(--gold)} .top .vl.r{color:var(--red)}
.hp i{font-style:normal;font-size:1.1em}
.hp i.d{opacity:.22}

/* ── 공통 ── */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
 text-align:center;padding:20px;gap:7px}
.center .big{font-size:4.2em;line-height:1}
.center h2{font-size:2.2em;margin:0;font-weight:700;line-height:1.2}
.center p{font-size:1.15em;color:var(--dim);margin:0;line-height:1.5;white-space:pre-line}
.pulse{animation:pl 1.6s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes sl{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.diag{font-size:.72em;color:#514b3f;text-align:center;padding:2px}

/* ── 입장 ── */
.gate{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:16px}
.gate h1{font-size:2.6em;margin:0;font-weight:700}
.gate p{color:var(--dim);margin:0;font-size:1.05em}
.gate input{width:340px;padding:11px;border:2px solid var(--line);border-radius:14px;background:#221f18;
 color:var(--ink);text-align:center;font-weight:700;font-size:1.4em}
.gate input:focus{outline:none;border-color:var(--gold)}
.teams{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;width:min(740px,94vw)}
.teams button{padding:13px 0;border:2px solid var(--line);border-radius:13px;background:#221f18;
 font-weight:700;font-size:1.2em}
.teams button.on{background:var(--gold);color:#17150f;border-color:var(--gold)}
.err{color:var(--red);font-size:1em;min-height:20px}
.go{padding:11px 44px;border-radius:14px;background:var(--gold);color:#17150f;font-weight:700;font-size:1.4em}

/* ── 로또 ── */
.lotto{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
 background:radial-gradient(circle at 50% 35%,#3a2c10,#17150f 65%)}
.lotto .t{font-size:1.4em;color:var(--gold);letter-spacing:.18em}
.lotto .n{font-size:5.6em;font-weight:700;line-height:1;color:var(--gold);
 text-shadow:0 0 40px rgba(232,171,69,.45);animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.lotto .s{font-size:1.3em;color:var(--dim);margin-top:6px}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.conf i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

/* ── 짐싸기 ── */
.pack{flex:1;display:grid;grid-template-columns:1fr 300px;min-height:0}
.shelf{padding:8px 12px;overflow:auto;min-height:0}
.gg{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.gd{background:var(--card);border:2px solid var(--line);border-radius:13px;padding:7px 5px;text-align:center;
 display:flex;flex-direction:column;align-items:center;gap:0;transition:transform .08s}
.gd:active{transform:scale(.96)}
.gd .e{font-size:1.9em;line-height:1.05}
.gd .n{font-size:1.05em;font-weight:700;line-height:1.15}
.gd .s{font-size:.75em;color:var(--dim2);line-height:1.1}
.gd .p{font-size:1.15em;color:var(--gold);font-weight:700;margin-top:1px}
.gd.on{border-color:var(--gold);background:#332a15}
.gd.on .p{color:#ffd489}
.gd.full{opacity:.35}
.cart{background:#1c1a13;border-left:1px solid var(--line);padding:10px 13px;display:flex;
 flex-direction:column;min-height:0}
.cart h3{margin:0;font-size:1.25em;font-weight:700}
.cart .note{font-size:.88em;color:var(--dim);margin-bottom:6px;line-height:1.35}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.sl{height:64px;border:2px dashed #3f3a31;border-radius:11px;display:flex;flex-direction:column;
 align-items:center;justify-content:center;font-size:.9em;color:#4e483c;line-height:1.02;
 overflow:hidden;padding:2px 3px;text-align:center}
.sl.on{border-style:solid;border-color:var(--gold);background:#2b2416;color:var(--ink)}
.sl .e{font-size:1.5em;line-height:1}
.sl .n{font-size:.86em;font-weight:700;max-width:100%;overflow:hidden;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.tot{margin-top:auto;border-top:1px solid var(--line);padding-top:7px;font-size:1em}
.tot .r{display:flex;justify-content:space-between;padding:2px 0}
.tot .r b{color:var(--gold);font-size:1.25em;font-variant-numeric:tabular-nums}
.lock{margin-top:8px;padding:13px;border-radius:14px;background:var(--gold);color:#17150f;
 font-weight:700;font-size:1.3em;width:100%}
.lock.off{background:#2d2820;color:#5f5849}
.lock.done{background:#1d3a2a;color:#a5e2c0;border:2px solid var(--green)}
.who{font-size:.8em;color:var(--dim2);text-align:center;margin-top:3px;min-height:14px}

/* ── 사건 ── */
.evw{flex:1;display:grid;grid-template-columns:1.15fr 1fr;min-height:0}
.evl{padding:14px 22px;border-right:1px solid var(--line);display:flex;flex-direction:column;
 justify-content:center;gap:5px;min-height:0}
.evl .when{font-size:.95em;color:var(--gold);letter-spacing:.1em}
.evl .em{font-size:3.2em;line-height:1}
.evl h2{font-size:2.1em;margin:0;font-weight:700;line-height:1.2}
.evl .ds{font-size:1.15em;color:var(--dim);white-space:pre-line;line-height:1.45}
.evr{padding:11px 15px;display:flex;flex-direction:column;min-height:0;background:#1c1a13}
.evr .ask{font-size:1.25em;font-weight:700;margin-bottom:2px}
.evr .cap{font-size:.85em;color:var(--dim);margin-bottom:6px}
.inv{display:grid;grid-template-columns:1fr 1fr;gap:6px;overflow:auto;min-height:0;flex:1;align-content:start}
.iv{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center}
.iv .e{font-size:1.6em;line-height:1.05}
.iv .n{font-size:1.02em;font-weight:700;line-height:1.1}
.iv.on{border-color:var(--gold);background:#332a15}
.iv.gone{opacity:.3;text-decoration:line-through}
.sub{margin-top:7px;padding:12px;border-radius:13px;background:var(--gold);color:#17150f;
 font-weight:700;font-size:1.25em;width:100%}
.sub.off{background:#2d2820;color:#5f5849}
.sub.done{background:#1d3a2a;color:#a5e2c0;border:2px solid var(--green)}
.pass{margin-top:5px;font-size:.95em;color:var(--dim);text-decoration:underline}

/* ── 결과 ── */
.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
 text-align:center;padding:22px;gap:8px}
.res .pt{font-size:4.6em;font-weight:700;line-height:1;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.res .pt.p{color:var(--green)} .res .pt.m{color:var(--red)}
.res .ln{font-size:1.5em;line-height:1.45;max-width:760px;animation:sl .5s .15s both}
.res .used{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.res .used span{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:4px 11px;font-size:1.05em}
.shake{animation:sk .45s}
@keyframes sk{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}
 60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}

/* ── 거래 ── */
.trw{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;min-height:0}
.trc{padding:9px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.trc:last-child{border:none;background:#1c1a13}
.trc h3{margin:0 0 3px;font-size:1.2em;font-weight:700}
.trc .cap{font-size:.82em;color:var(--dim);margin-bottom:5px;line-height:1.3}
.scroll{overflow:auto;min-height:0;flex:1}
.tteams{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:6px}
.tteams button{padding:8px 0;border:2px solid var(--line);border-radius:10px;background:#221f18;
 font-weight:700;font-size:1.05em}
.tteams button.on{background:var(--gold);color:#17150f;border-color:var(--gold)}
.tteams button:disabled{opacity:.25}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.mn{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:4px 3px;text-align:center;font-size:.98em}
.mn .e{font-size:1.35em;line-height:1.05}
.mn.on{border-color:var(--gold);background:#332a15}
.prop{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px;font-size:1em}
.prop b{color:var(--gold)}
.prop .btns{display:flex;gap:6px;margin-top:5px}
.prop .btns button{flex:1;padding:7px 0;border-radius:9px;font-weight:700;font-size:1em}
.prop .btns .y{background:var(--green);color:#0d1f16}
.prop .btns .n{background:#2d2820;color:var(--dim)}
.send2{margin-top:7px;padding:11px;border-radius:12px;background:var(--gold);color:#17150f;
 font-weight:700;font-size:1.2em;width:100%}
.send2.off{background:#2d2820;color:#5f5849}
.tmr{font-size:2.6em;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;text-align:center;line-height:1}
.tmr.hot{color:var(--red);animation:tk .5s infinite}
@keyframes tk{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ── 최종 ── */
.fin{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.fin .l{padding:16px 22px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:3px}
.fin .r{padding:14px 20px;overflow:auto}
.sc{font-size:5em;font-weight:700;text-align:center;line-height:1}
.sc small{font-size:.28em;color:var(--dim)}
.br{display:flex;justify-content:space-between;font-size:1.05em;padding:4px 0;border-bottom:1px solid var(--line)}
.br:last-child{border:none}
.br b.p{color:var(--green)} .br b.m{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.chips span{background:#221f18;border:1px solid var(--line);border-radius:10px;padding:4px 9px;font-size:1em}
</style>
</head>
<body>
<div id="app"></div>

<!-- ▼ 수업 내용 ▼ -->
<script>
/* ===================================================================
   무인도 100억 — 내용 파일
   로또 당첨 → 짐싸기 8칸 → 추락 → 4일 생존 → 구조
   값·문구를 고치려면 여기만 보시면 됩니다.
   =================================================================== */

/* 폰트 — 'Dongle' 동글 / 'Jua' 주아 / 'Gaegu' 개구 / 'Do Hyeon' 도현 */
window.FONT = 'Dongle';
window.FONT_SCALE = 1.42;   // 동글은 글자가 작아서 키웁니다. 주아로 바꾸면 1 로.

window.CFG = {
  teams: 8,
  slots: 8,           // 캐리어 칸수
  prize: 10000000000, // 로또 1등 100억
  tradeSeconds: 180,  // 물물교환 3분
  hp: 3               // 조원 체력 (0 되면 탈진)
};

/* ─────────────────────────────────────────────
   짐 후보 20개  (도시 가격 비싼 순으로 자동 정렬됩니다)
   price : 도시 가격(원)
   kind  : lux 사치 / trip 여행 / life 생필
   ───────────────────────────────────────────── */
window.GOODS = [
 { id:'cash',  em:'💵', name:'현금 다발',    sub:'100억 원',      price:10000000000, kind:'lux'  },
 { id:'ring',  em:'💍', name:'다이아몬드 반지', sub:'3캐럿',       price:300000000,   kind:'lux'  },
 { id:'neck',  em:'📿', name:'금목걸이',      sub:'24K 100g',      price:50000000,    kind:'lux'  },
 { id:'watch', em:'⌚', name:'명품 시계',     sub:'스위스제',       price:30000000,    kind:'lux'  },
 { id:'coat',  em:'🧥', name:'명품 코트',     sub:'캐시미어 100%',  price:8000000,     kind:'lux'  },
 { id:'cam',   em:'📷', name:'미러리스 카메라', sub:'여행 브이로그용', price:1500000,    kind:'trip' },
 { id:'perf',  em:'🌸', name:'향수',         sub:'100ml',          price:300000,      kind:'lux'  },
 { id:'spk',   em:'🔊', name:'블루투스 스피커', sub:'방수·최대출력 큼', price:200000,   kind:'trip' },
 { id:'shoe',  em:'👟', name:'에어포스 운동화', sub:'한정판',        price:150000,      kind:'lux'  },
 { id:'rod',   em:'🎣', name:'낚싯대',       sub:'미끼 포함',       price:80000,       kind:'life' },
 { id:'swim',  em:'🩳', name:'수영복',       sub:'하와이 필수템',    price:50000,       kind:'trip' },
 { id:'knife', em:'🔪', name:'맥가이버칼',    sub:'12가지 기능',     price:50000,       kind:'life' },
 { id:'aid',   em:'🧰', name:'구급함',       sub:'소독약·붕대',     price:40000,       kind:'life' },
 { id:'blank', em:'🧣', name:'담요',         sub:'두꺼운 것',       price:30000,       kind:'life' },
 { id:'tube',  em:'🛟', name:'튜브',         sub:'대형',           price:30000,       kind:'trip' },
 { id:'umb',   em:'☂️', name:'우산',         sub:'장우산',          price:20000,       kind:'life' },
 { id:'noodle',em:'🍜', name:'라면 20개',    sub:'한 박스',         price:20000,       kind:'life' },
 { id:'mirror',em:'🪞', name:'손거울',       sub:'접이식',          price:10000,       kind:'life' },
 { id:'water', em:'💧', name:'생수 6병',     sub:'2L × 6',         price:6000,        kind:'life' },
 { id:'fire',  em:'🔥', name:'라이터',       sub:'편의점 것',       price:1000,        kind:'life' }
];

/* ─────────────────────────────────────────────
   사건 8개 (4일)
   solves : 위에서부터 best 매칭. need 가 고른 물건에 포함되면 성립
   pick   : 학생이 고를 수 있는 개수 (기본 2)
   ───────────────────────────────────────────── */
window.EVENTS = [
 { id:'e1', day:1, when:'첫째 날 · 밤', em:'🌑',
   title:'이가 딱딱 부딪힌다',
   desc:'낮에 그렇게 뜨겁던 모래가 해가 지자 얼음장이 됐다.\n바람을 막을 게 아무것도 없다.',
   ask:'이 밤을 뭘로 버틸까?',
   solves:[
     {need:['fire','coat'], pts:3, line:'800만원짜리 코트를 찢어 불을 붙였다. 인생에서 제일 따뜻한 800만원이었다.'},
     {need:['fire','cash'], pts:3, line:'100억을 한 장씩 태웠다. 잘 탄다. 아주 잘 탄다.'},
     {need:['blank'],       pts:3, line:'담요 하나를 셋이 억지로 나눠 덮었다. 그래도 잤다.'},
     {need:['fire'],        pts:2, line:'떠내려온 나뭇가지를 모아 불을 피웠다. 셋이 불 앞에 붙어 앉았다.'},
     {need:['perf'],        pts:2, line:'향수를 뿌리고 불씨를 붙였다. 알코올이라 확 붙었다. 30만원이 5분 탔다.'},
     {need:['coat'],        pts:1, line:'코트를 셋이 덮었다. 발이 나온다. 없는 것보단 낫다.'}
   ],
   fail:{pts:-3, down:1, line:'아무것도 없었다. 셋이 끌어안고 덜덜 떨다 새벽을 맞았다.'} },

 { id:'e2', day:2, when:'둘째 날 · 낮', em:'💧',
   title:'목이 탄다',
   desc:'어제부터 한 모금도 못 마셨다. 눈앞이 노랗다.\n바닷물은 마실수록 더 목이 마르다.',
   ask:'물을 어떻게 구할까?',
   solves:[
     {need:['water'],  pts:4, line:'뚜껑을 열자마자 셋이 돌려 마셨다. 6,000원짜리가 이렇게 맛있을 줄 몰랐다.'},
     {need:['umb'],    pts:3, line:'우산을 뒤집어 밤새 빗물을 받았다. 반 컵쯤 고였다. 나눠 마셨다.'},
     {need:['tube'],   pts:2, line:'튜브를 펴서 빗물을 받았다. 고무 맛이 나지만 마셨다.'},
     {need:['knife'],  pts:2, line:'칼로 야자열매를 쪼갰다. 안에 물이 있었다. 셋이 소리를 질렀다.'}
   ],
   fail:{pts:-5, down:1, line:'결국 바닷물을 마셨다. 30분 뒤 다 토했다. 한 명이 모래밭에 쓰러졌다.'} },

 { id:'e3', day:3, when:'셋째 날 · 아침', em:'🩸',
   title:'발을 산호에 베였다',
   desc:'물을 뜨러 가다 미끄러졌다. 발바닥이 길게 갈라졌다.\n모래가 들어갔고, 벌써 붓기 시작한다.',
   ask:'상처를 어떻게 할까?',
   solves:[
     {need:['aid'],    pts:4, line:'소독약을 붓고 붕대를 감았다. 저녁이 되자 부기가 빠졌다.'},
     {need:['shoe'],   pts:3, line:'운동화를 신고 있었다. 애초에 아무도 안 다쳤다. 15만원이 오늘의 MVP.'},

    const id=b.dataset.i;
    if(S.pick.includes(id)) S.pick=S.pick.filter(x=>x!==id);
    else { if(S.pick.length>=lim) S.pick=e.pickOne?[id]:[S.pick[S.pick.length-1],id]; else S.pick.push(id); }
    snd('tap'); render(true);});
  $('#sb').onclick=()=>{ if(!S.pick.length) return; snd('send');
    const a={...(me.ans||{})}; a[e.id]=[...S.pick];
    const o={ans:a}; if(e.pickOne) o.ret=S.pick[0];
    me.ans=a; put(o); S.pick=[]; render(true);};
  const ps=$('#ps'); if(ps) ps.onclick=()=>{ snd('lose');
    const a={...(me.ans||{})}; a[e.id]=[]; me.ans=a; put({ans:a}); S.pick=[]; render(true);};
}
let lastRes='';
function evResult(e,r,ans){
  if(e.pickOne){
    const g=G(me.ret);
    shell(`<div class="res"><div class="big" style="font-size:3.4em">🚁</div>
      <h2 style="font-size:2em;margin:0">헬기에 실은 것</h2>
      <div style="font-size:3.4em;line-height:1.05">${g.em}</div>
      <div style="font-size:1.9em;font-weight:700">${g.name}</div>
      <div class="pt p" style="font-size:3em">${won(g.price)}</div>
      <div class="ln">집에 가지고 돌아온 재산이다.</div></div>`);
    return;
  }
  const plus=r.p>=0;
  shell(`<div class="res ${plus?'':'shake'}">
    <div class="used">${(ans||[]).map(id=>`<span>${G(id).em} ${G(id).name}</span>`).join('')||'<span style="color:var(--dim)">아무것도 안 씀</span>'}</div>
    <div class="pt ${plus?'p':'m'}">${plus?'+':''}${r.p}</div>
    <div class="ln">${r.line}</div>
    ${r.down?`<div style="color:var(--red);font-size:1.3em">🧍 조원 한 명이 쓰러졌다</div>`:''}
    ${r.lost?`<div style="color:var(--red);font-size:1.3em">📦 ${G(r.lost).name} 을(를) 잃었다</div>`:''}
  </div>`);
  const key=e.id+r.p; if(key!==lastRes){ lastRes=key; snd(plus&&r.p>0?'win':'lose'); }
}

/* ── 물물교환 ── */
function tradeView(){
  const left=Math.max(0,Math.ceil(((ST.tradeEnd||0)-Date.now())/1000));
  const others=Object.keys(TEAMS).filter(t=>t!==S.team).sort();
  const tgt=TEAMS[S.target]||null;
  const mine=inv(me);
  const pend=Object.values(TRS).filter(x=>x.to===S.team&&x.st==='wait');
  const sentP=Object.values(TRS).filter(x=>x.from===S.team&&x.st==='wait');
  shell(`<div class="trw">
    <div class="trc"><h3>🎒 우리가 줄 것</h3>
      <div class="cap">주고 싶은 걸 고르세요</div>
      <div class="scroll"><div class="mini">${mine.map(id=>{const g=G(id);
        return `<button class="mn ${S.toGive.includes(id)?'on':''}" data-give="${id}">
          <div class="e">${g.em}</div>${g.name}</button>`;}).join('')||'<div style="color:var(--dim)">없음</div>'}</div></div>
    </div>
    <div class="trc"><div class="tmr ${left<=30?'hot':''}">${left}</div>
      <h3 style="margin-top:4px">🤝 누구랑?</h3>
      <div class="tteams">${others.map(t=>`<button data-t2="${t}" class="${S.target===t?'on':''}">${t.replace('조','')}</button>`).join('')}</div>
      <div class="cap">${S.target?S.target+' 이(가) 가진 것 · 받고 싶은 걸 고르세요':'조를 먼저 고르세요'}</div>
      <div class="scroll"><div class="mini">${tgt?inv(tgt).map(id=>{const g=G(id);
        return `<button class="mn ${S.toTake.includes(id)?'on':''}" data-take="${id}">
          <div class="e">${g.em}</div>${g.name}</button>`;}).join('')||'<div style="color:var(--dim)">없음</div>':''}</div></div>
      <button class="send2 ${(S.target&&S.toGive.length&&S.toTake.length)?'':'off'}" id="sp">제안 보내기</button>
    </div>
    <div class="trc"><h3>📬 받은 제안</h3>
      <div class="scroll">
      ${pend.map(x=>`<div class="prop"><b>${x.from}</b> 의 제안<br>
        준다 ${x.give.map(i=>G(i).em+G(i).name).join(', ')}<br>
        받는다 ${x.take.map(i=>G(i).em+G(i).name).join(', ')}
        <div class="btns"><button class="y" data-ok="${x._id}">수락</button>
        <button class="n" data-no="${x._id}">거절</button></div></div>`).join('')
        ||'<div style="color:var(--dim);font-size:.95em">아직 없어요</div>'}
      ${sentP.length?`<div class="cap" style="margin-top:8px">보낸 제안 ${sentP.length}건 · 답을 기다리는 중</div>`:''}
      </div>
      <div class="cap" style="margin-top:6px">먼저 <b>말로</b> 합의하고,<br>합의된 걸 화면에 옮기세요.</div>
    </div></div>`);
  document.querySelectorAll('[data-give]').forEach(b=>b.onclick=()=>{const id=b.dataset.give;
    S.toGive=S.toGive.includes(id)?S.toGive.filter(x=>x!==id):[...S.toGive,id];snd('tap');render(true);});
  document.querySelectorAll('[data-take]').forEach(b=>b.onclick=()=>{const id=b.dataset.take;
    S.toTake=S.toTake.includes(id)?S.toTake.filter(x=>x!==id):[...S.toTake,id];snd('tap');render(true);});
  document.querySelectorAll('[data-t2]').forEach(b=>b.onclick=()=>{S.target=b.dataset.t2;S.toTake=[];snd('tap');render(true);});
  $('#sp').onclick=async()=>{ if(!(S.target&&S.toGive.length&&S.toTake.length))return; snd('send');
    const id=TR+Date.now()+'_'+Math.floor(Math.random()*900+100);
    try{ await api.setDoc(api.doc(DB,'live',id),
      {kind:'tr',from:S.team,to:S.target,give:[...S.toGive],take:[...S.toTake],st:'wait',at:Date.now()}); }catch(e){}
    S.toGive=[];S.toTake=[];render(true);};
  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{ snd('coin');
    try{ await api.setDoc(api.doc(DB,'live',b.dataset.ok),{st:'ok'},{merge:true}); }catch(e){}});
  document.querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{ snd('lose');
    try{ await api.setDoc(api.doc(DB,'live',b.dataset.no),{st:'no'},{merge:true}); }catch(e){}});
}
setInterval(()=>{ if(ST.phase==='trade') render(true); },1000);

/* ── 편의점 ── */
function storeView(){
  const T=window.STORE;
  shell(`<div class="center" style="background:radial-gradient(circle at 50% 40%,#1e2a2e,#17150f 70%)">
    <div class="big">${T.em}</div><h2>${T.head}</h2>
    <div style="font-size:3.2em">💧</div>
    <div style="font-size:3.4em;font-weight:700;color:var(--gold);line-height:1">${T.price}</div>
    <p style="margin-top:10px">${T.lines.join('\n')}</p></div>`);
}

/* ── 최종 ── */
function resultView(){
  const s=scoreOf(me), rows=EV.filter(e=>!e.pickOne).map(e=>{
    const r=(me.res||{})[e.id]; if(!r) return '';
    return `<div class="br"><span>${e.em} ${e.title}</span><b class="${r.p>=0?'p':'m'}">${r.p>=0?'+':''}${r.p}</b></div>`;}).join('');
  const alive=hpOf(me);
  shell(`<div class="fin">
    <div class="l">
      <div class="sc">${s}<small>점</small></div>
      <div style="text-align:center;color:var(--dim);font-size:1.1em">4일 생존 점수</div>
      <div style="text-align:center;margin-top:10px;font-size:1.2em">
        조원 ${[0,1,2].map(i=>i<alive?'🧍':'🪦').join('')} ${alive}/3 무사</div>
      <div style="text-align:center;margin-top:8px;font-size:1.15em;color:var(--gold)">
        들고 온 재산 ${won(retMoney(me))}</div>
      <div style="text-align:center;margin-top:2px;font-size:.95em;color:var(--dim2)">
        (섬에 가져갔던 짐의 값 ${won(packPrice(me))})</div>
    </div>
    <div class="r">
      <div style="font-size:1.15em;font-weight:700;margin-bottom:4px">사건별 점수</div>${rows}
      <div style="font-size:1.05em;margin-top:10px;color:var(--dim)">끝까지 남은 짐</div>
      <div class="chips">${inv(me).map(id=>`<span>${G(id).em} ${G(id).name}</span>`).join('')||'<span>없음</span>'}</div>
    </div></div>`);
}

/* ── 부팅 ── */
(async function boot(){try{
  const {initializeApp}=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
  const m=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
  DB=m.getFirestore(initializeApp(FIREBASE_CONFIG)); api=m; online=true;
  m.onSnapshot(m.collection(DB,'live'),snap=>{
    TEAMS={}; TRS={};
    snap.forEach(d=>{ const id=d.id, v=d.data();
      if(id===STATE) ST=v;
      else if(id.startsWith(TEAM)) TEAMS[id.slice(TEAM.length)]=v;
      else if(id.startsWith(TR)&&v.kind==='tr'&&!v.done&&v.st==='wait') TRS[id]={...v,_id:id};
    });
    me=TEAMS[S.team]||{};
    render();
  },e=>{DIAG='읽기 오류: '+e.code;render(true);});
}catch(e){ DIAG='연결 실패'; render(true); }})();
render(true);
</script>
</body>
</html>
