<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>우리 조 장바구니</title>
<style>
:root{--ink:#1c1b19;--sub:#77716a;--line:#e6e1d8;--bg:#f6f4ef;--card:#fff;
 --accent:#c2410c;--soft:#fdefe8;--blue:#20618f;--blue-soft:#eaf3fa;
 --green:#2f7048;--green-soft:#eaf4ee;--red:#a4342a;--gold:#8a6a1c;--gold-soft:#fbf4e2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;letter-spacing:-0.02em;
 font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;overscroll-behavior-y:contain}
#app{max-width:560px;margin:0 auto;padding-bottom:40px;min-height:100vh}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;font-size:16px}

/* 예산 헤더 */
.money{position:sticky;top:0;z-index:30;background:#26241f;color:#f3eee4;padding:14px 16px 12px}
.money .top{display:flex;align-items:center;gap:8px}
.money .team{font-size:12.5px;color:#a9a094;font-weight:700}
.money .mbtn{margin-left:auto;font-size:11.5px;font-weight:800;color:#ffd9a8;
 border:1px solid #4a443b;border-radius:999px;padding:4px 10px}
.money .amt{font-size:32px;font-weight:800;letter-spacing:-0.045em;margin:4px 0 8px}
.money .amt.over{color:#ff8c6b}
.money .amt span{font-size:15px;font-weight:700}
.money .amt .of{font-size:13px;color:#8b8377;font-weight:600}
.money .tk{height:7px;background:#413c34;border-radius:99px;overflow:hidden}
.money .fl{height:100%;background:#e8a34a;border-radius:99px;transition:width .5s}
.money .fl.over{background:#e0503a}
.money .warn{font-size:12.5px;color:#c9c0b2;margin-top:8px;font-weight:700}
.money .warn b{color:#ffd9a8}
.money .warn.bad b,.money .warn.bad{color:#ffb08e}

/* 미션 */
.mission{padding:26px 20px 20px}
.mission h1{font-size:24px;margin:0 0 6px;letter-spacing:-0.04em;text-align:center}
.mission .lead{text-align:center;color:var(--sub);font-size:14px;margin:0 0 22px}
.mrow{display:grid;grid-template-columns:30px 1fr;gap:6px 12px;align-items:start;
 background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:10px}
.mrow .em{font-size:22px;grid-row:span 2}
.mrow .t{font-weight:800;font-size:15.5px;letter-spacing:-0.03em}
.mrow .d{font-size:13.5px;color:#5c564d;line-height:1.65}
.mrow.hi{background:var(--soft);border-color:#f3d7c6}

/* 하단 제출 바 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.97);
 backdrop-filter:blur(8px);border-top:1px solid var(--line);
 padding:11px 14px calc(11px + env(safe-area-inset-bottom))}
.dock .in{max-width:560px;margin:0 auto}
.dock .btn{margin:0}
.dock .note{text-align:center;font-size:12px;color:var(--sub);margin-top:7px}
.btn.ok{background:var(--green)}
.done{margin:0 14px 10px;background:var(--green-soft);border:1px solid #cee2d6;color:#25563a;
 border-radius:14px;padding:14px 16px;font-weight:700;font-size:14px;text-align:center}

/* 칸 목록 */
.slots{padding:12px 14px}
.slot{display:grid;grid-template-columns:34px 1fr auto;gap:3px 11px;align-items:center;
 background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:9px;
 width:100%;text-align:left}
.slot:active{border-color:var(--accent)}
.slot.empty{border-style:dashed;background:#fbfaf7}
.slot:disabled{opacity:.5}
.slot.mine{border-color:#e2c8b6}
.slot .em{font-size:23px;grid-row:span 2}
.slot .k{font-size:12px;color:var(--sub);font-weight:700}
.slot .v{font-weight:800;font-size:16px;letter-spacing:-0.03em}
.slot .v.none{color:#b9b1a6;font-weight:700}
.slot .p{font-weight:800;font-size:15.5px;text-align:right;grid-row:span 2}
.slot .by{font-size:11.5px;color:var(--sub);grid-column:2/4}
.slot .by b{color:var(--accent)}

/* 시트 */
.modal{position:fixed;inset:0;z-index:150;background:rgba(20,19,17,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;
 padding:20px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;
 animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 3px;font-size:20px;letter-spacing:-0.03em}
.sheet .cap{color:var(--sub);font-size:13.5px;margin:0 0 15px}
.opt{width:100%;text-align:left;border:1.5px solid var(--line);border-radius:15px;padding:14px;
 margin-bottom:9px;background:#fff;display:block}
.opt:active{border-color:var(--accent);background:var(--soft)}
.opt.on{border-color:var(--accent);background:var(--soft)}
.opt .r1{display:flex;align-items:baseline;gap:8px}
.opt .nm{font-weight:800;font-size:16px;letter-spacing:-0.03em}
.opt .pr{margin-left:auto;font-weight:800;font-size:17px;white-space:nowrap}
.opt .ex{font-size:11.5px;color:var(--accent);font-weight:700}
.opt .ds{font-size:13px;color:#5c564d;margin-top:4px}
.opt .ar{font-size:12.5px;color:var(--blue);font-weight:700;margin-top:4px}
.opt .ar.late{color:var(--red)}
.opt .after{font-size:12.5px;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);
 color:var(--sub);font-weight:700}
.opt .after b{color:var(--ink)}
.opt .after b.bad{color:var(--red)}
.opt.sale{border-color:var(--gold);background:var(--gold-soft)}
.opt .tag{background:var(--gold);color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px}

.btn{display:block;width:100%;padding:14px;border-radius:13px;background:var(--accent);color:#fff;
 font-weight:800;font-size:16px;margin-top:10px}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.gray{background:#efeae1;color:#5c564d}
.btn:disabled{background:#d9d4ca}

/* 배너 */
.banner{margin:0 14px 10px;border-radius:14px;padding:13px 15px;font-size:14px;font-weight:700}
.banner.ask{background:var(--blue-soft);border:1px solid #cfe0ee;color:#1a4f76}
.banner.ask .row{display:flex;gap:7px;margin-top:9px}
.banner.ask .row button{flex:1;padding:9px;border-radius:10px;font-weight:800;font-size:14px}
.banner.ask .yes{background:var(--blue);color:#fff}
.banner.ask .no{background:#fff;border:1px solid #cfe0ee;color:#1a4f76}
.banner.wait{background:#f2eee6;color:#6b655d}
.banner.ev{background:#26241f;color:#ffd9a8;animation:pop .4s}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}

/* 게이트 */
.gate{padding:56px 22px 30px;text-align:center}
.gate .logo{font-size:46px}
.gate h1{font-size:25px;margin:10px 0 4px;letter-spacing:-0.04em}
.gate p{color:var(--sub);font-size:14px;margin:0 0 24px}
.gate input{width:100%;padding:14px;border:2px solid var(--line);border-radius:13px;text-align:center;font-weight:700}
.gate input:focus{outline:none;border-color:var(--accent)}
.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.teams button{padding:13px 0;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-weight:800}
.teams button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.err{color:var(--accent);font-size:13px;min-height:18px;margin-top:8px}

/* 결과 */
.res{padding:8px 14px 30px}
.res h2{font-size:22px;margin:16px 0 4px;letter-spacing:-0.04em;text-align:center}
.res .sub{text-align:center;color:var(--sub);font-size:13.5px;margin-bottom:16px}
.story{background:#26241f;color:#f0ebe1;border-radius:18px;padding:20px;margin-bottom:14px}
.story .d{font-size:11.5px;letter-spacing:.1em;color:#a49a8c;margin:14px 0 6px;font-weight:800}
.story .d:first-child{margin-top:0}
.story p{margin:0 0 8px;font-size:15px;line-height:1.75}
.story p.good{color:#a9dcc0}
.story p.bad{color:#ffb4a0}
.story .fail{color:#ff8c6b;font-weight:800;font-size:16px}
.bg{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.bg span{background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:8px 12px;font-size:13.5px;font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 9px;font-size:15px}
.card .li{display:flex;gap:8px;font-size:13.5px;padding:4px 0;border-bottom:1px solid #f2efe9}
.card .li:last-child{border:none}
.card .li .n{margin-left:auto;font-weight:700}

/* 투표 */
.vote{padding:8px 14px 30px}
.vt{width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:15px;
 padding:14px;margin-bottom:9px}
.vt:active{border-color:var(--accent)}
.vt.on{border-color:var(--accent);background:var(--soft)}
.vt .t{font-weight:800;font-size:16px;margin-bottom:5px}
.vt .l{font-size:12.5px;color:var(--sub);line-height:1.7}
.wait2{text-align:center;padding:44px 22px;color:var(--sub)}
.wait2 .em{font-size:40px;margin-bottom:10px}
.pulse{animation:pl 1.6s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.4}50%{opacity:1}}
.fatal{padding:70px 24px;text-align:center}
.fatal h2{font-size:19px;margin:12px 0 8px}
.fatal p{color:var(--sub);font-size:14px;line-height:1.8}
.diag{font-size:11.5px;color:var(--sub);text-align:center;padding:12px;line-height:1.8}
.diag .bad{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<div id="over"></div>

<!-- ▼▼▼ 수업 내용 ▼▼▼ -->
<!-- ▼ 수업 내용 ▼ -->
<script>
/* ===================================================================
   우리 조 장바구니 — 내용 파일
   값·문구를 고치려면 여기만 보시면 됩니다.
   flags = 여행 결과 이야기를 만들 때 쓰는 표시 (학생에겐 안 보임)
   =================================================================== */
window.BUDGET = 80000;

window.SLOTS = [
{ key:'캐리어', emoji:'🧳', note:'조에 하나. 짐을 나눠 담습니다', opts:[
  { name:'형·누나 것 빌리기', price:0,     days:0, arrive:'오늘',        desc:'낡았다. 지퍼가 잘 안 잠긴다', flags:['지퍼'] },
  { name:'대여',              price:8000,  days:0, arrive:'오늘',        desc:'바퀴 하나가 뻑뻑하다',        flags:['바퀴'] },
  { name:'저가 신품',         price:29000, days:5, arrive:'5일 뒤',      desc:'무난하다',                    flags:[] },
  { name:'중형 신품',         price:45000, days:2, arrive:'2일 뒤',      desc:'크고 튼튼하다',               flags:[] }
]},
{ key:'카메라', emoji:'📷', note:'여행 사진을 남길 방법', opts:[
  { name:'폰으로만',          price:0,     days:0, arrive:'—',           desc:'배터리가 나가면 끝이다',      flags:['폰만'] },
  { name:'일회용 필름 2개',   price:18000, extra:8000, extraName:'현상비',
    days:0, arrive:'오늘 · 편의점', desc:'54장. 찍고 나서야 뭐가 나왔는지 안다', flags:['필름'] },
  { name:'즉석카메라 중고',   price:35000, days:0, arrive:'오늘 · 직거래', desc:'필름 10장 포함 · 보증 없음', flags:['즉석'] },
  { name:'즉석카메라 신품',   price:89000, days:3, arrive:'3일 뒤',      desc:'필름 40장 포함',              flags:['즉석','사치'] }
]},
{ key:'보조배터리', emoji:'🔋', note:'조원끼리 돌려 씁니다', opts:[
  { name:'안 삼',             price:0,     days:0, arrive:'—',           desc:'',                            flags:['방전'] },
  { name:'5,000mAh 한 개',    price:12000, days:2, arrive:'2일 뒤',      desc:'한 명분. 나눠 쓰기엔 모자라다', flags:['방전'] },
  { name:'10,000mAh 한 개',   price:25000, days:2, arrive:'2일 뒤',      desc:'조가 쓰기 충분하다',          flags:[] },
  { name:'10,000mAh 두 개',   price:46000, days:3, arrive:'3일 뒤',      desc:'넉넉하지만 무겁다',           flags:['짐','사치'] }
]},
{ key:'간식', emoji:'🍫', note:'밤에 먹을 것', opts:[
  { name:'최소',              price:5000,  days:0, arrive:'오늘',        desc:'세면도구 위주',               flags:['배고픔'] },
  { name:'보통',              price:12000, days:0, arrive:'오늘',        desc:'우리 조가 먹을 만큼',         flags:[] },
  { name:'넉넉히',            price:22000, days:0, arrive:'오늘',        desc:'조금 나눠줄 수 있다',         flags:['나눔'] },
  { name:'다른 조까지 돌릴 만큼', price:38000, days:0, arrive:'오늘',    desc:'',                            flags:['파티','사치'] }
]},
{ key:'밤에 할 것', emoji:'🎲', note:'소등 후 두 시간', opts:[
  { name:'없음',              price:0,     days:0, arrive:'—',           desc:'',                            flags:['심심'] },
  { name:'카드 한 벌',        price:3000,  days:0, arrive:'오늘',        desc:'가볍다',                      flags:['놀이'] },
  { name:'보드게임 중고',     price:15000, days:0, arrive:'오늘 · 직거래', desc:'부피가 크다',               flags:['놀이','짐'] },
  { name:'보드게임 신품 2종', price:42000, days:3, arrive:'3일 뒤',      desc:'부피가 크다',                 flags:['놀이','짐','사치'] }
]},
{ key:'비상 세트', emoji:'🧴', note:'다치거나 아플 때', opts:[
  { name:'없음',              price:0,     days:0, arrive:'—',           desc:'',                            flags:['무방비'] },
  { name:'밴드만',            price:3000,  days:0, arrive:'오늘',        desc:'약은 없다',                   flags:['무방비'] },
  { name:'밴드 + 멀미약 + 두통약', price:9000, days:0, arrive:'오늘',    desc:'',                            flags:['준비됨'] },
  { name:'종합 구급함',       price:25000, days:2, arrive:'2일 뒤',      desc:'크고 무겁다',                 flags:['준비됨','짐'] }
]}
];

/* 이벤트로 열리는 칸 */
window.RAIN_SLOT = { key:'우비', emoji:'☂️', note:'비 예보가 떴습니다', opts:[
  { name:'안 삼',            price:0,    days:0, arrive:'—',    desc:'', flags:['비맞음'] },
  { name:'조 우비 세트',     price:9000, days:0, arrive:'오늘 · 편의점', desc:'조원 수만큼', flags:['우비'] }
]};

/* 이벤트 */
window.EVENTS = [
 { id:'rain',  em:'🌧️', name:'일기예보 — 둘째 날 비', at:12, must:true,
   desc:'우비 칸이 열립니다', toast:'둘째 날 비 예보! ☂️ 우비 칸이 열렸습니다' },
 { id:'delay', em:'📦', name:'배송 지연 — 3일 이상 전부 아웃', at:22, must:true,
   desc:'3일 이상 걸리는 상품이 담겨 있으면 빠지고 환불됩니다', toast:'배송 지연! 3일 이상 걸리는 물건은 여행 후에 옵니다' },
 { id:'cut',   em:'✂️', name:'예산 삭감 −10,000원', at:28, must:true,
   desc:'예산이 70,000원이 됩니다', toast:'예산 삭감! 10,000원이 회수됐습니다' },
 { id:'sale',  em:'⏱️', name:'깜짝 세일 — 즉석카메라 신품 55,000원 (2분)', at:0, must:false,
   desc:'89,000 → 55,000원, 2분간', toast:'깜짝 세일! 즉석카메라 신품 55,000원 · 2분' },
 { id:'gift',  em:'💰', name:'용돈 추가 +10,000원', at:0, must:false,
   desc:'전 조 예산 +10,000원', toast:'담임 선생님이 10,000원을 보태주셨습니다' }
];

/* ─────────────────────────────────────────────────────────
   결과 이야기 — 위에서부터 순서대로 조립됩니다

   need : 이 표시가 다 있어야 나옵니다
   not  : 이 표시가 있으면 안 나옵니다
   good : 좋은 일 (초록으로 뜨고, 조원 이름이 들어갑니다)
   fx   : 화면 연출
        shake 흔들림 / rain 비 / dark 암전 / clock 시계 / photos 사진이 사라짐
        film 필름 / flash 플래시 / none 없음
   글 안에 쓸 수 있는 것
        {p:칸이름}  그 칸에 쓴 금액        예) {p:보조배터리}
        {rest}      남은 돈
        {n}         조원 이름 (좋은 일에만 넣으세요)
   ───────────────────────────────────────────────────────── */
window.STORY = [
 { day:1, need:['지퍼'],   fx:'shake',
   text:'버스에서 가방 지퍼가 터졌다. 옷을 손에 들고 다녔다.' },
 { day:1, need:['바퀴'],   fx:'shake',
   text:'바퀴 하나가 끝까지 안 굴렀다. 끌 때마다 소리가 났다.' },
 { day:1, need:['지각'],   fx:'none',
   text:'택배는 여행에서 돌아온 다음 날 도착했다. 상자를 여는데 기분이 이상했다.' },

 { day:2, need:['우비'],   fx:'rain', good:true,
   text:'오후부터 비가 왔다. {p:우비}원짜리 우비 덕에 너희 조만 멀쩡했다.' },
 { day:2, need:['비맞음'], fx:'rain',
   text:'오후부터 비가 왔다. 9,000원이 없어서 우비를 못 샀다. 세 시간을 젖은 채로 걸었다.' },
 { day:2, need:['방전','폰만'], fx:'dark',
   text:'너희 조는 배터리에 {p:보조배터리}원을 썼다. 네 시에 폰이 꺼졌다.' },
 { day:2, need:['방전','폰만'], fx:'photos',
   text:'단체사진에 너희 조만 없다. 사진이 한 장도 안 남았다.' },
 { day:2, need:['방전'], not:['폰만'], fx:'dark',
   text:'폰은 꺼졌다. 그래도 카메라가 있었다.' },
 { day:2, need:['필름'],   fx:'film', good:true,
   text:'{n}이 쉰네 장을 다 썼다. 현상하고 나서야 뭐가 찍혔는지 알았다. 그게 제일 재밌었다.' },
 { day:2, need:['즉석'],   fx:'flash', good:true,

window.BADGES = [
 { id:'thrift', em:'💸', name:'짠돌이상', desc:'남은 돈 1위' },
 { id:'rain',   em:'☂️', name:'예언자상', desc:'우비를 산 조' },
 { id:'photo',  em:'📸', name:'사진상',   desc:'사진을 남긴 조' },

 { id:'sleep',  em:'😴', name:'취침상',   desc:'밤에 할 게 없던 조' },
 { id:'broke',  em:'💀', name:'파산상',   desc:'예산 초과' }
];

/* ===================================================================
   공용 계산기 — 학생 화면과 진행판이 같은 규칙을 쓰도록 여기 모았습니다.
   (여기는 고치지 않으셔도 됩니다)
   =================================================================== */
window.TRIPLIB = {
  slotList(ST){ return ST.events && ST.events.rain ? [...window.SLOTS, window.RAIN_SLOT] : [...window.SLOTS]; },
  spentOf(c){ return Object.values((c&&c.items)||{}).reduce((a,b)=>a+(b.price||0),0); },
  flagsOf(c,ST){
    const f=[];
    this.slotList(ST).forEach(s=>{
      const it=(c.items||{})[s.key], o = it ? s.opts[it.opt] : s.opts[0];
      if(!o) return;
      (o.flags||[]).forEach(x=>f.push(x));
      if(it && s.opts[it.opt].days>=3 && !(ST.events||{}).delay) f.push('지각');
    });
    if(f.filter(x=>x==='짐').length>=2) f.push('짐2');
    const sp=this.spentOf(c);
    if(ST.budget-sp>=20000) f.push('여유');
    if(sp>ST.budget) f.push('초과');
    if((ST.events||{}).rain && !f.includes('우비')) f.push('비맞음');
    return [...new Set(f)];
  },
  storyOf(c,ST){
    const f=this.flagsOf(c,ST);
    if(f.includes('초과')) return {fail:true, lines:[]};
    const lines=window.STORY.filter(r=>
      r.need.every(n=>f.includes(n)) && !(r.not||[]).some(n=>f.includes(n)));
    return {fail:false, lines};
  },
  pickName(c){
    if(!window.USE_NAMES) return '누군가';
    const ns=[...new Set(Object.values((c&&c.items)||{})
      .map(i=>(i.by||'').split(' ')[1]).filter(Boolean))];
    if(!ns.length) return '누군가';
    let h=0; const s=(c.team||'')+ns.join('');
    for(const ch of s) h=(h*31+ch.charCodeAt(0))>>>0;
    return ns[h%ns.length];
  },
  fill(text,c,ST){
    const w=n=>Number(n).toLocaleString('ko-KR');
    return String(text)
      .replace(/\{p:([^}]+)\}/g,(_,k)=>{ const it=(c.items||{})[k.trim()]; return w(it?it.price:0); })
      .replace(/\{rest\}/g,()=>w(Math.max(0,ST.budget-this.spentOf(c))))
      .replace(/\{n\}/g,()=>this.pickName(c));
  },
  badgesOf(c,ST,all){
    const f=this.flagsOf(c,ST), out=[], B=window.BADGES, get=i=>B.find(b=>b.id===i);
    const rest=ST.budget-this.spentOf(c);
    const list=Object.values(all||{});
    const maxRest=list.length?Math.max(...list.map(x=>ST.budget-this.spentOf(x))):rest;
    if(f.includes('초과')) out.push(get('broke'));
    else if(rest===maxRest && rest>0) out.push(get('thrift'));
    if(f.includes('우비'))out.push(get('rain'));
    if(f.includes('필름')||f.includes('즉석'))out.push(get('photo'));
    if(f.includes('파티'))out.push(get('party'));
    if(f.includes('준비됨'))out.push(get('aid'));
    if(f.includes('놀이'))out.push(get('night'));
    if(f.includes('심심'))out.push(get('sleep'));
    return out.filter(Boolean);
  }
};
</script>

        ${o.desc?`<div class="ds">${o.desc}</div>`:''}
        <div class="ar ${late?'late':''}">${o.arrive}${late?' · 여행 끝나고 옴':''}</div>
        <div class="after">이걸 담으면 남은 돈 ${won(left())} → <b class="${after<0?'bad':''}">${won(after)}원</b>
          <span style="float:right;color:var(--accent)">담기 ›</span></div>
      </button>`;}).join('')}
    ${mine?`<button class="btn gray" id="rm">이 칸 비우기</button>`:''}
    <button class="btn ghost" id="cl">닫기</button></div></div>`;
  $('#cl').onclick=()=>over.innerHTML='';
  if($('#rm')) $('#rm').onclick=()=>{ clearItem(key); over.innerHTML=''; };
  document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{ setItem(s,+b.dataset.o); over.innerHTML=''; });
}

function result(){
  const st=storyOf(myCart), bg=badgesOf(myCart,CARTS);
  const sp=spent(), rest=ST.budget-sp;
  const days={1:'첫째 날',2:'둘째 날',3:'셋째 날 · 밤',4:''};
  let html='';
  if(st.fail) html=`<p class="fail">출발 전날 엄마가 결제를 취소했다.<br>너희 조는 아무것도 못 받았다.</p>`;
  else{
    let last=0;
    st.lines.forEach(r=>{
      if(r.day!==last && days[r.day]) html+=`<div class="d">${days[r.day]}</div>`;
      last=r.day;
      html+=`<p class="${r.good?'good':'bad'}">${fill(r.text,myCart)}</p>`;
    });
    if(!st.lines.length) html='<p>아무 일도 없었다. 무난한 여행이었다.</p>';
  }
  app.innerHTML=`<div class="res">
    <h2>${S.team}의 수학여행</h2>
    <div class="sub">${won(sp)}원 씀 · ${rest<0?`<b style="color:var(--red)">${won(-rest)}원 초과</b>`:won(rest)+'원 남음'}</div>
    <div class="story">${html}</div>
    ${bg.length?`<div class="bg">${bg.map(b=>`<span>${b.em} ${b.name}</span>`).join('')}</div>`:''}
    <div class="card"><h3>우리 조가 담은 것</h3>
      ${slotList().map(s=>{const it=(myCart.items||{})[s.key];
        return `<div class="li"><span>${s.emoji} ${s.key}</span>
          <span>${it?it.name:'<span style="color:#b9b1a6">안 챙김</span>'}</span>
          <span class="n">${it?won(it.price):'0'}</span></div>`;}).join('')}
    </div>
    <div class="wait2"><div class="em pulse">📝</div>
      <p>한 줄만 써서 내세요<br><b>"우리 조는 ___를 포기하고 ___를 샀다. 왜냐하면 ___"</b></p></div>
  </div>`;
}

function vote(){
  const others=Object.entries(CARTS).filter(([t])=>t!==S.team).sort();
  if(S.voted){
    app.innerHTML=`<div class="wait2"><div class="em">✅</div>
      <p><b>${S.voted}</b>에 투표했어요<br>스크린을 봐주세요</p></div>`; return;
  }
  app.innerHTML=`<div class="vote">
    <h2 style="text-align:center;font-size:21px;letter-spacing:-0.04em">나라면 이 조랑<br>같은 방 쓰고 싶다</h2>
    <p style="text-align:center;color:var(--sub);font-size:13.5px;margin-bottom:16px">한 표만 · 우리 조는 못 골라요</p>
    ${others.map(([t,c])=>`<button class="vt" data-v="${t}">
      <div class="t">${t}</div>
      <div class="l">${slotList().map(s=>{const it=(c.items||{})[s.key];
        return `${s.emoji} ${it?it.name:'없음'}`;}).join(' · ')}</div></button>`).join('')}
  </div>`;
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{
    const t=b.dataset.v; S.voted=t; localStorage.setItem('trip_voted',t);
    try{ await api.setDoc(api.doc(DB,'live',CART+t),{votes:api.increment(1)},{merge:true}); }catch(e){}
    render(true);
  });
}

/* ── 접속 ─────────────────────────────── */
render(true);
try{
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
  const m = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
  DB=m.getFirestore(initializeApp(FIREBASE_CONFIG)); api=m; online=true;
  m.onSnapshot(m.collection(DB,'live'), snap=>{
    CARTS={};
    snap.forEach(d=>{
      if(d.id===STATE){ const v=d.data();
        ST.budget=v.budget??window.BUDGET; ST.saleUntil=v.saleUntil||0;
        ST.phase=v.phase||'shop';
        const ev=v.events||{};
        const fresh=Object.keys(ev).find(k=>ev[k]&&!ST.events[k]);
        ST.events=ev;
        if(fresh && fresh!==lastEv){ lastEv=fresh;
          const e=window.EVENTS.find(x=>x.id===fresh);
          if(e){ evToast=`${e.em} ${e.toast}`; try{navigator.vibrate&&navigator.vibrate(200)}catch(_){}
                 setTimeout(()=>{evToast='';render(true);},7000); }
        }
      }
      else if(d.id.startsWith(CART)) CARTS[d.id.slice(CART.length)]=d.data();
    });
    myCart=CARTS[S.team]||{items:{}};
    render(true);
  }, err=>{ online=false; DIAG.err=String(err.message||err).slice(0,80); render(true); });
  if(S.id&&S.team) put({team:S.team});
}catch(e){ DIAG.err=String(e.message||e).slice(0,80); render(true); }
setInterval(()=>{ if(saleOn()||ST.events.sale) render(); }, 1000);
</script>
</body>
</html>
