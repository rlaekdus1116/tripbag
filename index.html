<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>100억</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&family=Jua&family=Gaegu:wght@400;700&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4efe4;--dim:#a89e8f;--dim2:#6d6558;--line:#3a352d;--bg:#17150f;--card:#221f18;
 --gold:#e8ab45;--green:#55b981;--red:#e8593c;--blue:#5d9fd6;--fs:1;
 --font:'Dongle','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
 font-family:var(--font);word-break:keep-all}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
#app{height:100%;display:flex;flex-direction:column;font-size:calc(16px * var(--fs))}

/* 상단바 */
.top{display:flex;align-items:center;gap:13px;padding:6px 14px;background:#0e0c07;
 border-bottom:1px solid var(--line);flex:none}
.top .tm{font-weight:700;font-size:1.05em}
.top .ph{color:var(--gold);font-size:.95em}
.top .me{font-size:.72em;color:var(--dim2)}
.top .sp{margin-left:auto;display:flex;gap:16px;align-items:baseline}
.top .lb{font-size:.68em;color:var(--dim)}
.top .vl{font-size:1.3em;font-weight:700;font-variant-numeric:tabular-nums}
.top .vl.g{color:var(--gold)} .top .vl.r{color:var(--red)}
.hp i{font-style:normal;font-size:1.05em}
.hp i.d{opacity:.2}
.rf{margin-left:12px;padding:5px 12px;border-radius:10px;background:#2d2820;border:1px solid #443d31;
 font-size:.95em;font-weight:700;color:var(--dim);flex:none}
.rf:active{background:var(--gold);color:#17150f}

/* 공통 */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
 text-align:center;padding:18px;gap:6px}
.center .big{font-size:4.2em;line-height:1}
.center h2{font-size:2.2em;margin:0;font-weight:700;line-height:1.2}
.center p{font-size:1.15em;color:var(--dim);margin:0;line-height:1.55;white-space:pre-line}
.center p b{color:var(--ink)}
.pulse{animation:pl 1.6s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes sl{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.diag{font-size:.7em;color:#514b3f;text-align:center;padding:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.chips span{background:#221f18;border:1px solid var(--line);border-radius:10px;padding:3px 9px;font-size:1em}

/* 입장 */
.gate{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:14px}
.gate h1{font-size:2.6em;margin:0;font-weight:700}
.gate p{color:var(--dim);margin:0;font-size:1.05em}
.gate input{width:340px;padding:11px;border:2px solid var(--line);border-radius:14px;background:#221f18;
 color:var(--ink);text-align:center;font-weight:700;font-size:1.4em}
.gate input:focus{outline:none;border-color:var(--gold)}
.teams{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;width:min(740px,94vw)}
.teams button{padding:13px 0;border:2px solid var(--line);border-radius:13px;background:#221f18;
 font-weight:700;font-size:1.2em}
.teams button.on{background:var(--gold);color:#17150f;border-color:var(--gold)}
.err{color:var(--red);font-size:1em;min-height:20px}
.go{padding:11px 44px;border-radius:14px;background:var(--gold);color:#17150f;font-weight:700;font-size:1.4em}

/* 로또 */
.lotto{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
 background:radial-gradient(circle at 50% 35%,#3a2c10,#17150f 65%)}
.lotto .t{font-size:1.35em;color:var(--gold);letter-spacing:.18em}
.lotto .n{font-size:5.4em;font-weight:700;line-height:1;color:var(--gold);
 text-shadow:0 0 40px rgba(232,171,69,.45);animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.lotto .s{font-size:1.25em;color:var(--dim);margin-top:5px}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.conf i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

/* 일등석 */
.fc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:16px;
 background:linear-gradient(160deg,#1c2430,#17150f 60%)}
.fc h2{font-size:2.1em;margin:0;font-weight:700}
.fc p{color:var(--dim);font-size:1.1em;margin:0;text-align:center;white-space:pre-line;line-height:1.5}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(880px,95vw);margin-top:6px}
.menu button{background:#20242c;border:2px solid #333b46;border-radius:15px;padding:12px 6px;
 display:flex;flex-direction:column;align-items:center;gap:1px}
.menu button .e{font-size:2.4em;line-height:1.05}
.menu button .n{font-size:1.15em;font-weight:700;line-height:1.15}
.menu button.on{border-color:var(--gold);background:#332a15}
.fcline{font-size:1.35em;color:var(--gold);min-height:1.5em;text-align:center}

/* 짐싸기 */
.pack{flex:1;display:grid;grid-template-columns:1fr 296px;min-height:0}
.shelf{padding:8px 11px;overflow:auto;min-height:0}
.gg{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.gd{background:var(--card);border:2px solid var(--line);border-radius:13px;padding:7px 5px;text-align:center;
 display:flex;flex-direction:column;align-items:center;transition:transform .08s}
.gd:active{transform:scale(.96)}
.gd .e{font-size:1.9em;line-height:1.05}
.gd .n{font-size:1.05em;font-weight:700;line-height:1.15}
.gd .s{font-size:.74em;color:var(--dim2);line-height:1.1}
.gd .p{font-size:1.15em;color:var(--gold);font-weight:700;margin-top:1px}
.gd.on{border-color:var(--gold);background:#332a15}
.gd.on .p{color:#ffd489}
.gd.full{opacity:.32}
.once{font-size:.68em;color:#c98a6a;background:#2f1f18;border-radius:6px;padding:0 5px;margin-top:1px}
.cart{background:#1c1a13;border-left:1px solid var(--line);padding:9px 12px;display:flex;
 flex-direction:column;min-height:0}
.cart h3{margin:0;font-size:1.25em;font-weight:700;display:flex;align-items:baseline}
.cart h3 .cd{margin-left:auto;color:var(--gold);font-variant-numeric:tabular-nums}
.cart h3 .cd.hot{color:var(--red);animation:tk .6s infinite}
.cart .note{font-size:.86em;color:var(--dim);margin:2px 0 6px;line-height:1.35}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.sl{height:62px;border:2px dashed #3f3a31;border-radius:11px;display:flex;flex-direction:column;
 align-items:center;justify-content:center;font-size:.9em;color:#4e483c;line-height:1.02;
 overflow:hidden;padding:2px 3px;text-align:center}
.sl.on{border-style:solid;border-color:var(--gold);background:#2b2416;color:var(--ink)}
.sl .e{font-size:1.5em;line-height:1}
.sl .n{font-size:.86em;font-weight:700;max-width:100%;overflow:hidden;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.tot{margin-top:auto;border-top:1px solid var(--line);padding-top:7px;font-size:1em}
.tot .r{display:flex;justify-content:space-between;padding:2px 0}
.tot .r b{color:var(--gold);font-size:1.25em;font-variant-numeric:tabular-nums}
.lock{margin-top:8px;padding:13px;border-radius:14px;background:var(--gold);color:#17150f;
 font-weight:700;font-size:1.3em;width:100%}
.lock.off{background:#2d2820;color:#5f5849}
.lock.done{background:#1d3a2a;color:#a5e2c0;border:2px solid var(--green)}
.who{font-size:.78em;color:var(--dim2);text-align:center;margin-top:3px;min-height:14px}

/* 환전 */
.exw{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px;min-height:0;overflow:auto}
.exw h2{font-size:2.1em;margin:0;font-weight:700}
.exr{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
 border-radius:12px;padding:5px 16px;font-size:1.25em;width:min(560px,92vw);animation:sl .35s both}
.exr .ar{margin-left:auto;color:var(--dim2)}
.exr .v{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;min-width:80px;text-align:right}
.exr.zero .v{color:#6d6558;font-weight:400;font-size:.85em}
.extot{font-size:3em;font-weight:700;color:var(--gold);margin-top:4px;line-height:1}

/* 사건 3단 */
.ev3{flex:1;display:grid;grid-template-columns:1fr 1.05fr 1.15fr;min-height:0}
.cx{padding:11px 15px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.cx:last-child{border:none;background:#1c1a13}
.cx h3{margin:0 0 3px;font-size:1.2em;font-weight:700;display:flex;align-items:baseline;gap:6px}
.cx h3 .n{margin-left:auto;font-size:.8em;color:var(--dim2);font-weight:400}
.cx .cap{font-size:.83em;color:var(--dim);margin-bottom:6px;line-height:1.3}
.scroll{overflow:auto;min-height:0;flex:1}
.evc{display:flex;flex-direction:column;justify-content:center;flex:1;gap:4px}
.evc .when{font-size:.92em;color:var(--gold);letter-spacing:.09em}
.evc .em{font-size:3em;line-height:1}
.evc h2{font-size:1.95em;margin:0;font-weight:700;line-height:1.18}
.evc .ds{font-size:1.08em;color:var(--dim);white-space:pre-line;line-height:1.45}
.evc .nd{margin-top:8px;background:#2f2416;border:1px solid #5f4c22;border-radius:12px;padding:7px 12px;
 font-size:1.05em}
.evc .nd b{color:var(--gold)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start}
.mn{background:var(--card);border:2px solid var(--line);border-radius:11px;padding:5px 3px;text-align:center;
 font-size:1em;line-height:1.1}
.mn .e{font-size:1.5em;line-height:1.05}
.mn.on{border-color:var(--gold);background:#332a15}
.mn.dim{opacity:.4}
.mn .once{font-size:.68em;color:#c98a6a;background:#2f1f18;border-radius:6px;padding:0 4px;display:inline-block}
.selbox{margin-top:7px;background:#2b2416;border:1px solid #5f4c22;border-radius:13px;padding:8px 12px;
 text-align:center;font-size:1.1em;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.selbox .lb{font-size:.78em;color:var(--gold)}
.selbox.none{background:#2d2820;border-color:#443d31}
.selbox.none .lb{color:var(--dim2)}

/* 탭 */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:7px}
.tabs button{padding:8px 0;border-radius:11px;background:#2d2820;border:2px solid transparent;
 font-weight:700;font-size:1.05em;position:relative}
.tabs button.on{background:var(--gold);color:#17150f}
.tabs button .dot{position:absolute;top:4px;right:8px;width:9px;height:9px;border-radius:50%;
 background:var(--red);animation:pl 1s infinite}

/* 경매 */
.auc{flex:1;display:flex;flex-direction:column;min-height:0}
.auclot{text-align:center;background:var(--card);border:2px solid var(--gold);border-radius:15px;
 padding:9px;animation:pop .4s}
.auclot .e{font-size:2.8em;line-height:1}
.auclot .n{font-size:1.6em;font-weight:700;line-height:1.1}
.auclot .q{font-size:.9em;color:var(--dim)}
.bidamt{font-size:3.2em;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1;
 color:var(--gold);margin:6px 0 2px}
.bidamt.zero{color:#5f5849}
.qk{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.qk button{padding:9px 0;border-radius:10px;background:#2d2820;font-weight:700;font-size:1em}
.qk button:active{background:var(--gold);color:#17150f}
.bidgo{margin-top:7px;padding:12px;border-radius:13px;background:var(--gold);color:#17150f;
 font-weight:700;font-size:1.25em;width:100%}
.bidgo.off{background:#2d2820;color:#5f5849}
.bidgo.done{background:#1d3a2a;color:#a5e2c0;border:2px solid var(--green)}
.warn{margin-top:5px;background:#2f1f18;border:1px solid #6b4230;border-radius:9px;padding:3px 8px;
 font-size:.9em;color:#e9a184}
.aucres{text-align:center;padding:12px;animation:pop .4s}
.aucres .w{font-size:2.2em;font-weight:700;color:var(--gold)}
.aucres .l{font-size:1.1em;color:var(--dim)}

/* 거래 */
.tr{flex:1;display:flex;flex-direction:column;min-height:0;gap:5px}
.tteams{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.tteams button{padding:7px 0;border:2px solid var(--line);border-radius:10px;background:#221f18;
 font-weight:700;font-size:1.02em}
.tteams button.on{background:var(--gold);color:#17150f;border-color:var(--gold)}
.cashrow{display:flex;align-items:center;gap:5px}
.cashrow button{flex:none;width:44px;padding:6px 0;border-radius:9px;background:#2d2820;font-weight:700;font-size:.98em}
.cashrow button:active{background:var(--gold);color:#17150f}
.cashrow .cv{flex:1;text-align:center;font-size:1.02em;color:var(--dim)}
.cashrow .cv b{color:var(--gold)}
.trmsg{width:100%;padding:8px 11px;border:2px solid var(--line);border-radius:11px;background:#221f18;
 color:var(--ink);font-size:1.05em}
.trmsg:focus{outline:none;border-color:var(--gold)}
.send2{padding:10px;border-radius:12px;background:var(--gold);color:#17150f;font-weight:700;
 font-size:1.15em;width:100%}
.send2.off{background:#2d2820;color:#5f5849}
.prop{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 10px;margin-bottom:5px;
 font-size:1em;animation:sl .3s}
.prop b{color:var(--gold)}
.prop .m{color:var(--ink);font-size:1.05em;margin:2px 0}
.prop .btns{display:flex;gap:5px;margin-top:4px}
.prop .btns button{flex:1;padding:6px 0;border-radius:9px;font-weight:700;font-size:1em}
.prop .btns .y{background:var(--green);color:#0d1f16}
.prop .btns .n{background:#2d2820;color:var(--dim)}

/* 결과 */
.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
 text-align:center;padding:20px;gap:7px}
.res .pt{font-size:4.4em;font-weight:700;line-height:1;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.res .pt.p{color:var(--green)} .res .pt.m{color:var(--red)}
.res .ln{font-size:1.45em;line-height:1.45;max-width:740px;animation:sl .5s .15s both}
.shake{animation:sk .45s}
@keyframes sk{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}
 60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes tk{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* 최종 */
.fin{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.fin .l{padding:15px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;
 justify-content:center;gap:3px}
.fin .r{padding:13px 18px;overflow:auto}
.sc{font-size:4.8em;font-weight:700;text-align:center;line-height:1}
.sc small{font-size:.28em;color:var(--dim)}
.br{display:flex;justify-content:space-between;font-size:1.05em;padding:4px 0;border-bottom:1px solid var(--line)}
.br:last-child{border:none}
.br b.p{color:var(--green)} .br b.m{color:var(--red)}
</style>
</head>
<body>
<div id="app"></div>

<!-- ▼ 수업 내용 ▼ -->
<script>
/* ===================================================================
   100억  —  내용 파일
   로또 → 일등석 → 짐싸기 8칸 → 비상착륙 → 환전 → 5일 생존 → 귀국
   * 이 파일은 두 html 안에 이미 들어가 있습니다. (참고용)
   =================================================================== */

window.FONT = 'Dongle';
window.FONT_SCALE = 1.42;

window.CFG = {
  teams: 8,
  slots: 8,        // 캐리어 칸수
  hp: 3,           // 조원 수
  packSec: 0       // 짐싸기 제한시간(초). 0이면 무제한. 교사 화면에서 바꿀 수 있음
};

/* ─────────────────────────────────────────────
   짐 후보 20개  (비싼 순으로 자동 정렬)
   price : 한국에서의 가격(원)
   cash  : 환전소에서 바꿔주는 돈(억). 금·보석·현금만 쳐준다. 0이면 안 쳐줌
   once  : true 면 한 번 쓰면 없어지는 소모품
   ───────────────────────────────────────────── */
window.GOODS = [
 { id:'cash',  em:'💵', name:'현금 다발',    sub:'100억 원',       price:10000000000, cash:100, kind:'lux'  },
 { id:'ring',  em:'💍', name:'다이아몬드 반지', sub:'3캐럿',        price:300000000,   cash:30,  kind:'lux'  },
 { id:'neck',  em:'📿', name:'금목걸이',      sub:'24K 100g',      price:50000000,    cash:5,   kind:'lux'  },
 { id:'watch', em:'⌚', name:'명품 시계',     sub:'스위스제',        price:30000000,    cash:0,   kind:'lux'  },
 { id:'coat',  em:'🧥', name:'명품 코트',     sub:'캐시미어 100%',   price:8000000,     cash:0,   kind:'lux', once:true  },
 { id:'cam',   em:'📷', name:'미러리스 카메라', sub:'여행 브이로그용',  price:1500000,    cash:0,   kind:'trip' },
 { id:'perf',  em:'🌸', name:'향수',         sub:'100ml',          price:300000,      cash:0,   kind:'lux', once:true  },
 { id:'spk',   em:'🔊', name:'블루투스 스피커', sub:'방수·소리 큼',    price:200000,     cash:0,   kind:'trip' },
 { id:'shoe',  em:'👟', name:'에어포스 운동화', sub:'한정판',         price:150000,      cash:0,   kind:'lux'  },
 { id:'rod',   em:'🎣', name:'낚싯대',       sub:'미끼 포함',        price:80000,       cash:0,   kind:'life' },
 { id:'swim',  em:'🩳', name:'수영복',       sub:'리조트 필수템',     price:50000,       cash:0,   kind:'trip' },
 { id:'knife', em:'🔪', name:'맥가이버칼',    sub:'12가지 기능',      price:50000,       cash:0,   kind:'life' },
 { id:'aid',   em:'🧰', name:'구급함',       sub:'소독약·붕대',      price:40000,       cash:0,   kind:'life', once:true },
 { id:'blank', em:'🧣', name:'담요',         sub:'두꺼운 것',        price:30000,       cash:0,   kind:'life' },
 { id:'tube',  em:'🛟', name:'튜브',         sub:'대형',            price:30000,       cash:0,   kind:'trip' },
 { id:'umb',   em:'☂️', name:'우산',         sub:'장우산',          price:20000,       cash:0,   kind:'life' },
 { id:'noodle',em:'🍜', name:'라면 20개',    sub:'한 박스',          price:20000,       cash:0,   kind:'life', once:true },
 { id:'mirror',em:'🪞', name:'손거울',       sub:'접이식',           price:10000,       cash:0,   kind:'life' },
 { id:'water', em:'💧', name:'생수 6병',     sub:'2L × 6',          price:6000,        cash:0,   kind:'life', once:true },
 { id:'fire',  em:'🔥', name:'라이터',       sub:'편의점 것',        price:1000,        cash:0,   kind:'life' }
];

/* 일등석 — 그냥 즐기는 장면 (점수 없음) */
window.FIRST = {

      <div class="sc">${s}<small>점</small></div>
      <div style="text-align:center;color:var(--dim);font-size:1.1em">5일 생존 점수</div>
      <div style="text-align:center;margin-top:8px;font-size:1.2em">
        조원 ${[0,1,2].map(i=>i<alive?'🧍':'🪦').join('')} ${alive}/3 무사</div>
      <div style="text-align:center;margin-top:8px;font-size:1.05em;color:var(--dim2)">
        짐 합계 ${won(packPrice(me))}</div>
      <div style="text-align:center;font-size:1.05em;color:var(--dim2)">
        안 쓰고 남긴 돈 ${eok(moneyOf(me))} → <b style="color:var(--red)">0점</b></div>
    </div>
    <div class="r"><div style="font-size:1.15em;font-weight:700;margin-bottom:4px">사건별 점수</div>${rows}
      <div style="font-size:1.05em;margin-top:10px;color:var(--dim)">끝까지 남은 짐</div>
      <div class="chips" style="justify-content:flex-start">${inv(me).map(id=>`<span>${G(id).em} ${G(id).name}</span>`).join('')||'<span>없음</span>'}</div>
    </div></div>`);
}

/* 짐싸기 카운트다운만 따로 (화면 전체를 다시 그리지 않음) */
setInterval(()=>{
  if(ST.phase!=='pack'||!ST.packEnd) return;
  const el=document.getElementById('cd'); if(!el) return;
  const left=Math.max(0,Math.ceil((ST.packEnd-Date.now())/1000));
  el.textContent=left+'초'; el.className='cd'+(left<=15?' hot':'');
},500);

/* 부팅 */
(async function boot(){try{
  const {initializeApp}=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
  const m=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
  DB=m.getFirestore(initializeApp(FIREBASE_CONFIG)); api=m; online=true;
  m.onSnapshot(m.collection(DB,'live'),snap=>{
    TEAMS={}; TRS={};
    snap.forEach(d=>{const id=d.id,v=d.data();
      if(id===STATE) ST=v;
      else if(id.startsWith(TEAM)) TEAMS[id.slice(TEAM.length)]=v;
      else if(id.startsWith(TR)&&v.kind==='tr'&&!v.done&&v.st==='wait') TRS[id]={...v,_id:id};});
    me=TEAMS[S.team]||{};
    render();
  },e=>{DIAG='읽기 오류: '+e.code;render(true);});
}catch(e){ DIAG='연결 실패'; render(true); }})();
render(true);
</script>
</body>
</html>
